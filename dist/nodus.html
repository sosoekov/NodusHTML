/* ===================== Построение графа ===================== */

function addEdge(map, from, to, directed, mechanismId){
  if (from === to) return;
  var pair = [from, to].sort();
  var key = pair.join('|||');
  var e = map.get(key);
  if (!e){
    e = {key:key, a:pair[0], b:pair[1], mechanismIds:new Set(), abDirected:false, baDirected:false};
    map.set(key, e);
  }
  e.mechanismIds.add(mechanismId);
  if (directed){
    if (from === e.a && to === e.b) e.abDirected = true;
    else if (from === e.b && to === e.a) e.baDirected = true;
  }
}

function buildGraph(mode){
  var nodes = [];
  var edgesMap = new Map();

  Object.keys(state.objects).forEach(function(id){
    var o = state.objects[id];
    if (!isShown(o)) return;
    nodes.push({id:'obj:'+id, refId:id, kind:'object', type:o.type, label:o.name, status:o.status, fx:o.fx, fy:o.fy});
  });

  var mechIds = Object.keys(state.mechanisms).filter(function(mid){ return isShown(state.mechanisms[mid]); });

  if (mode === 'full'){
    mechIds.forEach(function(mid){
      var m = state.mechanisms[mid];
      nodes.push({id:'mech:'+m.id, refId:m.id, kind:'mechanism', category:m.category, label:m.title, status:m.status, fx:m.fx, fy:m.fy});
      m.participants.forEach(function(p){
        if (!p.objectId || !state.objects[p.objectId] || !isShown(state.objects[p.objectId])) return;
        var role = roleInfo(p.role);
        var from, to, directed;
        if (role.direction === 'source'){ from='obj:'+p.objectId; to='mech:'+m.id; directed=true; }
        else if (role.direction === 'target'){ from='mech:'+m.id; to='obj:'+p.objectId; directed=true; }
        else { from='obj:'+p.objectId; to='mech:'+m.id; directed=false; }
        addEdge(edgesMap, from, to, directed, m.id);
      });
    });
  } else {
    mechIds.forEach(function(mid){
      var m = state.mechanisms[mid];
      var validParts = m.participants.filter(function(p){ return p.objectId && state.objects[p.objectId] && isShown(state.objects[p.objectId]); });
      var byDir = {source:[], target:[], neutral:[]};
      validParts.forEach(function(p){ byDir[roleInfo(p.role).direction].push(p); });
      if (byDir.source.length && byDir.target.length){
        byDir.source.forEach(function(s){
          byDir.target.forEach(function(t){ addEdge(edgesMap, 'obj:'+s.objectId, 'obj:'+t.objectId, true, m.id); });
        });
        byDir.neutral.forEach(function(n){
          byDir.target.forEach(function(t){ addEdge(edgesMap, 'obj:'+n.objectId, 'obj:'+t.objectId, false, m.id); });
        });
      } else {
        for (var i=0; i<validParts.length; i++){
          for (var j=i+1; j<validParts.length; j++){
            addEdge(edgesMap, 'obj:'+validParts[i].objectId, 'obj:'+validParts[j].objectId, false, m.id);
          }
        }
      }
    });
  }
  return {nodes:nodes, edges:Array.from(edgesMap.values())};
}

/* Вес объекта = число разных связанных с ним объектов + число механизмов, где он участвует.
   Вес механизма = число разных объектов-участников. Не зависит от режима отображения. */
function computeWeights(){
  var neighbors = {}, mechCount = {}, mechWeight = {};
  Object.keys(state.mechanisms).forEach(function(mid){
    var seen = {}, ids = [];
    state.mechanisms[mid].participants.forEach(function(p){
      if (p.objectId && state.objects[p.objectId] && !seen[p.objectId]){ seen[p.objectId] = true; ids.push(p.objectId); }
    });
    mechWeight[mid] = ids.length;
    ids.forEach(function(a){
      mechCount[a] = (mechCount[a]||0) + 1;
      var set = neighbors[a] || (neighbors[a] = new Set());
      ids.forEach(function(b){ if (b !== a) set.add(b); });
    });
  });
  var objWeight = {};
  Object.keys(state.objects).forEach(function(id){
    objWeight[id] = (neighbors[id] ? neighbors[id].size : 0) + (mechCount[id] || 0);
  });
  return {objects:objWeight, mechanisms:mechWeight};
}

/* Разброс случайного начального положения растёт с числом узлов,
   иначе тысяча узлов стартует в одной точке и долго разлетается. */
function initialSpread(count, minHalf){ return Math.max(minHalf, 25*Math.sqrt(count)); }

function syncGraphModel(){
  var built = buildGraph(currentMode);
  var spread = initialSpread(built.nodes.length, 130);
  var freshIds = new Set(built.nodes.map(function(n){return n.id;}));
  Array.from(nodeById.keys()).forEach(function(id){ if (!freshIds.has(id)) nodeById.delete(id); });
  built.nodes.forEach(function(fn){
    var existing = nodeById.get(fn.id);
    if (!existing){
      nodeById.set(fn.id, {
        id:fn.id, refId:fn.refId, kind:fn.kind, type:fn.type, category:fn.category,
        label:fn.label, status:fn.status,
        x:(Math.random()-0.5)*2*spread, y:(Math.random()-0.5)*2*spread,
        vx:0, vy:0, fx:fn.fx, fy:fn.fy
      });
    } else {
      existing.label = fn.label; existing.status = fn.status;
      existing.type = fn.type; existing.category = fn.category;
      existing.fx = fn.fx; existing.fy = fn.fy;
    }
  });
  currentNodes = built.nodes.map(function(fn){ return nodeById.get(fn.id); });
  currentEdges = built.edges;
  buildMechIndex();
  updateLegend();
  var weights = computeWeights();
  currentNodes.forEach(function(n){
    n.weight = (n.kind==='mechanism' ? weights.mechanisms[n.refId] : weights.objects[n.refId]) || 0;
  });
  /* Порядок, в котором подписи претендуют на место: сначала «тяжёлые». */
  if (focusMode && !focusMode.exiting) refreshFocusLayout();
  updateMinimapVisibility();
  labelOrder = currentNodes.slice().sort(function(a,b){
    return (b.weight - a.weight) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  });
  sim.alpha = Math.max(sim.alpha, 0.35);
  requestRender();
}

/* ===================== Симуляция сил ===================== */

/* Отталкивание считается через квадродерево (Barnes–Hut): далёкая группа узлов
   действует как один узел в своём центре масс. O(n log n) вместо O(n²). */
var BH_THETA_SQ = 0.81;
var BH_MAX_DEPTH = 40;

function bhCell(x0, y0, size){ return {x0:x0, y0:y0, size:size, mass:0, cx:0, cy:0, node:null, children:null}; }

function bhInsert(cell, n){
  var depth = 0;
  while (true){
    cell.cx = (cell.cx*cell.mass + n.x) / (cell.mass+1);
    cell.cy = (cell.cy*cell.mass + n.y) / (cell.mass+1);
    cell.mass++;
    if (cell.mass === 1 && !cell.children){ cell.node = n; return; }
    if (depth >= BH_MAX_DEPTH) return; /* совпадающие точки: копим только массу */
    if (!cell.children){
      var half = cell.size/2;
      cell.children = [
        bhCell(cell.x0, cell.y0, half), bhCell(cell.x0+half, cell.y0, half),
        bhCell(cell.x0, cell.y0+half, half), bhCell(cell.x0+half, cell.y0+half, half)
      ];
      var old = cell.node; cell.node = null;
      var oc = bhChild(cell, old);
      oc.node = old; oc.mass = 1; oc.cx = old.x; oc.cy = old.y;
    }
    cell = bhChild(cell, n);
    depth++;
  }
}
function bhChild(cell, n){
  var half = cell.size/2;
  return cell.children[(n.x >= cell.x0+half ? 1 : 0) + (n.y >= cell.y0+half ? 2 : 0)];
}

function buildQuadTree(nodes){
  var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.forEach(function(n){
    if (n.x<minX) minX=n.x; if (n.x>maxX) maxX=n.x;
    if (n.y<minY) minY=n.y; if (n.y>maxY) maxY=n.y;
  });
  var root = bhCell(minX-1, minY-1, Math.max(maxX-minX, maxY-minY) + 2);
  nodes.forEach(function(n){ bhInsert(root, n); });
  return root;
}

function tickSimulation(){
  var n = currentNodes.length;
  if (n === 0) return;
  var kk = 900*900;
  var root = buildQuadTree(currentNodes);
  var stack = [];
  for (var i=0;i<n;i++){
    var ni = currentNodes[i];
    var fx=0, fy=0;
    stack.length = 0; stack.push(root);
    while (stack.length){
      var c = stack.pop();
      if (c.mass === 0 || c.node === ni && c.mass === 1) continue;
      var dx = ni.x-c.cx, dy = ni.y-c.cy;
      var distSq = dx*dx+dy*dy;
      if (c.children && c.size*c.size >= BH_THETA_SQ*distSq){
        for (var q=0;q<4;q++) stack.push(c.children[q]);
        continue;
      }
      var mass = c.node === ni ? c.mass-1 : c.mass;
      if (distSq < 0.02){ dx=(Math.random()-0.5); dy=(Math.random()-0.5); distSq=1; }
      var dist = Math.sqrt(distSq);
      var force = mass*kk/distSq;
      fx += (dx/dist)*force; fy += (dy/dist)*force;
    }
    ni.vx += fx*0.0022*sim.alpha; ni.vy += fy*0.0022*sim.alpha;
  }
  var restLength = 150, springK = 0.02;
  currentEdges.forEach(function(e){
    var a = nodeById.get(e.a), b = nodeById.get(e.b);
    if (!a || !b) return;
    var dx=b.x-a.x, dy=b.y-a.y;
    var dist = Math.sqrt(dx*dx+dy*dy) || 1;
    var force = (dist-restLength)*springK*sim.alpha;
    var fx=(dx/dist)*force, fy=(dy/dist)*force;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  });
  var cx=0, cy=0;
  currentNodes.forEach(function(nd){ cx+=nd.x; cy+=nd.y; });
  cx/=n; cy/=n;
  currentNodes.forEach(function(nd){
    nd.vx += (0-cx)*0.0007; nd.vy += (0-cy)*0.0007;
  });
  currentNodes.forEach(function(nd){
    if (nd.fx !== null && nd.fx !== undefined && nd.fy !== null && nd.fy !== undefined){
      nd.x = nd.fx; nd.y = nd.fy; nd.vx=0; nd.vy=0; return;
    }
    nd.vx *= 0.84; nd.vy *= 0.84;
    nd.x += nd.vx; nd.y += nd.vy;
  });
  sim.alpha *= (1-sim.alphaDecay);
}

/* ===================== Подсветка ===================== */

/* ===================== Фокус (выделение / наведение) =====================
   Три уровня: центр и его прямые участники (first) — 100%; соседи второго порядка
   (second: другие механизмы тех же объектов и их участники) — 55%; остальное — 35%.
   Уровни считаются по механизмам-гиперрёбрам, а не по нарисованным рёбрам, поэтому
   одинаковы в обоих режимах графа. */
var mechIndex = { byObject:new Map(), parts:new Map() };

function buildMechIndex(){
  var byObject = new Map(), parts = new Map();
  Object.keys(state.mechanisms).forEach(function(mid){
    var seen = {}, list = [];
    state.mechanisms[mid].participants.forEach(function(p){
      if (p.objectId && state.objects[p.objectId] && !seen[p.objectId]){ seen[p.objectId] = true; list.push(p.objectId); }
    });
    parts.set(mid, list);
    list.forEach(function(oid){ (byObject.get(oid) || byObject.set(oid, []).get(oid)).push(mid); });
  });
  mechIndex = { byObject:byObject, parts:parts };
}

function addSecondOrder(first, second, objIds, skipMechs){
  objIds.forEach(function(oid){
    (mechIndex.byObject.get(oid) || []).forEach(function(mid){
      if (skipMechs.has(mid)) return;
      if (!first.has('mech:'+mid)) second.add('mech:'+mid);
      (mechIndex.parts.get(mid) || []).forEach(function(o2){ if (!first.has('obj:'+o2)) second.add('obj:'+o2); });
    });
  });
}

function objectFocus(oid){
  var center = 'obj:'+oid, first = new Set([center]), second = new Set();
  var mechs = new Set(mechIndex.byObject.get(oid) || []);
  var peers = [];
  mechs.forEach(function(mid){
    first.add('mech:'+mid);
    (mechIndex.parts.get(mid) || []).forEach(function(o){ first.add('obj:'+o); if (o !== oid) peers.push(o); });
  });
  addSecondOrder(first, second, peers, mechs);
  return {kind:'node', id:center, center:center, set:first, second:second};
}

function mechanismFocus(mid){
  var center = 'mech:'+mid, first = new Set([center]), second = new Set();
  var parts = mechIndex.parts.get(mid) || [];
  parts.forEach(function(o){ first.add('obj:'+o); });
  addSecondOrder(first, second, parts, new Set([mid]));
  return {kind:'mechanism', id:mid, center: currentMode==='full' ? center : null, set:first, second:second};
}

function nodeFocus(nid){
  if (nid.indexOf('mech:') === 0) return mechanismFocus(nid.slice(5));
  return objectFocus(nid.slice(4));
}

function getFocus(){
  var f = null;
  if (focusMode){
    f = mechanismFocus(focusMode.mechId);
    f.focusMode = true; f.second = new Set();
    if (hoverId && hoverId !== f.center) f.hover = hoverId;
    return f;
  }
  if (pinnedMechanismId && state.mechanisms[pinnedMechanismId]) f = mechanismFocus(pinnedMechanismId);
  else if (pinnedEdgeKey){
    var e = currentEdges.filter(function(x){return x.key===pinnedEdgeKey;})[0];
    if (e){
      var first = new Set([e.a, e.b]), second = new Set();
      e.mechanismIds.forEach(function(mid){
        first.add('mech:'+mid);
        (mechIndex.parts.get(mid) || []).forEach(function(o){ if (!first.has('obj:'+o)) second.add('obj:'+o); });
      });
      f = {kind:'edge', key:pinnedEdgeKey, center:null, set:first, second:second};
    }
  }
  else if (pinnedNodeId && nodeById.has(pinnedNodeId)) f = nodeFocus(pinnedNodeId);
  /* Выбор кликом (не наведение): у приглушённых узлов скрываются и подписи. */
  if (f) f.pinned = true;
  else if (hoverId) f = nodeFocus(hoverId);
  else if (listHover && listHover.kind === 'object' && state.objects[listHover.id]) f = objectFocus(listHover.id);
  else if (listHover && listHover.kind === 'mechanism' && state.mechanisms[listHover.id]) f = mechanismFocus(listHover.id);
  /* Наведение на чип/участника в карточке: без выделения — подсветка объекта, при
     выделении — рамка и подпись узла, а для участника ещё и его ребро. */
  if (graphHint && graphHint.objId && state.objects[graphHint.objId]){
    if (!f) f = objectFocus(graphHint.objId);
    f.hint = 'obj:' + graphHint.objId;
    if (graphHint.mechId) f.hintMech = graphHint.mechId;
  } else if (graphHint && graphHint.mechOnly && state.mechanisms[graphHint.mechOnly]){
    /* Наведение на механизм в карточке объекта: подсвечиваются рёбра механизма. */
    if (!f) f = mechanismFocus(graphHint.mechOnly);
    f.hintMechAll = graphHint.mechOnly;
    if (currentMode === 'full') f.hint = 'mech:' + graphHint.mechOnly;
  }
  /* Наведение поверх закреплённого выделения: подсветку не меняет, но подпись
     узла под курсором показывается (см. layoutLabels). */
  if (f && hoverId && hoverId !== f.center) f.hover = hoverId;
  else if (f && f.hint && f.hint !== f.center) f.hover = f.hint;
  return f;
}

function nodeAlpha(id, focus){
  if (focus.focusMode) return focus.set.has(id) ? THEME.alpha.nodeActive : THEME.alpha.focusOther;
  if (id === focus.center) return THEME.alpha.nodeActive;
  if (focus.set.has(id)) return THEME.alpha.nodeNeighbor;
  if (focus.second.has(id)) return THEME.alpha.nodeSecond;
  return THEME.alpha.nodeBackground;
}

function isEdgeHighlighted(e, focus){
  if (!focus) return false;
  if (focus.hintMechAll){
    if (currentMode === 'full'){ var hmid = 'mech:'+focus.hintMechAll; return e.a === hmid || e.b === hmid; }
    return e.mechanismIds.has(focus.hintMechAll);
  }
  if (focus.hintMech){
    /* Ребро участника: объект ↔ механизм (или рёбра этого механизма у объекта без режима механизмов). */
    var touches = e.a === focus.hint || e.b === focus.hint;
    if (currentMode === 'full'){ var hm = 'mech:'+focus.hintMech; return touches && (e.a === hm || e.b === hm); }
    return touches && e.mechanismIds.has(focus.hintMech);
  }
  if (focus.kind==='edge') return e.key===focus.key;
  if (focus.kind==='node') return e.a===focus.id || e.b===focus.id;
  if (focus.kind==='mechanism'){
    if (currentMode==='full'){ var mid='mech:'+focus.id; return e.a===mid || e.b===mid; }
    return e.mechanismIds.has(focus.id);
  }
  return false;
}

/* ===================== Подписи узлов =====================
   Подпись — на плашке цвета холста; у механизма над ромбом, у объекта под кругом.
   Приоритет места: центр выделения > его участники > узел под курсором > узлы
   с большей степенью > остальные. Эти три первые группы подписаны всегда: если
   основная позиция занята, пробуются запасные (сверху/снизу/сбоку). Остальные
   подписи при пересечении скрываются и при отдалении гаснут, начиная с «лёгких». */
var LABEL_MIN_PX = 7;
var LABEL_FADE_PX = 3;
var LABEL_CELL = 64;
var LABEL_PAD_X = 5;
var LABEL_H = 18;          /* высота плашки в одну строку */
var LABEL_LINE_H = 14;     /* каждая следующая строка */
var LABEL_GAP = 4;
var LABEL_MAX_CHARS = 24;  /* ширина строки подписи, символов */
var LABEL_MAX_LINES = 2;

/* Перенос по словам: до LABEL_MAX_LINES строк по LABEL_MAX_CHARS символов;
   не поместилось — многоточие (полный текст — во всплывающей подсказке). */
function wrapLabel(text){
  var words = String(text || '').replace(/\s+/g, ' ').trim().split(' ');
  var lines = [], cur = '', i = 0;
  while (i < words.length && lines.length < LABEL_MAX_LINES){
    var w = words[i];
    if (!cur && w.length > LABEL_MAX_CHARS){ lines.push(w.slice(0, LABEL_MAX_CHARS)); words[i] = w.slice(LABEL_MAX_CHARS); continue; }
    var next = cur ? cur + ' ' + w : w;
    if (next.length <= LABEL_MAX_CHARS){ cur = next; i++; }
    else { lines.push(cur); cur = ''; }
  }
  if (cur && lines.length < LABEL_MAX_LINES) lines.push(cur);
  var truncated = i < words.length;
  if (truncated){
    var last = lines[lines.length - 1];
    lines[lines.length - 1] = (last.length >= LABEL_MAX_CHARS ? last.slice(0, LABEL_MAX_CHARS - 1) : last).replace(/\s+$/, '') + '…';
  }
  return {lines:lines, truncated:truncated};
}
function labelInfo(ctx, n){
  if (n._labelFor !== n.label){
    var wr = wrapLabel(n.label);
    n._labelLines = wr.lines; n._labelTruncated = wr.truncated;
    n._labelW = Math.max.apply(null, wr.lines.map(function(l){ return ctx.measureText(l).width; }).concat([0]));
    n._labelFor = n.label;
  }
  return n;
}
function labelWidth(ctx, n){ return labelInfo(ctx, n)._labelW; }
function labelHeight(n){ return LABEL_H + ((n._labelLines ? n._labelLines.length : 1) - 1)*LABEL_LINE_H; }

function labelCandidates(n, forced, w){
  var r = nodeRadius(n)*view.scale;
  var sx = n.x*view.scale + view.offsetX, sy = n.y*view.scale + view.offsetY;
  var h = labelHeight(n);
  var below = {cx:sx, cy:sy + r + LABEL_GAP + h/2};
  var above = {cx:sx, cy:sy - r - LABEL_GAP - h/2};
  var list = n.kind==='mechanism' ? [above, below] : [below, above];
  if (!forced) return list;
  var right = {cx:sx + r + LABEL_GAP + w/2, cy:sy}, left = {cx:sx - r - LABEL_GAP - w/2, cy:sy};
  var below2 = {cx:sx, cy:below.cy + h + 2}, above2 = {cx:sx, cy:above.cy - h - 2};
  var dr = {cx:right.cx, cy:below.cy}, dl = {cx:left.cx, cy:below.cy}, ur = {cx:right.cx, cy:above.cy}, ul = {cx:left.cx, cy:above.cy};
  return list.concat([right, left, dr, dl, ur, ul, below2, above2]);
}

function layoutLabels(ctx, focus){
  ctx.font = THEME.labelFont;
  var placed = [], grid = new Map(), done = new Set();
  function cells(b, fn){
    for (var gx=Math.floor(b.x0/LABEL_CELL); gx<=Math.floor(b.x1/LABEL_CELL); gx++)
      for (var gy=Math.floor(b.y0/LABEL_CELL); gy<=Math.floor(b.y1/LABEL_CELL); gy++) if (fn(gx+':'+gy)) return true;
    return false;
  }
  function overlaps(b){
    return cells(b, function(key){
      var list = grid.get(key);
      return !!list && list.some(function(o){ return b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0; });
    });
  }
  function add(b){
    cells(b, function(key){ (grid.get(key) || grid.set(key, []).get(key)).push(b); return false; });
    placed.push(b);
  }
  function box(n, c, w, alpha){
    var h = labelHeight(n);
    return {x0:c.cx - w/2, x1:c.cx + w/2, y0:c.cy - h/2, y1:c.cy + h/2, cx:c.cx, cy:c.cy, n:n, alpha:alpha};
  }
  function onScreen(b){ return !(b.x1 < 0 || b.x0 > viewportWidth || b.y1 < 0 || b.y0 > viewportHeight); }
  function place(n, forced, alpha){
    if (done.has(n.id)) return;
    var w = labelWidth(ctx, n) + 2*LABEL_PAD_X;
    var cands = labelCandidates(n, forced, w);
    for (var i=0; i<cands.length; i++){
      var b = box(n, cands[i], w, alpha);
      if (!onScreen(b)) continue;
      if (!overlaps(b)){ add(b); done.add(n.id); return; }
    }
    if (forced){
      var b0 = box(n, cands[0], w, alpha);
      if (onScreen(b0)){ add(b0); done.add(n.id); }
    }
  }
  function fadeAlpha(n){
    var sizePx = labelRadius(n)*view.scale;
    if (sizePx < LABEL_MIN_PX) return 0;
    return Math.min(1, (sizePx-LABEL_MIN_PX)/LABEL_FADE_PX + 0.25);
  }

  if (focus && focus.focusMode){
    if (focus.center && nodeById.has(focus.center)) place(nodeById.get(focus.center), true, 1);
    labelOrder.forEach(function(n){ if (focus.set.has(n.id)) place(n, true, 1); });
    if (focus.hover && nodeById.has(focus.hover)) place(nodeById.get(focus.hover), true, 1);
    return placed;
  }
  if (focus){
    if (focus.center && nodeById.has(focus.center)) place(nodeById.get(focus.center), true, 1);
    labelOrder.forEach(function(n){ if (focus.set.has(n.id)) place(n, true, 1); });
    if (focus.hover && nodeById.has(focus.hover)) place(nodeById.get(focus.hover), true, 1);
    if (focus.pinned) return placed;
    labelOrder.forEach(function(n){
      if (!focus.second.has(n.id)) return;
      var a = fadeAlpha(n); if (a) place(n, false, Math.max(THEME.alpha.labelBackground, a*THEME.alpha.labelSecond));
    });
    labelOrder.forEach(function(n){
      var a = fadeAlpha(n); if (a) place(n, false, THEME.alpha.labelBackground);
    });
    return placed;
  }
  if (graphFilter){
    /* Сначала место под подписи отобранных, потом — остальных. */
    labelOrder.forEach(function(n){ if (graphFilter.nodes.has(n.id)){ var a = fadeAlpha(n); if (a) place(n, false, a); } });
    labelOrder.forEach(function(n){ if (!graphFilter.nodes.has(n.id)){ var a = fadeAlpha(n); if (a) place(n, false, a*THEME.alpha.labelBackground); } });
    return placed;
  }
  labelOrder.forEach(function(n){ var a = fadeAlpha(n); if (a) place(n, false, a); });
  return placed;
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r); ctx.closePath();
}

function drawLabels(ctx, labels){
  ctx.font = THEME.labelFont;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  labels.forEach(function(b){
    /* Плашка всегда плотная — чтобы и бледная подпись читалась поверх узлов. */
    ctx.globalAlpha = THEME.alpha.labelPlate;
    ctx.fillStyle = THEME.bg;
    ctx.beginPath(); roundRectPath(ctx, b.x0, b.y0, b.x1-b.x0, b.y1-b.y0, 3); ctx.fill();
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = THEME.text;
    var lines = b.n._labelLines || [b.n.label];
    var y = b.cy - (lines.length - 1)*LABEL_LINE_H/2 + 0.5;
    lines.forEach(function(l, i){ ctx.fillText(l, b.cx, y + i*LABEL_LINE_H); });
  });
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 1;
}

/* ===================== Отрисовка ===================== */

function screenToWorld(sx, sy){ return { x:(sx-view.offsetX)/view.scale, y:(sy-view.offsetY)/view.scale }; }

function drawGrid(ctx){
  var spacing = 50;
  var tl = screenToWorld(0,0), br = screenToWorld(viewportWidth, viewportHeight);
  var cols = (br.x-tl.x)/spacing, rows = (br.y-tl.y)/spacing;
  while (cols*rows > 3000 && spacing < 4000){ spacing*=2; cols=(br.x-tl.x)/spacing; rows=(br.y-tl.y)/spacing; }
  var startX = Math.floor(tl.x/spacing)*spacing, startY = Math.floor(tl.y/spacing)*spacing;
  ctx.fillStyle = THEME.grid;
  ctx.beginPath();
  for (var x=startX; x<br.x; x+=spacing){
    for (var y=startY; y<br.y; y+=spacing){
      ctx.moveTo(x+1.1, y); ctx.arc(x,y,1.1,0,Math.PI*2);
    }
  }
  ctx.fill();
}

/* Круг не меньше NODE_MIN_R, чтобы в него помещалась метка типа (12px). */
var NODE_MIN_R = 16, NODE_MAX_R = 40;
function radiusForWeight(w){ return Math.min(NODE_MAX_R, 8 + 4*Math.sqrt(w || 0)); }
function nodeRadius(n){
  if (n.kind==='mechanism') return 12;
  return Math.max(NODE_MIN_R, radiusForWeight(n.weight));
}
/* Радиус, по которому решается видимость подписи: у механизма ромб постоянного
   размера, но подпись гаснет по числу участников — как у объекта того же веса. */
function labelRadius(n){ return radiusForWeight(n.weight); }

/* Отрисовка пакетами: элементы одного стиля собираются в один path и рисуются
   одним fill/stroke — на тысячах узлов это в разы быстрее поштучных вызовов. */

function diamondPath(ctx, x, y, r){
  ctx.moveTo(x, y-r); ctx.lineTo(x+r, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r, y); ctx.closePath();
}

function drawFocusBrackets(ctx, x, y, half){
  var len = 8;
  ctx.strokeStyle = THEME.accent; ctx.lineWidth = 1.6;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(c){
    var sx=c[0], sy=c[1];
    var cx = x+sx*half, cy = y+sy*half;
    ctx.beginPath(); ctx.moveTo(cx-sx*len, cy); ctx.lineTo(cx,cy); ctx.lineTo(cx, cy-sy*len); ctx.stroke();
  });
}

function arrowheadPath(ctx, fromX, fromY, toX, toY){
  var angle = Math.atan2(toY-fromY, toX-fromX);
  var size = 7;
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - size*Math.cos(angle-Math.PI/6), toY - size*Math.sin(angle-Math.PI/6));
  ctx.lineTo(toX - size*Math.cos(angle+Math.PI/6), toY - size*Math.sin(angle+Math.PI/6));
  ctx.closePath();
}

function edgeGeometry(e){
  var a = nodeById.get(e.a), b = nodeById.get(e.b);
  var ra = nodeRadius(a), rb = nodeRadius(b);
  var dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy)||1;
  var ux=dx/dist, uy=dy/dist;
  return {e:e, sx:a.x+ux*ra, sy:a.y+uy*ra, ex:b.x-ux*rb, ey:b.y-uy*rb};
}

/* Стиль ребра по роли. С механизмами: источник → механизм — сплошная,
   механизм → приёмник — пунктир, роль без направления (Параметр, Условие) — точки.
   Без механизмов (объект → объект): направленная связь — сплошная, без направления — точки. */
var EDGE_DASH = { solid:[], dashed:[6,4], dotted:[1.5,3.5] };

function edgeStyle(e){
  if (currentMode === 'full'){
    var aIsMech = e.a.indexOf('mech:') === 0;
    var objToMech = aIsMech ? e.baDirected : e.abDirected;
    var mechToObj = aIsMech ? e.abDirected : e.baDirected;
    if (objToMech) return 'solid';
    if (mechToObj) return 'dashed';
    return 'dotted';
  }
  return (e.abDirected || e.baDirected) ? 'solid' : 'dotted';
}

function drawEdgeBatch(ctx, list, hl, alpha, style){
  if (!list.length) return;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = hl ? THEME.accent : THEME.edge;
  ctx.lineWidth = hl ? 2 : 1;
  ctx.setLineDash(EDGE_DASH[style].map(function(d){ return d/view.scale; }));
  ctx.lineCap = style === 'dotted' ? 'round' : 'butt';
  ctx.beginPath();
  list.forEach(function(g){ ctx.moveTo(g.sx,g.sy); ctx.lineTo(g.ex,g.ey); });
  ctx.stroke();
  ctx.setLineDash([]); ctx.lineCap = 'butt';

  ctx.fillStyle = hl ? THEME.accent : THEME.arrow;
  ctx.beginPath();
  list.forEach(function(g){
    if (g.e.abDirected) arrowheadPath(ctx, g.sx,g.sy,g.ex,g.ey);
    if (g.e.baDirected) arrowheadPath(ctx, g.ex,g.ey,g.sx,g.sy);
  });
  ctx.fill();

  var multi = list.filter(function(g){ return g.e.mechanismIds.size > 1; });
  if (!multi.length) return;
  ctx.beginPath();
  multi.forEach(function(g){
    var mx=(g.sx+g.ex)/2, my=(g.sy+g.ey)/2;
    ctx.moveTo(mx+9, my); ctx.arc(mx,my,9,0,Math.PI*2);
  });
  ctx.fillStyle = THEME.bg; ctx.fill();
  ctx.strokeStyle = THEME.badgeStroke; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle = THEME.accent; ctx.font = THEME.badgeFont;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  multi.forEach(function(g){ ctx.fillText(String(g.e.mechanismIds.size), (g.sx+g.ex)/2, (g.sy+g.ey)/2+0.5); });
  ctx.textBaseline='alphabetic';
}

/* Рёбра группируются по (подсветка, прозрачность, стиль) и рисуются от самых
   бледных к подсвеченным. Прозрачность обычного ребра — как у более бледного конца. */
function drawEdges(ctx, edges, focus){
  var groups = new Map();
  edges.forEach(function(e){
    var hl = !!focus && isEdgeHighlighted(e, focus);
    var alpha;
    if (focus) alpha = hl ? 1 : Math.min(nodeAlpha(e.a, focus), nodeAlpha(e.b, focus));
    else if (graphFilter) alpha = graphFilter.edge(e) ? 1 : THEME.alpha.edgeFiltered;
    else alpha = 1;
    var style = edgeStyle(e);
    var key = (hl?1:0) + '|' + alpha + '|' + style;
    var g = groups.get(key) || groups.set(key, {hl:hl, alpha:alpha, style:style, list:[]}).get(key);
    g.list.push(edgeGeometry(e));
  });
  Array.from(groups.values())
    .sort(function(a,b){ return (a.hl - b.hl) || (a.alpha - b.alpha); })
    .forEach(function(g){ drawEdgeBatch(ctx, g.list, g.hl, g.alpha, g.style); });
  ctx.globalAlpha = 1;
}

/* Узлы одного прохода имеют одну базовую прозрачность; приглушённые рисуются
   первым проходом, чтобы не перекрывать узлы в фокусе. */
function drawNodeBatch(ctx, nodes, baseAlpha){
  var fills = new Map(), stubs = [], mechs = new Map();
  nodes.forEach(function(n){
    if (n.kind==='mechanism'){
      var color = categoryAccent(n.category);
      (mechs.get(color) || mechs.set(color, []).get(color)).push(n);
      return;
    }
    var key = typeColor(n.type) + '|' + (n.status==='deprecated' ? THEME.alpha.deprecated : 1);
    (fills.get(key) || fills.set(key, []).get(key)).push(n);
    if (n.status==='stub') stubs.push(n);
  });
  fills.forEach(function(list, key){
    var parts = key.split('|');
    ctx.globalAlpha = baseAlpha * Number(parts[1]);
    ctx.fillStyle = parts[0];
    ctx.beginPath();
    list.forEach(function(n){ var r = nodeRadius(n); ctx.moveTo(n.x+r, n.y); ctx.arc(n.x,n.y,r,0,Math.PI*2); });
    ctx.fill();
  });
  if (stubs.length){
    ctx.globalAlpha = baseAlpha;
    ctx.setLineDash([3,3]); ctx.strokeStyle=THEME.stubStroke; ctx.lineWidth=1.4;
    ctx.beginPath();
    stubs.forEach(function(n){ var r = nodeRadius(n); ctx.moveTo(n.x+r, n.y); ctx.arc(n.x,n.y,r,0,Math.PI*2); });
    ctx.stroke(); ctx.setLineDash([]);
  }
  /* Метки типа только у неприглушённых узлов: в бледном круге они читаются как шум. */
  if (baseAlpha >= 1) drawTypeTags(ctx, fills, baseAlpha);
  mechs.forEach(function(list, color){
    ctx.globalAlpha = baseAlpha;
    ctx.beginPath();
    list.forEach(function(n){ diamondPath(ctx, n.x, n.y, nodeRadius(n)); });
    ctx.fillStyle = THEME.panel; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

/* Метка типа внутри круга: экранный размер как у подписей (12px); рисуется, только
   если помещается в круг на текущем масштабе. */
var TYPE_TAG_PAD = 2;
var typeTagWidthCache = {};
function typeTagWidth(ctx, text){
  if (typeTagWidthCache[text] === undefined){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.font = THEME.typeTagWeight + ' ' + THEME.labelSize + 'px ' + THEME.sans;
    typeTagWidthCache[text] = ctx.measureText(text).width;
    ctx.restore();
  }
  return typeTagWidthCache[text];
}
function drawTypeTags(ctx, fills, baseAlpha){
  var scale = view.scale;
  ctx.font = THEME.typeTagWeight + ' ' + (THEME.labelSize/scale) + 'px ' + THEME.sans;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = THEME.nodeText;
  fills.forEach(function(list, key){
    ctx.globalAlpha = baseAlpha * Number(key.split('|')[1]);
    list.forEach(function(n){
      var tag = typeShort(n.type);
      if (!tag) return;
      if (typeTagWidth(ctx, tag) + TYPE_TAG_PAD > 2*nodeRadius(n)*scale) return;
      ctx.fillText(tag, n.x, n.y + 0.5/scale);
    });
  });
  ctx.textBaseline = 'alphabetic';
}

function drawNodes(ctx, nodes, focus){
  if (!focus && graphFilter){
    drawNodeBatch(ctx, nodes.filter(function(n){ return !graphFilter.nodes.has(n.id); }), THEME.alpha.nodeFiltered);
    drawNodeBatch(ctx, nodes.filter(function(n){ return graphFilter.nodes.has(n.id); }), 1);
    return;
  }
  if (!focus){ drawNodeBatch(ctx, nodes, 1); return; }
  /* Слои от бледных к ярким: фон → второй порядок → участники → центр. */
  var layers = new Map();
  nodes.forEach(function(n){
    var a = nodeAlpha(n.id, focus);
    var key = (n.id === focus.center ? 3 : focus.set.has(n.id) ? 2 : focus.second.has(n.id) ? 1 : 0);
    (layers.get(key) || layers.set(key, {alpha:a, list:[]}).get(key)).list.push(n);
  });
  [0,1,2,3].forEach(function(k){ var l = layers.get(k); if (l) drawNodeBatch(ctx, l.list, l.alpha); });
  nodes.forEach(function(n){
    var showBracket = (focus.hint === n.id) ||
      (focus.kind==='node' && focus.id===n.id) ||
      (focus.kind==='mechanism' && n.id===('mech:'+focus.id)) ||
      (focus.kind==='edge' && focus.set.has(n.id));
    if (showBracket) drawFocusBrackets(ctx, n.x, n.y, nodeRadius(n)+6);
  });
}

var lastLabels = [];
function render(){
  var focus = getFocus();
  ctx2d.save();
  ctx2d.clearRect(0,0,viewportWidth, viewportHeight);
  ctx2d.translate(view.offsetX, view.offsetY);
  ctx2d.scale(view.scale, view.scale);
  drawGrid(ctx2d);
  /* Отсечение: не рисуем то, что целиком за пределами экрана. */
  var tl = screenToWorld(0,0), br = screenToWorld(viewportWidth, viewportHeight);
  var pad = 60;
  var x0 = tl.x-pad, y0 = tl.y-pad, x1 = br.x+pad, y1 = br.y+pad;
  drawEdges(ctx2d, currentEdges.filter(function(e){
    var a = nodeById.get(e.a), b = nodeById.get(e.b);
    if (!a || !b) return false;
    return !((a.x<x0 && b.x<x0) || (a.x>x1 && b.x>x1) || (a.y<y0 && b.y<y0) || (a.y>y1 && b.y>y1));
  }), focus);
  drawNodes(ctx2d, currentNodes.filter(function(n){
    return n.x>=x0 && n.x<=x1 && n.y>=y0 && n.y<=y1;
  }), focus);
  ctx2d.restore();
  var labels = layoutLabels(ctx2d, focus);
  lastLabels = labels;
  drawLabels(ctx2d, labels);
  edgeLabelBoxes = focusMode ? drawFocusEdgeLabels(ctx2d, labels) : [];
  drawMinimap();
}

function requestRender(){
  if (renderRequested) return;
  renderRequested = true;
  requestAnimationFrame(function(){
    renderRequested = false;
    /* В фокус-режиме физика стоит: раскладка фокуса временная и не должна плыть. */
    if (!focusMode && sim.alpha > sim.alphaMin){ tickSimulation(); requestRender(); }
    else maybeInitialFit();
    render();
  });
}

/* ===================== Взаимодействие с канвасом ===================== */

function hitTestNode(wx, wy){
  for (var i=currentNodes.length-1; i>=0; i--){
    var n = currentNodes[i];
    var r = nodeRadius(n) + 3;
    var dx = wx-n.x, dy = wy-n.y;
    if (dx*dx+dy*dy <= r*r) return n;
  }
  return null;
}
function pointToSegmentDist(px,py,x1,y1,x2,y2){
  var dx=x2-x1, dy=y2-y1;
  var lenSq = dx*dx+dy*dy;
  var t = lenSq===0 ? 0 : ((px-x1)*dx+(py-y1)*dy)/lenSq;
  t = Math.max(0, Math.min(1,t));
  var cx=x1+t*dx, cy=y1+t*dy;
  return Math.hypot(px-cx, py-cy);
}
function hitTestEdge(wx, wy){
  var threshold = 6/view.scale;
  for (var i=0;i<currentEdges.length;i++){
    var e = currentEdges[i];
    var a = nodeById.get(e.a), b = nodeById.get(e.b);
    if (!a || !b) continue;
    if (pointToSegmentDist(wx,wy,a.x,a.y,b.x,b.y) <= threshold) return e;
  }
  return null;
}

function persistNodePosition(node){
  if (node.kind==='object'){
    var o = state.objects[node.refId];
    if (o){ o.fx = node.x; o.fy = node.y; }
  } else {
    var m = state.mechanisms[node.refId];
    if (m){ m.fx = node.x; m.fy = node.y; }
  }
  persist();
}

function onMouseDown(ev){
  cancelViewAnim();
  var rect = canvasEl.getBoundingClientRect();
  var sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
  var w = screenToWorld(sx,sy);
  var node = hitTestNode(w.x,w.y);
  mouseDownPos = {sx:sx, sy:sy}; didDrag = false;
  if (node){
    dragNode = node;
  } else {
    isPanning = true;
    panStart = {sx:sx, sy:sy, offsetX:view.offsetX, offsetY:view.offsetY};
    canvasEl.style.cursor = 'grabbing';
  }
}
function onMouseMove(ev){
  var rect = canvasEl.getBoundingClientRect();
  var sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
  if (mouseDownPos){
    var moved = Math.hypot(sx-mouseDownPos.sx, sy-mouseDownPos.sy);
    if (moved > 3) didDrag = true;
  }
  if (dragNode){
    if (focusMode) return; /* в фокусе узлы не перетаскиваются — раскладка временная */
    var w = screenToWorld(sx,sy);
    dragNode.x = w.x; dragNode.y = w.y; dragNode.fx = w.x; dragNode.fy = w.y; dragNode.vx=0; dragNode.vy=0;
    requestRender();
    return;
  }
  if (isPanning){
    view.offsetX = panStart.offsetX + (sx-panStart.sx);
    view.offsetY = panStart.offsetY + (sy-panStart.sy);
    requestRender();
    return;
  }
  var wp = screenToWorld(sx,sy);
  var node = hitTestNode(wp.x,wp.y);
  if (focusMode) updateCanvasTooltip(sx, sy);
  else updateGraphTooltip(sx, sy, node, wp);
  var newHoverId = node ? node.id : null;
  if (newHoverId !== hoverId){
    hoverId = newHoverId;
    canvasEl.style.cursor = node ? 'pointer' : (hitTestEdge(wp.x,wp.y) ? 'pointer' : 'grab');
    requestRender();
  }
}
function onMouseUp(ev){
  var rect = canvasEl.getBoundingClientRect();
  var sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
  var w = screenToWorld(sx,sy);
  if (dragNode){
    if (!didDrag || focusMode){
      if (!didDrag) selectNode(dragNode);
    } else {
      persistNodePosition(dragNode);
      sim.alpha = Math.max(sim.alpha, 0.2);
      requestRender();
    }
    dragNode = null;
  } else if (isPanning){
    if (!didDrag){
      var edge = hitTestEdge(w.x,w.y);
      if (edge) selectEdge(edge); else clearSelection();
    }
    isPanning = false;
    canvasEl.style.cursor = 'grab';
  }
  mouseDownPos = null; didDrag = false;
}
function onDblClick(ev){
  var rect = canvasEl.getBoundingClientRect();
  var w = screenToWorld(ev.clientX-rect.left, ev.clientY-rect.top);
  var node = hitTestNode(w.x, w.y);
  if (node && node.kind === 'mechanism') enterFocus(node.refId);
}
function onWheel(ev){
  ev.preventDefault();
  cancelViewAnim();
  var rect = canvasEl.getBoundingClientRect();
  var sx = ev.clientX-rect.left, sy = ev.clientY-rect.top;
  var before = screenToWorld(sx,sy);
  var factor = Math.exp(-ev.deltaY*0.001);
  view.scale = clampScale(view.scale*factor);
  view.offsetX = sx - before.x*view.scale;
  view.offsetY = sy - before.y*view.scale;
  requestRender();
}

function selectNode(node){
  if (node.kind === 'object'){

function switchView(view){

/* Заголовок карточки редактируется по клику: Enter / уход фокуса — сохранить,
   Esc — отменить. Пустое название не сохраняется. validate(v) — необязательная проверка:
   вернула текст ошибки — значение не сохраняется, ошибка показывается под заголовком. */
function bindInlineTitle(panel, getValue, setValue, fieldLabel, validate){
  var h = panel.querySelector('.inline-title');
  var msg = panel.querySelector('.inline-msg');
  var msgTimer = null;
  function showMsg(text){
    msg.textContent = text; msg.hidden = false;
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(function(){ msg.hidden = true; }, 2500);
  }
  function start(){
    if (panel.querySelector('.inline-title-input')) return;
    var input = document.createElement('input');
    input.type = 'text'; input.className = 'field-input inline-title-input';
    input.value = getValue();
    input.setAttribute('aria-label', fieldLabel || 'Название');
    input.placeholder = fieldLabel || 'Название';
    input.title = fieldLabel || 'Название';
    h.hidden = true;
    h.parentNode.insertBefore(input, h.nextSibling);
    input.focus(); input.select();
    var finished = false;
    function finish(save){
      if (finished) return; finished = true;
      var v = input.value.trim(), err;
      if (save && !v) showMsg((fieldLabel || 'Название') + ' не может быть пустым — оставлено прежнее.');
      else if (save && v !== getValue() && validate && (err = validate(v))) showMsg(err + ' Оставлено прежнее.');
      else if (save && v !== getValue()) setValue(v);
      h.textContent = getValue();
      input.remove(); h.hidden = false;
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); finish(true); h.focus(); }
      else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); h.focus(); }
    });
    input.addEventListener('blur', function(){ finish(true); });
  }
  h.addEventListener('click', start);
  h.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); start(); } });
  panel.querySelectorAll('.save-indicator').forEach(renderSaveIndicator);
}

/* Всплывающее меню у кнопки/бейджа. items: [{value, label, icon?, color?, current?, danger?, sep?}] */
var popoverMenu = null;
function closePopoverMenu(){
  if (!popoverMenu) return;
  popoverMenu.anchor.setAttribute('aria-expanded', 'false');
  popoverMenu.el.remove();
  document.removeEventListener('mousedown', popoverMenu.outside, true);
  popoverMenu = null;
}
function openPopoverMenu(anchor, items, onPick){
  var reopen = popoverMenu && popoverMenu.anchor === anchor;
  closePopoverMenu();
  if (reopen) return;
  var el = document.createElement('div');
  el.className = 'menu popover-menu';
  el.setAttribute('role', 'menu');
  el.innerHTML = items.map(function(it, i){
    if (it.sep) return '<div class="menu-sep" role="separator"></div>';
    return '<button type="button" role="menuitem" class="menu-item' + (it.danger ? ' menu-item-danger' : '') + (it.current ? ' is-current' : '') + '" data-i="' + i + '"' +
      (it.color ? ' style="--c:' + it.color + '"' : '') + '>' + (it.icon || '') + '<span>' + escapeHtml(it.label) + '</span></button>';
  }).join('');
  document.body.appendChild(el);
  var r = anchor.getBoundingClientRect();
  var left = Math.min(r.left, window.innerWidth - el.offsetWidth - 8);
  var top = r.bottom + 4;
  if (top + el.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - el.offsetHeight - 4);
  el.style.left = Math.max(8, left) + 'px'; el.style.top = top + 'px';
  anchor.setAttribute('aria-expanded', 'true');
  var outside = function(ev){ if (!el.contains(ev.target) && !anchor.contains(ev.target)) closePopoverMenu(); };
  popoverMenu = {el:el, anchor:anchor, outside:outside};
  document.addEventListener('mousedown', outside, true);
  el.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closePopoverMenu(); anchor.focus(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); e.stopPropagation();
      var btns = Array.prototype.slice.call(el.querySelectorAll('.menu-item'));
      var i = btns.indexOf(document.activeElement);
      btns[(i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length].focus();
    }
  });
  el.querySelectorAll('.menu-item').forEach(function(b){
    b.addEventListener('click', function(){ var it = items[Number(b.getAttribute('data-i'))]; closePopoverMenu(); onPick(it.value); });
  });
  var first = el.querySelector('.is-current') || el.querySelector('.menu-item');
  if (first) first.focus();
}

/* Поле карточки в режиме просмотра: значение текстом; клик — редактирование;

function bindViewField(panel, key, opt){

    var v = opt.get();

    view.innerHTML = empty ? '+ ' + escapeHtml(opt.addText) : (opt.format ? opt.format(v) : escapeHtml(v)) + PENCIL_SVG;
    view.title = empty ? '' : 'Нажмите, чтобы изменить';

  function edit(){
    var input = document.createElement(opt.multiline ? 'textarea' : 'input');
    if (!opt.multiline) input.type = 'text';
    input.className = 'field-input vfield-input' + (opt.multiline ? ' vfield-textarea' : '');
    input.value = opt.toText ? opt.toText(opt.get()) : (opt.get() || '');
    if (opt.placeholder) input.placeholder = opt.placeholder;
    input.setAttribute('aria-label', opt.label);
    view.hidden = true;
    wrap.appendChild(input);

      if (!opt.multiline) return;
      var scroller = panel.closest('#detail-panel') || panel;
      var cap = Math.max(120, scroller.clientHeight * 0.6);

      input.style.height = Math.min(input.scrollHeight + 2, cap) + 'px';
      input.style.overflowY = input.scrollHeight + 2 > cap ? 'auto' : 'hidden';
    }
    input.addEventListener('input', fit);
    fit(); input.focus();
    var done = false;

        if (JSON.stringify(nv) !== JSON.stringify(opt.get())) opt.set(nv);
      }

    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); view.focus(); }
      else if (e.key === 'Enter' && (!opt.multiline || e.ctrlKey || e.metaKey)){ e.preventDefault(); finish(true); view.focus(); }
    });
    input.addEventListener('blur', function(){ finish(true); });
  }
  view.addEventListener('click', edit);
  view.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); edit(); } });
  renderView();
}

/* ----- Имя в конфигураторе: префикс вида метаданных + идентификатор.
   Хранится по-прежнему одной строкой fullName («Документ.ЗаявкаНаПодборПерсонала»). ----- */
function splitFullName(fullName){
  var s = fullName || '', d = s.indexOf('.');
  return d < 0 ? {prefix:'', id:s} : {prefix:s.slice(0, d), id:s.slice(d + 1)};
}
function fullNamePrefix(obj){
  var t = typeInfo(obj.type);
  return t ? t.name1c : splitFullName(obj.fullName).prefix;
}
function validIdentifier(v){ return !v || (!/[\s.]/.test(v) && !/^\d/.test(v)); }
var IDENTIFIER_RULE = 'Идентификатор — без пробелов и точек и не начинается с цифры.';

function name1cHTML(obj){
  var id = splitFullName(obj.fullName).id, prefix = fullNamePrefix(obj);
  return '<div class="name1c" title="Имя в конфигураторе' + (obj.fullName ? ': ' + escapeHtml(obj.fullName) : '') + '">' +
    (prefix ? '<span class="name1c-prefix">' + escapeHtml(prefix) + '.</span>' : '') +
    '<span class="name1c-id' + (id ? '' : ' is-empty') + '" tabindex="0">' + (id ? escapeHtml(id) : '+ Добавить имя в конфигураторе') + '</span>' +
    (id ? '<button type="button" class="copy-btn" title="Скопировать имя в конфигураторе">Копировать</button><span class="copy-ok" hidden>Скопировано</span>' : '') +
  '</div><p class="field-error" hidden></p>';
}
function copyText(text, done){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    ta.remove(); done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
function bindName1c(panel, obj){
  var box = panel.querySelector('.name1c'), err = panel.querySelector('.field-error');
  var idEl = box.querySelector('.name1c-id');
  var copy = box.querySelector('.copy-btn');
  if (copy) copy.addEventListener('click', function(){
    copyText(obj.fullName, function(){
      var ok = box.querySelector('.copy-ok'); ok.hidden = false;
      setTimeout(function(){ ok.hidden = true; }, 1200);
    });
  });
  function rerender(errText){
    var holder = document.createElement('div'); holder.innerHTML = name1cHTML(obj);
    box.replaceWith(holder.firstChild); err.replaceWith(holder.firstChild);
    bindName1c(panel, obj);
    if (errText){ var e2 = panel.querySelector('.field-error'); e2.textContent = errText; e2.hidden = false; }
  }
  function edit(){
    var input = document.createElement('input');
    input.type = 'text'; input.className = 'field-input name1c-input';
    input.value = splitFullName(obj.fullName).id;
    input.placeholder = 'Идентификатор'; input.setAttribute('aria-label', 'Имя в конфигураторе: идентификатор');
    idEl.replaceWith(input);
    if (copy){ copy.remove(); var ok = box.querySelector('.copy-ok'); if (ok) ok.remove(); }
    input.focus(); input.select();
    var done = false;
    function commit(){
      var v = input.value.trim();
      if (!validIdentifier(v)){ err.textContent = IDENTIFIER_RULE; err.hidden = false; return false; }
      done = true;
      var prefix = fullNamePrefix(obj);
      var next = v ? (prefix ? prefix + '.' + v : v) : '';
      if (next !== (obj.fullName || '')){ obj.fullName = next; persist(); if (currentView === 'list') renderListView(); }
      rerender();
      return true;
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); commit(); }
      else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); done = true; rerender(); }
    });
    input.addEventListener('input', function(){ if (validIdentifier(input.value.trim())) err.hidden = true; });
    /* Уход фокуса с некорректным значением: значение не сохраняется, прежнее возвращается. */
    input.addEventListener('blur', function(){
      if (done) return;
      if (!validIdentifier(input.value.trim())){ done = true; rerender(IDENTIFIER_RULE + ' Значение не сохранено.'); return; }
      commit();
    });
  }
  idEl.addEventListener('click', edit);
  idEl.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); edit(); } });
}

/* ----- Подробное описание: просмотр с чипами-ссылками на объекты ----- */

function normWord(w){ return w.toLowerCase().replace(/ё/g, 'е'); }
function splitWords(s){ return normWord(s).split(/[^0-9a-zа-я]+/i).filter(Boolean); }
function commonPrefix(a, b){ var i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }
/* Слова считаются одним, если совпадают или отличаются только окончанием (до 2 букв):
   «Заявки» ~ «Заявка», «Проекта» ~ «Проекты». */
function wordsMatch(a, b){
  if (a === b) return 2;
  var shorter = Math.min(a.length, b.length);
  if (shorter < 4) return 0;
  return commonPrefix(a, b) >= Math.max(3, shorter - 2) && Math.abs(a.length - b.length) <= 2 ? 1 : 0;
}
function findObjectByMention(text){
  var words = splitWords(text);
  if (!words.length) return null;
  var best = null, bestScore = -1;
  Object.keys(state.objects).forEach(function(id){
    var nw = splitWords(state.objects[id].name);
    if (nw.length !== words.length) return;
    var score = 0;
    for (var i = 0; i < nw.length; i++){ var m = wordsMatch(words[i], nw[i]); if (!m) return; score += m; }
    if (score > bestScore){ bestScore = score; best = id; }
  });
  return best;
}
function renderBodyHTML(text){
  var out = '', last = 0, re = /\[([^\[\]\n]{1,160})\]/g, m;
  while ((m = re.exec(text))){
    out += escapeHtml(text.slice(last, m.index));
    var oid = findObjectByMention(m[1]);
    if (oid){
      var o = state.objects[oid];
      out += '<button type="button" class="obj-chip" data-obj="' + oid + '" style="--c:' + typeColor(o.type) + '" title="' + escapeHtml(o.name) + '">' + escapeHtml(m[1]) + '</button>';
    } else {
      out += escapeHtml(m[0]);
    }
    last = m.index + m[0].length;
  }
  return out + escapeHtml(text.slice(last));
}

        statusBadgeButtonHTML(obj.status, false) +

    '</div>' +
    '<div class="panel-section is-tight">' +

/* Подсистема и теги: в просмотре — одна строка чипов; по клику — два редактора чипов.
   Каждое добавление/удаление сохраняется сразу; из редактирования выходим, когда фокус
   уходит из блока, или по Esc. */
function bindSubsystemsTags(panel, obj){
  var wrap = panel.querySelector('.vfield[data-key="subtags"]');
  var view = wrap.querySelector('.vfield-value');
  function renderView(){
    var subs = objectSubsystems(obj), tags = obj.tags || [];
    var empty = !subs.length && !tags.length;
    view.classList.toggle('is-empty', empty);
    view.title = empty ? '' : 'Нажмите, чтобы изменить';
    view.innerHTML = empty ? '+ Добавить подсистему или теги' :
      '<div class="chips-view">' +
        subs.map(function(s){ return '<span class="sub-chip" title="Подсистема">' + typeIconSVG('subsystem') + escapeHtml(s) + '</span>'; }).join('') +
        tags.map(function(t){ return '<span class="tag-chip" title="Тег">' + escapeHtml(t) + '</span>'; }).join('') +
      '</div>' + PENCIL_SVG;
  }
  function edit(focusTags){
    view.hidden = true;
    var box = document.createElement('div');
    box.className = 'subtags-edit';
    box.innerHTML = '<div class="chip-edit-group"><div class="chip-edit-label">Подсистемы</div><div class="ce-subs"></div></div>' +
                    '<div class="chip-edit-group"><div class="chip-edit-label">Теги</div><div class="ce-tags"></div></div>';
    wrap.appendChild(box);
    var subsEd = buildChipEditor(box.querySelector('.ce-subs'), {
      label:'Подсистемы', placeholder:'Начните вводить подсистему…', chipClass:'sub-chip', createLabel:'Создать',
      values:function(){ return objectSubsystems(obj); }, suggestions:allSubsystems,
      onChange:function(list){ setObjectSubsystems(obj, list); persist(); renderSidebar(); if (currentView === 'list') renderListView(); }
    });
    var tagsEd = buildChipEditor(box.querySelector('.ce-tags'), {
      label:'Теги', placeholder:'Тег, Enter или запятая', freeCreate:true, createLabel:'Добавить тег',
      values:function(){ return obj.tags || []; }, suggestions:allTags,
      onChange:function(list){ obj.tags = list; persist(); renderSidebar(); if (currentView === 'list') renderListView(); }
    });
    (focusTags ? tagsEd : subsEd).focus();
    function close(){ box.remove(); view.hidden = false; renderView(); }
    box.addEventListener('focusout', function(){
      setTimeout(function(){ if (box.isConnected && !box.contains(document.activeElement)) close(); }, 0);
    });
    box.addEventListener('keydown', function(e){
      if (e.key === 'Escape'){
        var dd = box.querySelector('.combo-dropdown:not([hidden])');
        if (dd) return;
        e.preventDefault(); e.stopPropagation(); close(); view.focus();
      }
    });
  }
  view.addEventListener('click', function(e){ edit(!!(e.target.closest && e.target.closest('.tag-chip'))); });
  view.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); edit(false); } });
  renderView();
}

function changeObjectType(obj, code){
  if (!code || code === obj.type) return;
  function apply(){
    var id = splitFullName(obj.fullName).id;
    obj.type = code;
    /* Префикс имени в конфигураторе следует за типом. */
    if (id) obj.fullName = typeInfo(code).name1c + '.' + id;
    persist(); syncGraphModel(); renderSidebar();
    if (currentView === 'list') renderListView();
    renderObjectPanel(obj);
  }
  var n = objectMechanismCounts()[obj.id] || 0;
  if (!n){ apply(); return; }
  openModal({
    title:'Сменить тип объекта?',
    bodyHTML:'<p>«' + escapeHtml(obj.name) + '» участвует в ' + n + ' ' + pluralRu(n,'механизме','механизмах','механизмах') +
      '. Тип изменится с «' + escapeHtml(typeTitle(obj.type)) + '» на «' + escapeHtml(typeTitle(code)) + '».</p>',
    footerButtons:[
      {label:'Отмена', onClick:function(){ return true; }},
      {label:'Сменить тип', variant:'primary', onClick:function(){ apply(); }}
    ]
  });
}

/* Роли объекта в механизме → группы блока «Участвует в механизмах». Объект с двумя ролями
   в одном механизме попадает в обе группы. */
function participantRolesByObject(mech){
  var order = [], roles = {};
  mech.participants.forEach(function(p){
    if (!p.objectId || !state.objects[p.objectId]) return;
    if (!roles[p.objectId]){ roles[p.objectId] = []; order.push(p.objectId); }
    var title = roleInfo(p.role).title;
    if (roles[p.objectId].indexOf(title) < 0) roles[p.objectId].push(title);
  });
  return {order:order, roles:roles};
}
function objectRoleGroupKey(roleCode){
  var r = roleInfo(roleCode);
  if (r.direction === 'target') return {key:'in', title:'Получает данные из', order:0};
  if (r.direction === 'source') return {key:'out', title:'Передаёт данные в', order:1};
  return {key:'role:' + r.code, title:r.title, order:2};
}
/* Механизмы в карточке по умолчанию свёрнуты. Развёрнутое пользователем помнится, пока открыт
   тот же объект (перерисовки карточки), и сбрасывается при открытии другого объекта. */
var omCollapsed = {}; /* ключ «объект|группа|механизм» → true/false */
var omCollapsedFor = null;

function renderObjectMechList(obj, panel){
  if (omCollapsedFor !== obj.id){ omCollapsed = {}; omCollapsedFor = obj.id; }
  var container = panel.querySelector('#obj-mech-list');
  if (!container) return;
  var groups = {}, mechIds = {};
  Object.keys(state.mechanisms).forEach(function(mid){
    var m = state.mechanisms[mid];
    m.participants.forEach(function(p){
      if (p.objectId !== obj.id) return;
      var g = objectRoleGroupKey(p.role);
      var grp = groups[g.key] || (groups[g.key] = {title:g.title, order:g.order, items:{} , list:[]});
      if (!grp.items[mid]){ grp.items[mid] = {mech:m, notes:[]}; grp.list.push(mid); }
      if (p.note && grp.items[mid].notes.indexOf(p.note) < 0) grp.items[mid].notes.push(p.note);
      mechIds[mid] = true;
    });
  });
  var total = Object.keys(mechIds).length;
  var titleEl = panel.querySelector('#obj-mech-title');
  if (titleEl) titleEl.textContent = 'Участвует в механизмах · ' + total;
  if (!total){ container.innerHTML = '<p class="ref-empty">Пока не участвует ни в одном механизме.</p>'; return; }

  var ordered = Object.keys(groups).map(function(k){ return {key:k, g:groups[k]}; })
    .sort(function(a,b){ return a.g.order - b.g.order || a.g.title.localeCompare(b.g.title,'ru'); });
  container.innerHTML = ordered.map(function(x){
    var g = x.g;
    return '<div class="om-group"><p class="om-group-title">' + escapeHtml(g.title) + '</p>' +
      g.list.map(function(mid){
        var it = g.items[mid], m = it.mech;
        var ck = obj.id + '|' + x.key + '|' + mid;
        var collapsed = (ck in omCollapsed) ? omCollapsed[ck] : true;
        var parts = participantRolesByObject(m);
        var notesByObj = {};
        m.participants.forEach(function(p){ if (p.objectId && p.note) (notesByObj[p.objectId] = notesByObj[p.objectId] || []).push(p.note); });
        var others = parts.order.filter(function(id){ return id !== obj.id; });
        var sub = others.length ? others.map(function(id){
          var o = state.objects[id];
          return '<button type="button" class="om-link om-part' + (o.status === 'deprecated' ? ' is-deprecated' : '') + '" data-obj="' + id + '">' +
            '<span class="om-part-title"><span class="dot" style="background:' + typeColor(o.type) + '"></span><span class="ref-item-title">' + escapeHtml(o.name) + deprecatedTagHTML(o) + '</span></span>' +
            '<span class="om-part-meta">' + escapeHtml(typeTitle(o.type)) + ' · ' + escapeHtml(parts.roles[id].join(', ')) + '</span>' +
            (notesByObj[id] ? '<span class="om-part-note">' + escapeHtml(notesByObj[id].join('; ')) + '</span>' : '') +
          '</button>';
        }).join('') : '<p class="om-empty-parts">Других участников нет</p>';
        return '<div class="om-mech' + (m.status === 'deprecated' ? ' is-deprecated' : '') + '">' +
          '<div class="om-mech-row">' +
            '<button type="button" class="om-toggle" data-ck="' + escapeHtml(ck) + '" aria-expanded="' + (!collapsed) + '" aria-label="Свернуть или развернуть участников"></button>' +
            '<button type="button" class="om-link om-mech-link" data-mech="' + mid + '">' +
              '<span class="om-mech-title"><span class="om-diamond" style="--c:' + categoryAccent(m.category) + '"></span><span class="ref-item-title">' + escapeHtml(m.title) + deprecatedTagHTML(m) + '</span></span>' +
              (it.notes.length ? '<span class="om-note">' + escapeHtml(it.notes.join('; ')) + '</span>' : '') +
            '</button>' +
          '</div>' +
          '<div class="om-parts"' + (collapsed ? ' hidden' : '') + '>' + sub + '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');

  container.querySelectorAll('.om-toggle').forEach(function(t){
    t.addEventListener('click', function(){
      var open = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      t.closest('.om-mech').querySelector('.om-parts').hidden = !open;
      omCollapsed[t.getAttribute('data-ck')] = !open;
    });
  });
  container.querySelectorAll('.om-mech-link').forEach(function(btn){
    var mid = btn.getAttribute('data-mech');
    btn.addEventListener('click', function(){ setGraphHint(null); selectEntity('mech', mid); });
    btn.addEventListener('mouseenter', function(){ setGraphHint({mechOnly:mid}); });
    btn.addEventListener('mouseleave', function(){ setGraphHint(null); });
  });
  container.querySelectorAll('.om-part').forEach(function(btn){
    var oid = btn.getAttribute('data-obj');
    btn.addEventListener('click', function(){ setGraphHint(null); selectEntity('obj', oid); });
    btn.addEventListener('mouseenter', function(){ setGraphHint({objId:oid}); });
    btn.addEventListener('mouseleave', function(){ setGraphHint(null); });
  });
}

/* «+ Добавить в механизм»: выбор механизма → роль → необязательное описание → участник добавлен. */
function buildMechanismPicker(container, onPick){
  container.innerHTML = '<div class="combo"><input type="text" class="field-input combo-input" autocomplete="off" placeholder="Начните вводить название механизма…"><div class="combo-dropdown" hidden></div></div>';
  var input = container.querySelector('.combo-input'), dropdown = container.querySelector('.combo-dropdown');
  var items = [], active = -1;
  function render(){
    var q = input.value.trim().toLowerCase();
    items = Object.keys(state.mechanisms).map(function(id){ return state.mechanisms[id]; })
      .filter(isShown)
      .filter(function(m){ return !q || m.title.toLowerCase().indexOf(q) >= 0; })
      .sort(function(a,b){ return a.title.localeCompare(b.title,'ru'); }).slice(0, 10);
    active = items.length ? 0 : -1;
    dropdown.innerHTML = items.length ? items.map(function(m, i){
      return '<div class="combo-item' + (i === active ? ' is-active' : '') + '" data-i="' + i + '"><span class="om-diamond" style="--c:' + categoryAccent(m.category) + '"></span><span class="combo-item-text">' + escapeHtml(m.title) + '</span><span class="combo-item-type">' + escapeHtml(categoryTitle(m.category)) + '</span></div>';
    }).join('') : '<div class="combo-empty">Механизмы не найдены</div>';
    dropdown.hidden = false;
    dropdown.querySelectorAll('.combo-item').forEach(function(el){
      el.addEventListener('mousedown', function(e){ e.preventDefault(); choose(Number(el.getAttribute('data-i'))); });
    });
  }
  function choose(i){ var m = items[i]; if (!m) return; dropdown.hidden = true; input.value = m.title; onPick(m); }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', function(){ setTimeout(function(){ dropdown.hidden = true; }, 150); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown' && items.length){ e.preventDefault(); active = (active + 1) % items.length; hl(); }
    else if (e.key === 'ArrowUp' && items.length){ e.preventDefault(); active = (active - 1 + items.length) % items.length; hl(); }
    else if (e.key === 'Enter'){ e.preventDefault(); choose(active); }
  });
  function hl(){ dropdown.querySelectorAll('.combo-item').forEach(function(el, i){ el.classList.toggle('is-active', i === active); }); }
  return input;
}

function bindAddToMechanism(panel, obj){
  var btn = panel.querySelector('#btn-add-to-mech'), host = panel.querySelector('#obj-add-to-mech');
  btn.addEventListener('click', function(){
    if (host.firstChild){ host.innerHTML = ''; return; }
    var chosen = null, role = 'target';
    host.innerHTML = '<div class="om-add">' +
      '<div><div class="om-add-label">Механизм</div><div class="om-add-picker"></div></div>' +
      '<div><div class="om-add-label">Роль объекта</div><div class="om-add-roles">' +
        PARTICIPANT_ROLES.map(function(r){ return '<button type="button" class="om-add-role' + (r.code === role ? ' is-on' : '') + '" data-role="' + r.code + '">' + escapeHtml(r.title) + '</button>'; }).join('') +
      '</div></div>' +
      '<div><div class="om-add-label">Что передаётся (необязательно)</div><input type="text" class="field-input om-add-note" placeholder="Например: «Забирает к-во дней»"></div>' +
      '<div class="om-add-actions"><button type="button" class="btn btn-sm om-add-cancel">Отмена</button><button type="button" class="btn btn-sm btn-accent om-add-ok" disabled>Добавить</button></div>' +
    '</div>';
    var ok = host.querySelector('.om-add-ok');
    var input = buildMechanismPicker(host.querySelector('.om-add-picker'), function(m){ chosen = m; ok.disabled = false; host.querySelector('.om-add-note').focus(); });
    input.addEventListener('input', function(){ chosen = null; ok.disabled = true; });
    host.querySelectorAll('.om-add-role').forEach(function(b){
      b.addEventListener('click', function(){
        role = b.getAttribute('data-role');
        host.querySelectorAll('.om-add-role').forEach(function(x){ x.classList.toggle('is-on', x === b); });
      });
    });
    host.querySelector('.om-add-cancel').addEventListener('click', function(){ host.innerHTML = ''; });
    host.querySelector('.om-add-note').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !ok.disabled){ e.preventDefault(); ok.click(); } });
    ok.addEventListener('click', function(){
      if (!chosen) return;
      chosen.participants.push({objectId:obj.id, role:role, note:normalizeLabel(host.querySelector('.om-add-note').value)});
      persist(); syncGraphModel(); renderSidebar(); updateStats();
      if (currentView === 'list') renderListView();
      host.innerHTML = '';
      renderObjectMechList(obj, panel);
    });
    host.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); host.innerHTML = ''; btn.focus(); } });
    input.focus();
  });
}

function buildObjectCombobox(container, selectedId, onChange, reopenAfterCreate){
  var selectedObj = selectedId ? state.objects[selectedId] : null;
  container.innerHTML =
    '<div class="combo">' +
      '<input type="text" class="field-input combo-input" autocomplete="off" placeholder="Начните вводить название…" value="' + escapeHtml(selectedObj ? selectedObj.name : '') + '">' +
      '<div class="combo-dropdown" hidden></div>' +
    '</div>';
  var input = container.querySelector('.combo-input');
  var dropdown = container.querySelector('.combo-dropdown');
  var currentId = selectedId || '';

  function renderDropdown(query){
    var q = query.trim().toLowerCase();
    var matches = Object.keys(state.objects).map(function(id){ return state.objects[id]; })
      .filter(function(o){ return !q || o.name.toLowerCase().indexOf(q) >= 0; })
      .sort(function(a,b){ return a.name.localeCompare(b.name,'ru'); })
      .slice(0, 8);
    var html = matches.map(function(o){
      return '<div class="combo-item" data-id="'+o.id+'">' +
        '<span class="dot" style="background:'+typeColor(o.type)+'"></span>' +
        '<span class="combo-item-text">'+escapeHtml(o.name)+'</span>' +
        '<span class="combo-item-type">'+escapeHtml(typeTitle(o.type))+'</span>' +
      '</div>';
    }).join('');
    if (q) html += '<div class="combo-item combo-item-create" data-create="1">+ Создать «'+escapeHtml(query.trim())+'»</div>';
    if (!html) html = '<div class="combo-empty">Начните вводить название объекта.</div>';
    dropdown.innerHTML = html;
    dropdown.hidden = false;
    dropdown.querySelectorAll('.combo-item[data-id]').forEach(function(item){
      item.addEventListener('mousedown', function(e){
        e.preventDefault();
        var id = item.getAttribute('data-id');
        currentId = id;
        input.value = state.objects[id].name;
        dropdown.hidden = true;
        onChange(id);
      });
    });
    var createItem = dropdown.querySelector('.combo-item-create');
    if (createItem){
      createItem.addEventListener('mousedown', function(e){
        e.preventDefault();
        var typedName = input.value.trim();
        dropdown.hidden = true;
        openQuickCreateObject(function(newObj){
          currentId = newObj.id;
          input.value = newObj.name;
          onChange(newObj.id);
          if (reopenAfterCreate) setTimeout(reopenAfterCreate, 0);
        }, typedName);
      });
    }
  }

  input.addEventListener('focus', function(){ renderDropdown(input.value); });
  input.addEventListener('input', function(){ renderDropdown(input.value); });
  input.addEventListener('blur', function(){
    setTimeout(function(){
      dropdown.hidden = true;
      var obj = currentId ? state.objects[currentId] : null;
      input.value = obj ? obj.name : '';
    }, 150);
  });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ dropdown.hidden = true; input.blur(); }
  });
}

/* Комбобокс с автодополнением — общий для новых полей выбора (табличная часть реквизита,
   далее роли, контроли, шаги).
   opt: {value, placeholder, ariaLabel,
         source(q) → [{value, label, sub?, iconHTML?}] — пункты для введённого текста,
         createLabel(q) → строка пункта «+ Создать „…“» или null,
         onPick(item) — выбран пункт (item.create — выбран пункт создания, item.value = текст)}
   ↑/↓ выбирают пункт, Enter применяет выбранный. Пока пункт не выбран стрелками, Enter
   не перехватывается — форма вокруг может сохранить введённый текст. Esc закрывает список. */
function buildCombobox(container, opt){
  container.innerHTML = '<div class="combo"><input type="text" class="field-input combo-input" autocomplete="off"><div class="combo-dropdown" hidden></div></div>';
  var input = container.querySelector('.combo-input'), dropdown = container.querySelector('.combo-dropdown');
  input.value = opt.value || '';
  if (opt.placeholder) input.placeholder = opt.placeholder;
  if (opt.ariaLabel) input.setAttribute('aria-label', opt.ariaLabel);
  var items = [], active = -1;
  function render(){
    var q = input.value.trim();
    items = opt.source(q).slice();
    var cl = opt.createLabel ? opt.createLabel(q) : null;
    if (cl) items.push({value:q, label:cl, create:true});
    active = -1;
    if (!items.length){ dropdown.hidden = true; return; }
    dropdown.innerHTML = items.map(function(it, i){
      return '<div class="combo-item' + (it.create ? ' combo-item-create' : '') + '" data-i="' + i + '">' + (it.iconHTML || '') +
        '<span class="combo-item-text">' + escapeHtml(it.label) + '</span>' +
        (it.sub ? '<span class="combo-item-type">' + escapeHtml(it.sub) + '</span>' : '') + '</div>';
    }).join('');
    dropdown.hidden = false;
    dropdown.querySelectorAll('.combo-item').forEach(function(el){
      el.addEventListener('mousedown', function(e){ e.preventDefault(); choose(Number(el.getAttribute('data-i'))); });
    });
  }
  function hl(){ dropdown.querySelectorAll('.combo-item').forEach(function(el, i){ el.classList.toggle('is-active', i === active); }); }
  function choose(i){ var it = items[i]; if (!it) return; dropdown.hidden = true; active = -1; opt.onPick(it); }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', function(){ setTimeout(function(){ dropdown.hidden = true; }, 150); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if (dropdown.hidden) render();
      if (!items.length) return;
      e.preventDefault();
      active = e.key === 'ArrowDown' ? (active + 1) % items.length : (active <= 0 ? items.length - 1 : active - 1);
      hl();
    } else if (e.key === 'Enter' && !dropdown.hidden && active >= 0){
      e.preventDefault(); e.stopPropagation(); choose(active);
    } else if (e.key === 'Escape' && !dropdown.hidden){
      e.preventDefault(); e.stopPropagation(); dropdown.hidden = true;
    } else if (e.key === 'Tab'){
      dropdown.hidden = true;
    }
  });
  return input;
}

function renderParticipantsList(mech, panel){
  var container = panel.querySelector('#participants-list');
  if (!container) return;
  var isSidebar = (panel.id === 'panel-mechanism');
  function rerender(){ renderParticipantsList(mech, panel); }
  function changed(){ persist(); syncGraphModel(); renderSidebar(); updateStats(); }

  container.innerHTML = ROLE_GROUPS.map(function(g){
    var items = [];
    mech.participants.forEach(function(p, idx){ if (roleInfo(p.role).direction === g.dir) items.push(participantCardHTML(p, idx)); });
    if (g.dir === 'neutral' && !items.length) return '';
    return '<div class="role-block" data-dir="' + g.dir + '">' +
      '<div class="role-block-header"><p class="role-block-title">' + g.title + ' · ' + items.length + '</p>' +
        (g.add ? '<button type="button" class="btn btn-sm role-add-btn" data-role="' + g.baseRole + '">' + g.add + '</button>' : '') +
      '</div>' +
      '<div class="role-items">' + (items.join('') || '<p class="role-block-empty">Пока нет</p>') + '</div>' +
    '</div>';
  }).join('');

  /* Добавление: комбобокс поиска объекта прямо в блоке; выбранный объект становится участником. */
  container.querySelectorAll('.role-add-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var block = btn.closest('.role-block');
      if (block.querySelector('.role-add')) return;
      var slot = document.createElement('div');
      slot.className = 'role-add';
      var itemsEl = block.querySelector('.role-items');
      itemsEl.insertBefore(slot, itemsEl.firstChild);
      var empty = itemsEl.querySelector('.role-block-empty'); if (empty) empty.hidden = true;
      var role = btn.getAttribute('data-role');
      buildObjectCombobox(slot, '', function(newId){
        mech.participants.push({objectId:newId, role:role, note:''});
        changed(); rerender();
      }, null);
      var input = slot.querySelector('.combo-input');
      input.addEventListener('blur', function(){ setTimeout(function(){ if (slot.isConnected && !input.matches(':focus')) rerender(); }, 200); });
      input.focus();
    });
  });

  container.querySelectorAll('.pcard').forEach(function(card){
    var idx = Number(card.getAttribute('data-idx'));
    var p = mech.participants[idx];

    var nameBtn = card.querySelector('.pcard-name');
    if (nameBtn) nameBtn.addEventListener('click', function(){ openObjectFromCard(panel, p.objectId, isSidebar); });
    var comboSlot = card.querySelector('.pcard-combo');
    if (comboSlot) buildObjectCombobox(comboSlot, '', function(newId){ p.objectId = newId; changed(); rerender(); },
      null);

    /* Описание передачи — правка по клику. */
    var sub = card.querySelector('.pcard-sub');
    function editNote(){
      var input = document.createElement('input');
      input.type = 'text'; input.className = 'field-input pcard-note-input';
      input.value = p.note || ''; input.placeholder = 'Что передаётся';
      sub.replaceWith(input); input.focus();
      var done = false;
      function finish(save){
        if (done) return; done = true;
        if (save && input.value !== (p.note||'')){ p.note = input.value; persist(); }
        rerender();
      }
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
        else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      input.addEventListener('blur', function(){ finish(true); });
    }
    sub.addEventListener('click', editNote);
    sub.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); editNote(); } });

    /* Меню «⋯»: смена роли, удаление. */
    var menuBtn = card.querySelector('.pcard-menu-btn'), menu = card.querySelector('.pcard-menu');
    function setMenu(open){
      menu.hidden = !open; menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open){
        var close = function(ev){ if (!card.querySelector('.pcard-menu-wrap').contains(ev.target)){ setMenu(false); document.removeEventListener('mousedown', close); } };
        document.addEventListener('mousedown', close);
      }
    }
    menuBtn.addEventListener('click', function(){ setMenu(menu.hidden); });
    menu.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ e.stopPropagation(); setMenu(false); menuBtn.focus(); } });
    menu.querySelectorAll('.menu-item[data-role]').forEach(function(item){
      item.addEventListener('click', function(){ p.role = item.getAttribute('data-role'); changed(); rerender(); });
    });
    menu.querySelector('[data-remove]').addEventListener('click', function(){
      mech.participants.splice(idx, 1); setGraphHint(null); changed(); rerender();
    });

    /* Наведение на участника подсвечивает его ребро на графе. */
    card.addEventListener('mouseenter', function(){ if (p.objectId) setGraphHint({objId:p.objectId, mechId:mech.id}); });
    card.addEventListener('mouseleave', function(){ setGraphHint(null); });
  });
}

/* ===================== Вид «Список» ===================== */

/* Две вкладки, как в левой панели «Графа». У каждой — свой поиск, отборы и сортировка
   (в памяти, на время сессии). Сортировка — внутри группы (тип объекта / категория механизма). */
var listTab = 'objects';
var listSearch = { objects:'', mechanisms:'', roles:'' };
var listFilters = {
  objects:    { type:{}, sub:{}, tag:{} },
  mechanisms: { cat:{},  sub:{}, tag:{} },
  roles:      {}
};
var listSort = { objects:{key:'name', dir:1}, mechanisms:{key:'name', dir:1}, roles:{key:'name', dir:1} };
/* Колонки. hideBelow — ширина таблицы (px), ниже которой колонка скрывается
   (открытая карточка сужает таблицу: сначала уходят «Реквизиты», затем «Теги», затем «Подсистема»). */
var LIST_COLUMNS = {
  objects: [
    {key:'name',   title:'Синоним',               width:'minmax(0,2.2fr)'},
    {key:'code',   title:'Имя в конфигураторе',   width:'minmax(0,2fr)'},
    {key:'sub',    title:'Подсистема',            width:'minmax(0,1.4fr)', hideBelow:860},
    {key:'mechs',  title:'Механизмы',             width:'96px'},
    {key:'attrs',  title:'Реквизиты',             width:'96px', hideBelow:1180},
    {key:'tags',   title:'Теги',                  width:'minmax(0,1.4fr)', hideBelow:1060},
    {key:'status', title:'Статус',                width:'112px'}
  ],
  mechanisms: [
    {key:'name',    title:'Название',   width:'minmax(0,2.2fr)'},
    {key:'cat',     title:'Категория',  width:'minmax(0,1.1fr)'},
    {key:'sources', title:'Источники',  width:'minmax(0,2fr)'},
    {key:'targets', title:'Приёмники',  width:'minmax(0,2fr)'},

  ],

    {key:'name',  title:'Название',                 width:'minmax(0,1.6fr)'},
