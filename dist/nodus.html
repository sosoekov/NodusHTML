<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nodus v.0.5.0 — локальный прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Локальный прототип для тестирования UX перед сборкой полноценного сервиса.
  Данные хранятся в localStorage этого браузера. Экспорт/импорт — кнопки в шапке.
  Справочники (типы объектов, категории механизмов, роли участников) заданы
  константами в начале js/core.js — их можно поправить прямо там при необходимости.
  Этот файл открывается двойным кликом как есть; один файл для передачи —
  dist/nodus.html, собирается командой «node build.js» (см. docs/HANDOFF.md).
-->
<style>
:root{
  /* ===== Токены темы. Все цвета, размеры шрифтов и прозрачности — только отсюда.
     Холст (canvas) читает эти же переменные при старте — см. readTheme() в скрипте. ===== */

  /* Фоны: холст → панель → поле ввода; выбранный сегмент/вкладка */
  --bg:#0E1520;
  --bg-panel:#131C2A;
  --bg-elevated:#182234;
  --bg-selected:#243148;
  --border:#253248;
  --border-soft:#1C2739;
  --overlay:rgba(6,9,14,0.6);

  /* Текст: основной / вторичный / приглушённый (WCAG AA на всех трёх фонах) */
  --text:#DCE4F0;
  --text-muted:#9AA6BA;
  --text-faint:#7F8CA2;

  /* Акцент — выделение и связи на графе; опасное действие; успех */
  --accent:#E0A73E;
  --accent-soft:rgba(224,167,62,0.14);
  --on-accent:#1A1206;
  --danger:#D96C6C;
  --danger-soft:rgba(217,108,108,0.12);
  --on-danger:#2A0D0D;
  --success:#6FBF8B;
  --success-soft:rgba(111,191,139,0.15);
  --warning:#E5C07B;
  --badge-bg-mix:15%;  /* доля цвета категории в фоне бейджа */
  --chip-bg-mix:20%;   /* доля цвета типа в фоне чипа-ссылки */

  /* Цвета категорий механизмов */
  --cat-calc:hsl(25,55%,64%);
  --cat-fill:hsl(325,55%,66%);
  --cat-check:hsl(145,55%,64%);
  --cat-exchange:hsl(205,55%,64%);
  --cat-access:hsl(265,55%,64%);
  --cat-unknown:hsl(40,55%,64%);

  /* Цвета типов объектов */
  --type-const:hsl(0,58%,62%);
  --type-catalog:hsl(30,58%,62%);
  --type-document:hsl(60,58%,62%);
  --type-infreg:hsl(180,58%,62%);   /* РС — бирюзовый: оттенок РН (120°) отличается на 60° */
  --type-accumreg:hsl(120,58%,62%);
  --type-enumt:hsl(150,58%,62%);
  --type-process:hsl(90,58%,62%);
  --type-report:hsl(210,58%,62%);
  --type-charchart:hsl(240,58%,62%);
  --type-role:hsl(270,58%,62%);
  --type-subsystem:hsl(300,58%,62%);
  --type-commonmod:hsl(330,58%,62%);
  --type-doclog:hsl(45,55%,52%);
  --type-bproc:hsl(210,25%,82%);
  --type-task:hsl(195,70%,72%);
  --type-extsrc:hsl(165,40%,52%);
  --type-unknown:hsl(215,12%,56%);  /* тип не указан — нейтральный */

  /* Граф: рёбра, сетка, обводка заглушки, бейдж числа механизмов, логотип */
  --graph-edge:rgba(90,105,130,0.55);
  --graph-arrow:rgba(140,155,180,0.75);
  --graph-grid:rgba(255,255,255,0.05);
  --graph-stub-stroke:rgba(255,255,255,0.55);
  --graph-badge-stroke:rgba(224,167,62,0.7);
  --graph-node-text:#0E1520;         /* метка типа внутри круга */
  --logo-1:#D9D05A;
  --logo-2:#5AD0D9;
  --logo-3:#D96A5A;
  --logo-4:#7DD95A;

  /* Прозрачности на графе */
  --alpha-node-active:1;        /* выделенный узел */
  --alpha-node-neighbor:1;      /* его прямые участники */
  --alpha-node-second:0.55;     /* соседи второго порядка */
  --alpha-node-background:0.35; /* остальное при выделении */
  --alpha-node-filtered:0.2;    /* не прошедшие отбор левой панели */
  --alpha-edge-filtered:0.08;
  --alpha-label-second:0.7;     /* подпись соседа второго порядка */
  --alpha-label-background:0.45;/* подпись фонового узла при выделении */
  --alpha-label-plate:0.85;     /* подложка подписи */
  --alpha-deprecated:0.5;
  --alpha-focus-other:0.2;      /* узлы вне механизма в фокус-режиме */

  /* Размеры шрифтов */
  --fs-caption:12px;   /* вторичный текст: подписи полей, категории, подсказки */
  --fs-base:13px;      /* базовый текст интерфейса */
  --fs-md:14px;
  --fs-lg:15px;
  --fs-title:16px;
  --fs-heading:17px;
  --fs-icon:16px;
  --fs-icon-lg:18px;
  --fs-graph-label:12px;
  --fs-graph-badge:12px;

  --radius:4px;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs-base);
  line-height:1.5;
  overflow:hidden;
}
button, input, select, textarea{ font:inherit; color:inherit; }
input::placeholder, textarea::placeholder{ color:var(--text-faint); opacity:1; }
code{ font-family:var(--mono); background:var(--bg-elevated); padding:1px 5px; border-radius:3px; font-size:var(--fs-caption); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}

#app{ display:flex; flex-direction:column; height:100vh; }

#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px; border-bottom:1px solid var(--border);
  background:var(--bg-panel); gap:16px; flex-wrap:wrap;
}
.topbar-left{ display:flex; flex-direction:column; gap:5px; }
.app-title{ font-size:var(--fs-title); font-weight:700; margin:0; display:flex; align-items:center; gap:8px; }
.app-logo{ width:22px; height:22px; flex:none; }
.app-version{ font-size:var(--fs-caption); font-weight:500; color:var(--text-faint); }
.view-toggle{ display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.mode-btn{ background:transparent; border:none; color:var(--text-muted); font-size:var(--fs-base); padding:7px 14px; cursor:pointer; }
.mode-btn + .mode-btn{ border-left:1px solid var(--border); }
.mode-btn.active{ background:var(--bg-selected); color:var(--text); }
.mode-btn:hover:not(.active){ background:var(--bg-elevated); color:var(--text); }
.topbar-right{ display:flex; gap:8px; align-items:center; }
.topbar-group{ display:flex; gap:14px; align-items:center; }

/* Переключатель-чекбокс «Показывать механизмы» */
.switch{ display:flex; align-items:center; gap:8px; font-size:var(--fs-base); color:var(--text-muted); cursor:pointer; user-select:none; }
/* Скрытый переключатель держит место — чтобы шапка не «ехала» при смене Граф/Список. */
.switch input{ position:absolute; opacity:0; width:1px; height:1px; }
.switch-track{ width:30px; height:17px; border-radius:9px; background:var(--bg-elevated); border:1px solid var(--border); position:relative; flex:none; }
.switch-track::after{ content:''; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%; background:var(--text-faint); }
.switch input:checked + .switch-track{ background:var(--bg-selected); border-color:var(--text-muted); }
.switch input:checked + .switch-track::after{ left:15px; background:var(--text); }
.switch input:checked ~ .switch-label{ color:var(--text); }
.switch input:focus-visible + .switch-track{ outline:2px solid var(--accent); outline-offset:1px; }

/* Глобальный поиск */
.global-search{ position:relative; flex:1; max-width:440px; min-width:200px; }
.global-search-input{ width:100%; padding:7px 10px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); font-size:var(--fs-base); }
.global-search-kbd{ position:absolute; right:8px; top:50%; transform:translateY(-50%); font-family:var(--mono); font-size:var(--fs-caption); color:var(--text-faint); pointer-events:none; }
.global-search-input:focus + .global-search-kbd{ display:none; }
.global-search-dropdown{ position:absolute; top:100%; left:0; right:0; z-index:40; margin-top:4px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); max-height:380px; overflow-y:auto; padding:4px 0; }
.global-search-dropdown[hidden]{ display:none; }
.gs-item{ display:flex; align-items:center; gap:9px; width:100%; padding:7px 10px; background:transparent; border:none; text-align:left; cursor:pointer; }
.gs-item.active{ background:var(--bg-selected); }
.gs-item .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.gs-item .dot-diamond{ border-radius:2px; transform:rotate(45deg); }
.gs-item-main{ display:flex; flex-direction:column; min-width:0; }
.gs-item-title{ font-size:var(--fs-base); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gs-item-sub{ font-size:var(--fs-caption); color:var(--text-muted); }
.gs-empty{ padding:8px 10px; font-size:var(--fs-caption); color:var(--text-faint); margin:0; }

/* Меню «⋯» */
.menu-wrap{ position:relative; }
.menu-btn{ width:34px; padding:6px 0; text-align:center; font-size:var(--fs-icon); line-height:1; }
.menu{ position:absolute; top:100%; right:0; z-index:40; margin-top:4px; min-width:200px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:4px 0; }
.menu[hidden]{ display:none; }
.menu-item{ display:block; width:100%; padding:8px 12px; background:transparent; border:none; text-align:left; font-size:var(--fs-base); color:var(--text); cursor:pointer; }
.menu-item:hover, .menu-item:focus-visible{ background:var(--bg-selected); outline:none; }
.menu-item-danger{ color:var(--danger); }
.menu-item-danger:hover, .menu-item-danger:focus-visible{ background:var(--danger-soft); }
.menu-sep{ border-top:1px solid var(--border-soft); margin:4px 0; }

.confirm-note{ margin-top:8px !important; font-size:var(--fs-caption) !important; color:var(--text-faint) !important; }
.confirm-input{ margin-top:12px; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; filter:none; }

.btn{
  font-size:var(--fs-base); padding:7px 12px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
  cursor:pointer; white-space:nowrap;
}
.btn:hover{ border-color:var(--text-faint); }
.btn-sm{ padding:5px 10px; font-size:var(--fs-caption); }
.btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
.btn-accent:hover{ filter:brightness(1.06); }
.btn-danger{ background:var(--danger); border-color:var(--danger); color:var(--on-danger); font-weight:600; }
.btn-danger-ghost{ background:transparent; border-color:var(--danger); color:var(--danger); }
.btn-danger-ghost:hover{ background:var(--danger-soft); }

#workspace{ flex:1; display:flex; min-height:0; }
#main{ flex:1; display:flex; min-height:0; min-width:0; }
#main[hidden]{ display:none; }

#sidebar-left{ width:280px; flex:none; border-right:1px solid var(--border); background:var(--bg-panel); display:flex; flex-direction:column; min-height:0; }
.sidebar-section{ padding:12px 14px; flex:none; }
.sidebar-section + .sidebar-section{ border-top:1px solid var(--border-soft); }
.search-input{ width:100%; padding:8px 10px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); }
.filters{ display:flex; flex-direction:column; gap:6px; }
.filters-row{ display:flex; gap:6px; }
.filters-row .select-sm{ flex:1; min-width:0; }
.filters-row[hidden]{ display:none; }
.filters-row .side-sub-filter{ flex:1; min-width:0; }
.side-sub-filter .multi-select-btn{ min-width:0; width:100%; }
.side-sub-filter .multi-select-dropdown{ left:0; right:auto; min-width:0; width:calc(200% + 6px); } /* ширина — вся строка фильтров */
.deprecated-switch{ font-size:var(--fs-caption); }
.filters .deprecated-switch{ margin-top:2px; }
.multi-select-item .type-icon{ color:var(--c); }
.select-sm{ padding:6px 8px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); color:var(--text-muted); font-size:var(--fs-caption); }
.side-tabs{ display:flex; border-bottom:1px solid var(--border-soft); flex:none; }
.side-tab{ flex:1 1 0; min-width:0; background:transparent; border:none; border-bottom:2px solid transparent; padding:11px 4px 9px; color:var(--text-muted); font-size:var(--fs-base); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-search{ display:flex; gap:6px; }
.side-create{ flex:none; width:34px; padding:0; font-size:var(--fs-md); line-height:1; }
.side-tab:hover:not(.active){ color:var(--text); }
.side-tab.active{ background:var(--bg-selected); color:var(--text); border-bottom-color:var(--text-muted); }
.side-search .search-input{ width:100%; }
.list-wrap{ flex:1; overflow-y:auto; padding:4px 0 14px; min-height:0; }

.list-group-title{ font-size:var(--fs-caption); color:var(--text-faint); margin:10px 14px 4px; }
.list-row{ width:100%; display:flex; align-items:center; gap:9px; padding:7px 14px; background:transparent; border:none; text-align:left; cursor:pointer; }
.list-row:hover{ background:var(--bg-elevated); }
.list-row.active{ background:var(--accent-soft); }
.list-row .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.list-row .dot-diamond{ border-radius:2px; transform:rotate(45deg); }
.list-row-main{ display:flex; flex-direction:column; min-width:0; }
.list-row-title{ font-size:var(--fs-base); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row-sub{ font-size:var(--fs-caption); color:var(--text-faint); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.list-row-main{ flex:1; }
.list-row-meta{ display:flex; align-items:center; gap:6px; flex:none; margin-left:auto; }
.list-row-count{ display:flex; align-items:center; justify-content:flex-end; gap:5px; font-size:var(--fs-caption); color:var(--text-muted); font-variant-numeric:tabular-nums; min-width:14px; }
.list-row-count .lv-diamond{ width:6px; height:6px; }
.list-row-count.is-zero{ color:var(--text-faint); }
.list-row-warn{ font-size:var(--fs-caption); color:var(--warning); cursor:help; }
.type-icon{ width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }
.side-group-header{ width:100%; display:flex; align-items:center; gap:7px; padding:7px 14px 7px 8px; background:transparent; border:none; text-align:left; cursor:pointer; color:var(--text); font-size:var(--fs-base); }
.side-group-header:hover{ background:var(--bg-elevated); }
.side-group-chevron{ width:12px; flex:none; display:flex; justify-content:center; color:var(--text-muted); }
.side-group-chevron::before{ content:''; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); margin-top:-3px; }
.side-group-header[aria-expanded="false"] .side-group-chevron::before{ transform:rotate(-45deg); margin-top:0; margin-left:-2px; }
.side-group-header .type-icon{ color:var(--c); }
.side-group-title{ flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-group-count{ font-size:var(--fs-caption); color:var(--text-muted); font-variant-numeric:tabular-nums; }
.side-group-items[hidden]{ display:none; }
.side-group-items .list-row{ padding-left:27px; }
.deprecated-tag{ display:inline-block; margin-left:6px; padding:0 5px; border-radius:3px; font-size:var(--fs-caption); line-height:1.5; font-style:normal; font-weight:400; color:var(--danger); background:var(--danger-soft); vertical-align:1px; }
.is-deprecated .pcard-name, .is-deprecated > .ref-item-main .ref-item-title, .om-link.is-deprecated .ref-item-title, .om-mech.is-deprecated .om-mech-title .ref-item-title{ text-decoration:line-through; text-decoration-color:var(--text-faint); }
.cat-badge{ font-size:var(--fs-caption); line-height:1.4; padding:0 6px; border-radius:3px; color:var(--cat); background:color-mix(in srgb, var(--cat) var(--badge-bg-mix), transparent); }
.no-summary{ font-size:var(--fs-caption); color:var(--text-faint); font-style:italic; }
.ref-empty{ font-size:var(--fs-caption); color:var(--text-faint); padding:8px 14px; margin:0; }

#canvas-wrap{ flex:1; position:relative; background:var(--bg); min-width:0; }
.resize-handle{ width:5px; flex:none; cursor:col-resize; background:transparent; position:relative; }
.resize-handle:hover, .resize-handle.dragging{ background:var(--accent-soft); }
#graph-canvas{ position:absolute; inset:0; cursor:grab; }
.empty-state{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:20px; }
.empty-title{ font-size:var(--fs-lg); margin:0; }
.empty-hint{ font-size:var(--fs-base); color:var(--text-muted); margin:0; max-width:320px; }

/* Легенда (левый нижний угол холста) */
.canvas-bottom-left{ position:absolute; left:16px; bottom:14px; display:flex; align-items:flex-end; gap:8px; pointer-events:none; }
.canvas-bottom-left > *{ pointer-events:auto; }
.mech-mode{ display:flex; align-items:center; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; font-size:var(--fs-caption); }
.mech-mode-label{ padding:6px 4px 6px 10px; color:var(--text-muted); }
.mech-mode-btn{ background:transparent; border:none; border-left:1px solid var(--border); color:var(--text-muted); font-size:var(--fs-caption); padding:6px 10px; cursor:pointer; }
.mech-mode-label + .mech-mode-btn{ border-left:none; }
.mech-mode-btn[aria-checked="true"]{ background:var(--bg-selected); color:var(--text); }
.mech-mode-btn:hover:not([aria-checked="true"]){ background:var(--bg-elevated); color:var(--text); }
.mech-mode-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
.graph-legend{ max-width:260px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); font-size:var(--fs-caption); }
.graph-legend[hidden]{ display:none; }
.legend-toggle{ display:flex; align-items:center; gap:6px; width:100%; padding:6px 10px; background:transparent; border:none; color:var(--text-muted); font-size:var(--fs-caption); cursor:pointer; text-align:left; }
.legend-toggle::after{ content:''; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); margin-left:auto; margin-top:-3px; }
.legend-toggle[aria-expanded="false"]::after{ transform:rotate(-135deg); margin-top:3px; }
.legend-toggle:hover{ color:var(--text); }
.legend-body{ padding:0 10px 8px; max-height:40vh; overflow-y:auto; }
.legend-body[hidden]{ display:none; }
.legend-group-title{ margin:6px 0 3px; color:var(--text-faint); font-size:var(--fs-caption); }
.legend-item{ display:flex; align-items:center; gap:7px; color:var(--text); line-height:1.6; }
.legend-item .dot{ width:10px; height:10px; border-radius:50%; flex:none; }
.legend-item .dot-diamond{ width:9px; height:9px; border-radius:1px; transform:rotate(45deg); background:transparent !important; border:2px solid var(--c); }
.legend-tag{ margin-left:auto; color:var(--text-faint); font-family:var(--mono); font-size:var(--fs-caption); }

/* Фокус-режим механизма */
.focus-banner{ position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:6px 8px 6px 12px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); font-size:var(--fs-base); color:var(--text); max-width:calc(100% - 32px); }
.focus-banner[hidden]{ display:none; }
.focus-banner-title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.focus-banner-title b{ font-weight:600; }
.card-actions{ margin-top:8px; display:flex; gap:6px; }
.view-list .card-actions{ display:none; } /* фокус-режим есть только на графе */
.canvas-tooltip{ position:absolute; z-index:5; max-width:320px; padding:6px 8px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); font-size:var(--fs-caption); color:var(--text); pointer-events:none; white-space:normal; }
.canvas-tooltip[hidden]{ display:none; }

/* Мини-карта (слева от контролов холста, вровень по нижнему краю) */
.minimap{ position:absolute; right:62px; bottom:14px; width:182px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.minimap-toggle{ display:flex; align-items:center; width:100%; padding:5px 8px; background:transparent; border:none; color:var(--text-muted); font-size:var(--fs-caption); cursor:pointer; text-align:left; }
.minimap-toggle::after{ content:''; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); margin-left:auto; margin-top:-3px; }
.minimap-toggle[aria-expanded="false"]::after{ transform:rotate(-135deg); margin-top:3px; }
.minimap-toggle:hover{ color:var(--text); }
.minimap-canvas{ display:block; width:180px; height:120px; border-top:1px solid var(--border-soft); cursor:pointer; background:var(--bg); }
.minimap-canvas[hidden]{ display:none; }

/* Контролы холста (правый нижний угол) */
.canvas-controls{ position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.canvas-ctl{ width:34px; height:32px; display:flex; align-items:center; justify-content:center; background:transparent; border:none; color:var(--text-muted); font-size:var(--fs-icon); line-height:1; cursor:pointer; }
.canvas-ctl + .canvas-ctl{ border-top:1px solid var(--border-soft); }
.canvas-ctl:hover{ background:var(--bg-selected); color:var(--text); }

#detail-panel[hidden], .resize-handle[hidden]{ display:none; }
#detail-panel{ width:340px; flex:none; border-left:1px solid var(--border); background:var(--bg-panel); overflow-y:auto; padding:18px; }
.panel-content[hidden]{ display:none; }
.panel-empty{ color:var(--text-muted); font-size:var(--fs-base); padding-top:36px; }
.panel-empty p{ margin:0 0 8px; }
.panel-header{ margin-bottom:16px; }
.panel-eyebrow{ font-size:var(--fs-caption); color:var(--text-faint); margin:0 0 4px; }
.panel-header h2{ font-size:var(--fs-heading); margin:0; font-weight:600; word-break:break-word; }
/* Шапка карточки: иконка + заголовок + сохранение + «⋯»; бейджи; имя в конфигураторе */
.card-head{ margin-bottom:14px; }
.card-head h2{ font-size:var(--fs-heading); margin:0; font-weight:600; word-break:break-word; }
.card-head-row{ display:flex; align-items:center; gap:8px; }

.card-head-row .save-indicator{ margin-left:0; }
.card-icon{ flex:none; display:flex; color:var(--c); }
.card-icon .type-icon{ width:20px; height:20px; }
.card-icon-mech{ width:12px; height:12px; margin:0 4px; border:2px solid var(--c); border-radius:2px; transform:rotate(45deg); }
.card-menu-btn{ flex:none; width:28px; height:26px; padding:0; background:transparent; border:1px solid transparent; border-radius:var(--radius); color:var(--text-muted); font-size:var(--fs-icon); line-height:1; cursor:pointer; }
.card-menu-btn:hover, .card-menu-btn[aria-expanded="true"]{ border-color:var(--border); color:var(--text); }
.card-head-badges{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.badge-btn{ border:1px solid transparent; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
.badge-btn::after{ content:''; width:4px; height:4px; border-right:1.2px solid currentColor; border-bottom:1.2px solid currentColor; transform:rotate(45deg); margin:-2px 1px 0 2px; opacity:.7; }

.status-badge{ font-size:var(--fs-caption); line-height:1.4; padding:0 6px; border-radius:3px; }
.status-badge.status-prod{ color:var(--success); background:var(--success-soft); }
.status-badge.status-dev{ color:var(--accent); background:var(--accent-soft); }

.name1c{ display:flex; align-items:center; gap:2px; margin-top:8px; font-family:var(--mono); font-size:var(--fs-caption); min-width:0; }

.name1c-id.is-empty{ font-family:var(--sans); color:var(--text-faint); font-style:italic; }
.name1c-input{ font-family:var(--mono); font-size:var(--fs-caption); padding:2px 5px; flex:1; min-width:0; }
.copy-btn{ flex:none; margin-left:6px; padding:0 6px; height:20px; background:transparent; border:1px solid var(--border); border-radius:var(--radius); color:var(--text-muted); font-size:var(--fs-caption); cursor:pointer; font-family:var(--sans); }

.field-error{ margin:4px 0 0; font-size:var(--fs-caption); color:var(--danger); }
.field-error[hidden], .copy-ok[hidden]{ display:none; }
.popover-menu{ position:fixed; right:auto; margin-top:0; z-index:60; min-width:180px; max-height:60vh; overflow-y:auto; }
.popover-menu .menu-item{ display:flex; align-items:center; gap:8px; }

.popover-menu .menu-item .type-icon{ color:var(--c); }
.cat-dot{ display:inline-block; width:9px; height:9px; margin:0 3px; border:2px solid var(--c); border-radius:2px; transform:rotate(45deg); }

/* Поля в режиме просмотра: текст, по клику — редактирование */
.vfield{ margin-top:12px; min-width:0; }
.vfield-label{ font-size:var(--fs-caption); color:var(--text-muted); margin-bottom:2px; }
.vfield-value{ position:relative; font-size:var(--fs-base); color:var(--text); white-space:pre-wrap; word-break:break-word; border-radius:var(--radius); margin:0 -4px; padding:2px 22px 2px 4px; cursor:text; min-height:22px; }

.vfield-row{ display:flex; gap:14px; }
.vfield-row .vfield{ flex:1; }
.vfield-input{ font-size:var(--fs-base); }
.vfield-textarea{ resize:none; overflow:hidden; min-height:60px; line-height:1.5; }
/* Подсистемы и теги: строка чипов в просмотре, редактор чипов с подсказками */
.chips-view{ display:flex; flex-wrap:wrap; gap:4px; }
.sub-chip{ display:inline-flex; align-items:center; gap:4px; padding:0 6px; border-radius:3px; font-size:var(--fs-caption); line-height:1.6; color:var(--text); border:1px solid var(--border); }
.sub-chip .type-icon{ width:12px; height:12px; color:var(--text-muted); }
.chip-edit-group + .chip-edit-group{ margin-top:8px; }
.chip-edit-label{ font-size:var(--fs-caption); color:var(--text-faint); margin-bottom:3px; }
.chip-editor{ position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:4px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); cursor:text; }
.chip-editor:focus-within{ border-color:var(--accent); }
.chip-editor .tag-chip, .chip-editor .sub-chip{ margin:0; }
.chip-x{ margin-left:2px; padding:0 2px; background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:var(--fs-caption); line-height:1; }
.chip-x:hover{ color:var(--danger); }
.chip-input{ flex:1; min-width:90px; padding:2px 4px; background:transparent; border:none; font-size:var(--fs-base); color:var(--text); }
.chip-input:focus{ outline:none; }
.chip-editor .combo-dropdown{ top:calc(100% + 2px); }
.combo-item.is-active{ background:var(--bg-panel); }
.tag-chip{ display:inline-block; margin:0 4px 2px 0; padding:0 6px; border-radius:3px; font-size:var(--fs-caption); line-height:1.6; color:var(--text); background:var(--bg-selected); }
.panel-section.is-tight{ margin-top:12px; padding-top:10px; }
.panel-section.is-tight .panel-section-title{ margin-bottom:4px; }
.panel-section.is-tight .panel-section-header{ margin-bottom:2px; }
.panel-section.is-tight .ref-empty{ padding:2px 0; }
.inline-title{ cursor:text; border-radius:var(--radius); margin:-2px -4px; padding:2px 4px; }
.inline-title:hover, .inline-title:focus-visible{ background:var(--bg-elevated); outline:none; }
.inline-title-input{ font-size:var(--fs-heading); font-weight:600; padding:2px 4px; margin:-3px -5px; width:calc(100% + 10px); }
.inline-msg{ margin:4px 0 0; font-size:var(--fs-caption); color:var(--danger); }
.inline-msg[hidden]{ display:none; }

.save-indicator{ margin-left:auto; display:flex; align-items:center; gap:6px; font-size:var(--fs-caption); color:var(--text-faint); white-space:nowrap; }
.save-indicator.is-error{ color:var(--danger); }
.save-retry{ background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:var(--radius); font-size:var(--fs-caption); padding:0 6px; cursor:pointer; }
.save-retry:hover{ background:var(--danger-soft); }

.field-label-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
.field-label-row .field-label{ margin:0; }
.link-btn{ background:transparent; border:none; padding:0; color:var(--text-muted); font-size:var(--fs-caption); cursor:pointer; }
.link-btn:hover{ color:var(--text); text-decoration:underline; }
.body-view{ white-space:pre-wrap; word-break:break-word; font-size:var(--fs-base); line-height:1.55; padding:7px 9px; min-height:44px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); cursor:text; }
.body-view:hover{ border-color:var(--border); }
.body-view.is-empty{ color:var(--text-faint); font-style:italic; }
.body-edit{ resize:none; overflow:hidden; min-height:80px; line-height:1.55; }
.obj-chip{ display:inline; font:inherit; color:var(--text); padding:0 5px; border-radius:3px; cursor:pointer; background:color-mix(in srgb, var(--c) var(--chip-bg-mix), transparent); border:1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.obj-chip:hover{ background:color-mix(in srgb, var(--c) 35%, transparent); }

.role-block + .role-block{ margin-top:12px; }
.role-block-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.role-block-title{ margin:0; font-size:var(--fs-caption); color:var(--text-muted); }
.role-block-empty{ margin:0; font-size:var(--fs-caption); color:var(--text-faint); }
.pcard{ position:relative; display:flex; align-items:flex-start; gap:8px; padding:6px 6px 6px 8px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); }
.pcard + .pcard, .role-add + .pcard, .pcard + .role-add{ margin-top:4px; }
.pcard:hover{ border-color:var(--border); }
.type-chip{ flex:none; min-width:26px; height:20px; padding:0 4px; margin-top:1px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--c); color:var(--graph-node-text); font-size:var(--fs-caption); font-weight:500; line-height:1; }
.pcard-main{ flex:1; min-width:0; }
.pcard-name{ display:block; background:transparent; border:none; padding:0; text-align:left; color:var(--text); font-size:var(--fs-base); line-height:1.4; cursor:pointer; word-break:break-word; }
.pcard-name:hover{ text-decoration:underline; }
.pcard-sub{ font-size:var(--fs-caption); color:var(--text-muted); line-height:1.4; cursor:text; word-break:break-word; }
.pcard-sub.is-empty{ color:var(--text-faint); font-style:italic; }
.pcard-role{ color:var(--text-faint); font-style:normal; }
.pcard-note-input{ font-size:var(--fs-caption); padding:3px 6px; margin-top:2px; }
.pcard-menu-wrap{ position:relative; flex:none; }
.pcard-menu-btn{ width:26px; height:24px; padding:0; background:transparent; border:1px solid transparent; border-radius:var(--radius); color:var(--text-muted); cursor:pointer; font-size:var(--fs-icon); line-height:1; }
.pcard-menu-btn:hover, .pcard-menu-btn[aria-expanded="true"]{ border-color:var(--border); color:var(--text); }
.pcard-menu{ right:0; min-width:220px; }
.role-add{ padding:6px 8px; background:var(--bg-elevated); border:1px dashed var(--border); border-radius:var(--radius); }
.field-group{ margin-bottom:12px; flex:1; min-width:0; }
.field-row{ display:flex; gap:10px; }
.field-label{ display:block; font-size:var(--fs-caption); color:var(--text-muted); margin-bottom:4px; }
.field-input{ width:100%; padding:7px 9px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); }
.field-input.mono{ font-family:var(--mono); font-size:var(--fs-caption); }
.field-textarea{ min-height:70px; resize:none; overflow:hidden; }
.field-textarea-lg{ min-height:120px; }
.panel-section{ margin-top:18px; padding-top:14px; border-top:1px solid var(--border-soft); }
.panel-section-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px; }
.panel-section-title{ font-size:var(--fs-base); color:var(--text-muted); margin:0; }
.panel-footer{ margin-top:20px; padding-top:14px; border-top:1px solid var(--border-soft); }
.panel-hint{ font-size:var(--fs-base); color:var(--text-muted); }

.ref-list{ display:flex; flex-direction:column; gap:4px; }
/* «Участвует в механизмах»: группы по роли объекта, механизмы без рамок, участники — с одной линией-отступом */
.panel-section-header .panel-section-title{ margin:0; }
#obj-mech-title{ white-space:nowrap; }
#btn-add-to-mech{ white-space:nowrap; padding-left:8px; padding-right:8px; }
.om-group + .om-group{ margin-top:10px; }
.om-group-title{ margin:0 0 4px; font-size:var(--fs-caption); color:var(--text-faint); text-transform:none; }
.om-mech + .om-mech{ margin-top:6px; }
.om-mech-row{ display:flex; align-items:flex-start; gap:6px; }
.om-toggle{ flex:none; width:16px; height:20px; padding:0; margin-top:1px; background:transparent; border:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.om-toggle::before{ content:''; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); margin-top:-3px; }
.om-toggle[aria-expanded="false"]::before{ transform:rotate(-45deg); margin-top:0; margin-left:-2px; }
.om-toggle:hover{ color:var(--text); }
.om-link{ flex:1; min-width:0; display:block; padding:1px 4px; margin:0 -4px; background:transparent; border:none; border-radius:var(--radius); text-align:left; cursor:pointer; color:var(--text); font:inherit; }
.om-link:hover{ background:var(--bg-elevated); }
.om-mech-title{ display:flex; align-items:center; gap:7px; font-size:var(--fs-base); font-weight:500; }
.om-diamond{ width:8px; height:8px; flex:none; border:2px solid var(--c); border-radius:2px; transform:rotate(45deg); }
.om-note{ display:block; font-size:var(--fs-caption); color:var(--text-muted); margin-top:1px; padding-left:15px; }
.om-parts{ margin:4px 0 0 7px; padding-left:14px; border-left:1px solid var(--border); display:flex; flex-direction:column; gap:3px; }
.om-parts[hidden]{ display:none; }
.om-part-title{ display:flex; align-items:center; gap:7px; font-size:var(--fs-base); }
.om-part-title .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.om-part-meta{ display:block; font-size:var(--fs-caption); color:var(--text-faint); padding-left:15px; }
.om-part-note{ display:block; font-size:var(--fs-caption); color:var(--text-muted); padding-left:15px; }
.om-empty-parts{ font-size:var(--fs-caption); color:var(--text-faint); margin:0; }
.om-add{ margin:6px 0 10px; padding:8px; background:var(--bg-elevated); border:1px dashed var(--border); border-radius:var(--radius); display:flex; flex-direction:column; gap:8px; }
.om-add-label{ font-size:var(--fs-caption); color:var(--text-muted); }
.om-add-roles{ display:flex; flex-wrap:wrap; gap:4px; }
.om-add-role{ padding:3px 8px; border:1px solid var(--border); border-radius:var(--radius); background:transparent; color:var(--text); font-size:var(--fs-caption); cursor:pointer; }
.om-add-role.is-on{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.om-add-actions{ display:flex; gap:6px; justify-content:flex-end; }
.ref-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); cursor:pointer; text-align:left; width:100%; }
.ref-item:hover{ border-color:var(--text-faint); }
.ref-item .dot{ width:8px; height:8px; border-radius:2px; transform:rotate(45deg); flex:none; }
.ref-item-main{ display:flex; flex-direction:column; min-width:0; }
.ref-item-title{ font-size:var(--fs-base); color:var(--text); }
.ref-item-role{ font-size:var(--fs-caption); color:var(--text-faint); }
.ref-group{ display:flex; flex-direction:column; gap:3px; }
.ref-group + .ref-group{ margin-top:6px; }
.ref-sublist{ display:flex; flex-direction:column; gap:3px; margin-left:14px; padding-left:8px; border-left:1px solid var(--border-soft); }
.ref-item-obj{ padding:5px 8px; }
.ref-item-obj .dot{ border-radius:50%; transform:none; }
.ref-sub-empty{ font-size:var(--fs-caption); color:var(--text-faint); padding:3px 0 3px 2px; margin:0; }

.icon-btn{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); color:var(--text-muted); cursor:pointer; font-size:var(--fs-icon); line-height:1; }
.icon-btn:hover{ color:var(--danger); border-color:var(--danger); }

.mech-ref-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.mech-ref-item{ display:flex; flex-direction:column; gap:2px; text-align:left; padding:8px 10px; background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:var(--radius); cursor:pointer; width:100%; }
.mech-ref-item:hover{ border-color:var(--accent); }
.mech-ref-title{ font-size:var(--fs-base); color:var(--text); font-weight:500; display:flex; align-items:center; gap:6px; }
.mech-ref-title .dot{ width:8px; height:8px; border-radius:2px; transform:rotate(45deg); flex:none; }
.mech-ref-summary{ font-size:var(--fs-caption); color:var(--text-muted); }

.attachment-row{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--border-soft); }
.attachment-name{ flex:1; min-width:0; font-size:var(--fs-base); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.attachment-size{ font-size:var(--fs-caption); color:var(--text-faint); flex:none; }

.combo{ position:relative; }
.combo-dropdown{ position:absolute; top:100%; left:0; right:0; z-index:10; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); margin-top:2px; max-height:220px; overflow-y:auto; }
.combo-item{ display:flex; align-items:center; gap:6px; padding:6px 8px; cursor:pointer; font-size:var(--fs-base); }
.combo-item:hover{ background:var(--bg-panel); }
.combo-item .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.combo-item-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.combo-item-type{ font-size:var(--fs-caption); color:var(--text-faint); flex:none; }
.combo-item-create{ color:var(--accent); border-top:1px solid var(--border-soft); }
.combo-empty{ padding:8px; font-size:var(--fs-caption); color:var(--text-faint); }

#modal-root:empty{ display:none; }
.list-view{ flex:1; display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--bg); }
.list-view[hidden]{ display:none; }
.list-view-toolbar{ display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border); background:var(--bg-panel); flex-wrap:wrap; flex:none; }
.list-view-toolbar .search-input{ flex:1; min-width:220px; }
.multi-select{ position:relative; flex:none; }
.multi-select-btn{ min-width:170px; max-width:260px; padding:7px 26px 7px 10px; text-align:left; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; }
.multi-select-btn::after{ content:''; position:absolute; right:10px; top:50%; width:6px; height:6px; margin-top:-5px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); }
.multi-select-btn.has-value{ color:var(--accent); border-color:var(--accent); }
.multi-select-dropdown{ position:absolute; top:100%; right:0; z-index:20; min-width:270px; margin-top:4px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); max-height:360px; overflow-y:auto; padding:4px 0; }
.multi-select-item{ display:flex; align-items:center; gap:8px; padding:6px 10px; cursor:pointer; font-size:var(--fs-base); color:var(--text); }
.multi-select-item:hover{ background:var(--bg-panel); }
.multi-select-item input{ margin:0; flex:none; accent-color:var(--accent); }
.multi-select-item .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.multi-select-item .dot-diamond{ border-radius:2px; transform:rotate(45deg); }
.multi-select-item-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.multi-select-item-count{ font-size:var(--fs-caption); color:var(--text-faint); flex:none; }
.multi-select-sep{ border-top:1px solid var(--border-soft); margin:4px 0; }
.multi-select-reset{ display:block; width:100%; padding:6px 10px; background:transparent; border:none; text-align:left; font-size:var(--fs-caption); color:var(--accent); cursor:pointer; }
.multi-select-reset:disabled{ color:var(--text-faint); cursor:default; }
.list-view-body{ flex:1; overflow-y:auto; padding:6px 20px 30px; min-height:0; }
.list-view-row{ width:100%; display:flex; align-items:center; gap:14px; padding:9px 10px; background:transparent; border:none; border-bottom:1px solid var(--border-soft); text-align:left; cursor:pointer; border-radius:var(--radius); }
/* Таблица режима «Список»: шапка и строки — одна сетка (--lv-cols задаётся из JS по видимым колонкам). */
.list-tabs{ background:var(--bg-panel); }
.list-tabs .side-tab{ flex:0 0 auto; padding-left:20px; padding-right:20px; }
.list-filters{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.list-filters .multi-select-btn{ min-width:150px; }
.list-filters .multi-select-dropdown{ right:auto; left:0; }
.list-view-body{ padding-top:0; }
.lv-head, .lv-row{ display:grid; grid-template-columns:var(--lv-cols); column-gap:16px; align-items:center; }
.lv-head{ position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 10px 6px; }
.lv-sort{ display:flex; align-items:center; gap:4px; min-width:0; padding:2px 0; background:transparent; border:none; color:var(--text-faint); font-size:var(--fs-caption); text-align:left; cursor:pointer; white-space:nowrap; }
.lv-sort:hover{ color:var(--text); }
.lv-sort.is-sorted{ color:var(--text); }
.lv-sort-arrow{ font-size:var(--fs-caption); }
.lv-group-title{ display:flex; align-items:center; gap:7px; font-size:var(--fs-caption); color:var(--text-faint); margin:16px 0 2px; padding-left:10px; }
.lv-group-title .type-icon{ color:var(--c); }
.lv-group-title .dot{ width:8px; height:8px; flex:none; }
.lv-group-title .dot-diamond{ border-radius:2px; transform:rotate(45deg); }
.list-view-row.lv-row{ display:grid; column-gap:16px; padding:8px 10px; }
.lv-cell{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-base); color:var(--text-muted); }
.lv-cell.is-name{ font-size:var(--fs-md); color:var(--text); display:flex; align-items:center; gap:8px; }
.lv-cell.is-name .lv-text{ overflow:hidden; text-overflow:ellipsis; }
.lv-cell.is-name .dot{ width:8px; height:8px; flex:none; border-radius:2px; transform:rotate(45deg); }
.lv-cell.is-code{ font-family:var(--mono); font-size:var(--fs-caption); }
.lv-cell.is-count{ display:flex; align-items:center; gap:6px; }
.lv-cell.is-count.is-zero{ color:var(--text-faint); }
.lv-diamond{ width:7px; height:7px; flex:none; border:1.5px solid currentColor; border-radius:1px; transform:rotate(45deg); }
.lv-cell.is-list{ display:flex; gap:6px; }
.lv-cell.is-list .lv-text{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
.lv-more{ color:var(--text-faint); flex:none; }
.lv-row.is-deprecated .lv-cell.is-name .lv-text{ text-decoration:line-through; text-decoration-color:var(--text-faint); color:var(--text-muted); }
.list-view-row:hover{ background:var(--bg-elevated); }
.list-view-row.active{ background:var(--accent-soft); }
.modal-backdrop{ position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; z-index:50; }
.modal-box{ width:360px; max-width:92vw; background:var(--bg-panel); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.modal-box-md{ width:470px; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border-soft); }
.modal-header h2{ font-size:var(--fs-lg); margin:0; }
.modal-close{ background:none; border:none; color:var(--text-muted); font-size:var(--fs-icon-lg); cursor:pointer; line-height:1; }
.modal-body{ padding:16px; }
.modal-body p{ margin:0; font-size:var(--fs-base); color:var(--text-muted); }
.modal-footer{ display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; padding:12px 16px; border-top:1px solid var(--border-soft); }
.settings-meta{ margin-top:6px; font-size:var(--fs-caption); color:var(--text-faint); }
.logo-line{ fill:none; stroke:var(--accent); }
.logo-n1{ fill:var(--logo-1); } .logo-n2{ fill:var(--logo-2); } .logo-n3{ fill:var(--logo-3); } .logo-n4{ fill:var(--logo-4); }

/* ===== Роли и реквизиты (процессы, фаза 1) ===== */
.deprecated-switch[hidden]{ display:none; }
.card-icon-role{ color:var(--text-muted); }
.attr-head, .attr-row{ display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.75fr) 26px; column-gap:8px; align-items:center; }
.attr-head{ font-size:var(--fs-caption); color:var(--text-faint); padding:2px 0 4px; border-bottom:1px solid var(--border-soft); }
.attr-group-toggle{ width:100%; display:flex; align-items:center; gap:6px; padding:6px 0 2px; background:transparent; border:none; text-align:left; cursor:pointer; color:var(--text-muted); font-size:var(--fs-caption); }
.attr-group-toggle:hover{ color:var(--text); }
.attr-group-chevron{ width:12px; height:12px; display:flex; align-items:center; justify-content:center; flex:none; }
.attr-group-chevron::before{ content:''; width:5px; height:5px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(45deg); margin-top:-3px; }
.attr-group-toggle[aria-expanded="false"] .attr-group-chevron::before{ transform:rotate(-45deg); margin-top:0; margin-left:-2px; }
.attr-group-count{ color:var(--text-faint); }
.attr-rows[hidden]{ display:none; }
.attr-cell{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:2px 4px; border-radius:var(--radius); color:var(--text-muted); cursor:text; }
.attr-cell:hover, .attr-cell:focus-visible{ background:var(--bg-elevated); outline:none; }
.attr-cell.is-name{ font-family:var(--mono); font-size:var(--fs-caption); color:var(--text); }
.attr-cell.is-empty{ color:var(--text-faint); }
.attr-menu-btn{ width:24px; height:22px; }
.attr-cell-input{ padding:2px 4px; font-size:var(--fs-caption); }
.attr-cell-input.is-name, .attr-add-name{ font-family:var(--mono); }
.attr-add-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.attr-add-grid .field-input{ padding:5px 7px; font-size:var(--fs-caption); }
.attr-add-hint{ margin:0; font-size:var(--fs-caption); color:var(--text-faint); }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-left">
      <h1 class="app-title">
        <svg class="app-logo" viewBox="0 0 24 24" aria-hidden="true"><polyline class="logo-line" points="5,19 5,5 19,19 19,5" stroke-width="2" stroke-linejoin="round"/><circle class="logo-n2" cx="5" cy="19" r="2.6"/><circle class="logo-n1" cx="5" cy="5" r="2.6"/><circle class="logo-n3" cx="19" cy="19" r="2.6"/><circle class="logo-n4" cx="19" cy="5" r="2.6"/></svg>
        Nodus <span class="app-version">v.0.5.0</span>
      </h1>
    </div>
    <div class="topbar-group">
      <div class="view-toggle" role="tablist">
        <button class="mode-btn active" data-view="graph" type="button">Граф</button>
        <button class="mode-btn" data-view="list" type="button">Список</button>
      </div>
    </div>
    <div class="global-search" id="global-search">
      <input type="text" id="global-search-input" class="global-search-input" placeholder="Поиск объектов и механизмов" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="global-search-dropdown">
      <span class="global-search-kbd" id="global-search-kbd">Ctrl+K</span>
      <div class="global-search-dropdown" id="global-search-dropdown" role="listbox" hidden></div>
    </div>
    <div class="topbar-right">
      <button class="btn" id="btn-settings" type="button">Настройки</button>
      <div class="menu-wrap">
        <button class="btn menu-btn" id="btn-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Ещё действия" title="Ещё действия">⋯</button>
        <div class="menu" id="more-menu" role="menu" hidden>
          <button class="menu-item" id="btn-export" type="button" role="menuitem">Экспорт</button>
          <button class="menu-item" id="btn-import" type="button" role="menuitem">Импорт</button>
          <div class="menu-sep" role="separator"></div>
          <button class="menu-item menu-item-danger" id="btn-reset" type="button" role="menuitem">Очистить всё</button>
        </div>
      </div>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </header>
  <div id="workspace">
  <div id="main">
    <aside id="sidebar-left">
      <div class="side-tabs" role="tablist">
        <button class="side-tab active" data-side="objects" type="button" role="tab">Объекты <span id="side-count-objects">0</span></button>
        <button class="side-tab" data-side="mechanisms" type="button" role="tab">Механизмы <span id="side-count-mechanisms">0</span></button>
      </div>
      <div class="sidebar-section side-search">
        <input type="text" id="search-input" class="search-input" placeholder="Поиск объектов…" autocomplete="off">
        <button class="btn btn-accent side-create" id="btn-side-add" type="button" title="Создать объект" aria-label="Создать объект">+</button>
      </div>
      <div class="sidebar-section filters">
        <div class="filters-row" id="side-filters-objects">
          <div class="multi-select side-sub-filter" data-ms="side-sub">
            <button class="select-sm multi-select-btn" type="button" aria-haspopup="true" aria-expanded="false">Все подсистемы</button>
            <div class="multi-select-dropdown" hidden></div>
          </div>
          <select id="filter-tag" class="select-sm"><option value="">Все теги</option></select>
        </div>
        <div class="filters-row" id="side-filters-mechanisms" hidden>
          <select id="filter-mechcategory" class="select-sm"><option value="">Все категории</option></select>
        </div>
        <label class="switch deprecated-switch">
          <input type="checkbox" class="toggle-deprecated">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-label">Показывать устаревшие</span>
        </label>
      </div>
      <div class="sidebar-section list-wrap">
        <div id="object-list"></div>
      </div>
    </aside>
    <div class="resize-handle" id="resize-left" aria-hidden="true"></div>
    <main id="canvas-wrap">
      <canvas id="graph-canvas"></canvas>
      <div id="empty-state" class="empty-state">
        <p class="empty-title">Пока нет ни одного объекта</p>
        <p class="empty-hint">Данные хранятся только в этом браузере. Добавьте первый объект, чтобы увидеть граф связей.</p>
        <button class="btn btn-accent" id="btn-add-object-empty" type="button">Добавить объект</button>
      </div>
      <div class="canvas-bottom-left">
        <div class="graph-legend" id="graph-legend" hidden>
          <button class="legend-toggle" id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-body">Легенда</button>
          <div class="legend-body" id="legend-body"></div>
        </div>
        <div class="mech-mode" id="mech-mode" role="radiogroup" aria-label="Механизмы">
          <span class="mech-mode-label">Механизмы:</span>
          <button type="button" class="mech-mode-btn" data-mode="full" role="radio" aria-checked="false">узлами</button>
          <button type="button" class="mech-mode-btn" data-mode="collapsed" role="radio" aria-checked="true">связями</button>
        </div>
      </div>
      <div class="focus-banner" id="focus-banner" hidden>
        <span class="focus-banner-title" id="focus-banner-title"></span>
        <button class="btn btn-sm" id="btn-exit-focus" type="button">Выйти из фокуса</button>
      </div>
      <div class="canvas-tooltip" id="canvas-tooltip" role="tooltip" hidden></div>
      <div class="minimap" id="minimap">
        <button class="minimap-toggle" id="minimap-toggle" type="button" aria-expanded="false" aria-controls="minimap-canvas">Мини-карта</button>
        <canvas class="minimap-canvas" id="minimap-canvas" hidden></canvas>
      </div>
      <div class="canvas-controls" role="toolbar" aria-label="Управление холстом">
        <button class="canvas-ctl" id="btn-zoom-in" type="button" title="Приблизить" aria-label="Приблизить">+</button>
        <button class="canvas-ctl" id="btn-zoom-out" type="button" title="Отдалить" aria-label="Отдалить">−</button>
        <button class="canvas-ctl" id="btn-fit" type="button" title="Вписать в экран" aria-label="Вписать в экран">⤢</button>
        <button class="canvas-ctl" id="btn-relayout" type="button" title="Разложить заново" aria-label="Разложить заново">↻</button>
      </div>
    </main>
  </div>
  <div id="list-view" class="list-view" hidden>
    <div class="side-tabs list-tabs" role="tablist">
      <button class="side-tab list-tab active" data-list-tab="objects" type="button" role="tab">Объекты <span id="list-count-objects">0</span></button>
      <button class="side-tab list-tab" data-list-tab="mechanisms" type="button" role="tab">Механизмы <span id="list-count-mechanisms">0</span></button>
      <button class="side-tab list-tab" data-list-tab="roles" type="button" role="tab">Роли <span id="list-count-roles">0</span></button>
    </div>
    <div class="list-view-toolbar">
      <input type="text" id="list-search" class="search-input" placeholder="Имя, синоним или описание" autocomplete="off">
      <div id="list-filters" class="list-filters"></div>
      <label class="switch deprecated-switch">
        <input type="checkbox" class="toggle-deprecated">
        <span class="switch-track" aria-hidden="true"></span>
        <span class="switch-label">Показывать устаревшие</span>
      </label>
      <button class="btn btn-accent" id="btn-list-add" type="button">+ Объект</button>
    </div>
    <div class="list-view-body" id="list-view-body"></div>
  </div>
    <div class="resize-handle" id="resize-right" aria-hidden="true"></div>
    <aside id="detail-panel">
      <div id="panel-empty" class="panel-empty">
        <p>Ничего не выбрано.</p>
        <p>Выберите объект или механизм на графе или в списке слева, чтобы увидеть и отредактировать детали.</p>
      </div>
      <div id="panel-object" class="panel-content" hidden></div>
      <div id="panel-mechanism" class="panel-content" hidden></div>
      <div id="panel-edge" class="panel-content" hidden></div>
      <div id="panel-role" class="panel-content" hidden></div>
    </aside>
  </div>
</div>
<div id="modal-root"></div>

<script>
'use strict';

/* ===================== Справочники ===================== */

/* Словарь типов — единственное место, где задаются их подписи.
   Порядок — как в дереве конфигуратора 1С («Общие» сначала).
   title  — подпись в единственном числе (бейджи, крошки, легенда, поле «Тип»);
   plural — подпись во множественном числе (группы дерева и списка, фильтр типов);
   name1c — имя вида метаданных в конфигураторе (префикс «Имени в конфигураторе»);
   short  — метка типа внутри круга на графе. */
var OBJECT_TYPES = [
  {code:'subsystem', title:'Подсистема',              plural:'Подсистемы',               name1c:'Подсистема',             short:'Под'},
  {code:'commonmod', title:'Общий модуль',            plural:'Общие модули',             name1c:'ОбщийМодуль',            short:'ОМ'},
  {code:'role',      title:'Роль',                    plural:'Роли',                     name1c:'Роль',                   short:'Роль'},
  {code:'const',     title:'Константа',               plural:'Константы',                name1c:'Константа',              short:'Кон'},
  {code:'catalog',   title:'Справочник',              plural:'Справочники',              name1c:'Справочник',             short:'Спр'},
  {code:'document',  title:'Документ',                plural:'Документы',                name1c:'Документ',               short:'Док'},
  {code:'doclog',    title:'Журнал документов',       plural:'Журналы документов',       name1c:'ЖурналДокументов',       short:'ЖД'},

  {code:'report',    title:'Отчёт',                   plural:'Отчёты',                   name1c:'Отчет',                  short:'Отч'},
  {code:'process',   title:'Обработка',               plural:'Обработки',                name1c:'Обработка',              short:'Обр'},
  {code:'charchart', title:'План видов характеристик',plural:'Планы видов характеристик',name1c:'ПланВидовХарактеристик', short:'ПВХ'},
  {code:'infreg',    title:'Регистр сведений',        plural:'Регистры сведений',        name1c:'РегистрСведений',        short:'РС'},
  {code:'accumreg',  title:'Регистр накопления',      plural:'Регистры накопления',      name1c:'РегистрНакопления',      short:'РН'},
  {code:'bproc',     title:'Бизнес-процесс',          plural:'Бизнес-процессы',          name1c:'БизнесПроцесс',          short:'БП'},
  {code:'task',      title:'Задача',                  plural:'Задачи',                   name1c:'Задача',                 short:'Зад'},
  {code:'extsrc',    title:'Внешний источник данных', plural:'Внешние источники данных', name1c:'ВнешнийИсточникДанных',  short:'ВИД'}
];
var DEFAULT_OBJECT_TYPE = 'const';

/* Иконки типов (контурные, 16×16, цвет — currentColor). */
var TYPE_ICON_PATHS = {
  subsystem:'<rect x="2" y="2" width="12" height="4" rx="1"/><rect x="2" y="10" width="12" height="4" rx="1"/><path d="M8 6v4"/>',
  commonmod:'<path d="M3 2h7l3 3v9H3z"/><path d="M6.5 8 5 9.5 6.5 11M9.5 8 11 9.5 9.5 11"/>',
  role:'<circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/>',
  'const':'<rect x="6" y="1.5" width="4" height="4" rx=".6"/><rect x="1.5" y="10.5" width="4" height="4" rx=".6"/><rect x="10.5" y="10.5" width="4" height="4" rx=".6"/><path d="M8 5.5v2.5M3.5 10.5V8h9v2.5"/>',
  catalog:'<rect x="2" y="2" width="3.4" height="12" rx=".6"/><rect x="6.3" y="2" width="3.4" height="12" rx=".6"/><rect x="10.6" y="2" width="3.4" height="12" rx=".6"/><path d="M3 5h1.4M7.3 5h1.4M11.6 5h1.4M3 11h1.4M7.3 11h1.4M11.6 11h1.4"/>',
  document:'<rect x="3" y="1.5" width="10" height="13" rx="1"/><path d="M5.5 5h5M5.5 8h5M5.5 11h5"/>',
  doclog:'<rect x="2" y="1.5" width="12" height="13" rx="1"/><path d="M4.5 1.5v13"/><rect x="6.5" y="4" width="5.5" height="7.5" rx=".4"/><path d="M6.5 6.5h5.5M6.5 9h5.5M9.2 4v7.5"/>',

var FORMAT_VERSION = 2;

function dataSummary(data){
  function n(sec){ return Object.keys((data && data[sec]) || {}).length; }
  var oc = n('objects'), mc = n('mechanisms'), rc = n('roles'), ac = n('attributes');
  var parts = [oc + ' ' + pluralRu(oc,'объект','объекта','объектов'), mc + ' ' + pluralRu(mc,'механизм','механизма','механизмов')];
  if (rc) parts.push(rc + ' ' + pluralRu(rc,'роль','роли','ролей'));
  if (ac) parts.push(ac + ' ' + pluralRu(ac,'реквизит','реквизита','реквизитов'));
  return parts.join(', ');
}

function escapeHtml(str){

function pluralRu(n, one, few, many){

}

/* ===================== Хранение ===================== */

/* Индикатор сохранения в карточке: «Сохранение…» пока идут правки, «Сохранено» через
   SAVE_SETTLE_MS после последней записи, «Ошибка сохранения» — если не удалась запись
   в localStorage или в подключённую папку. Сама механика записи прежняя: каждая правка
   сразу пишется в localStorage и (если подключена) в папку. */
var SAVE_SETTLE_MS = 400;
var saveStatus = 'saved'; /* saved | saving | error */
var saveSettleTimer = null;
var lastLocalSaveFailed = false;

function setSaveStatus(s){
  saveStatus = s;
  document.querySelectorAll('.save-indicator').forEach(renderSaveIndicator);
}
function renderSaveIndicator(el){
  el.classList.toggle('is-error', saveStatus === 'error');
  if (saveStatus === 'error'){
    el.innerHTML = 'Ошибка сохранения <button type="button" class="save-retry">Повторить</button>';
    el.querySelector('.save-retry').addEventListener('click', retrySave);
  } else {
    el.textContent = saveStatus === 'saving' ? 'Сохранение…' : 'Сохранено';
  }
}
function retrySave(){
  if (folderHandle && autoSaveStatus === 'error') autoSaveStatus = 'connected';
  persist();
}

function persist(){
  lastLocalSaveFailed = false;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
  }catch(e){
    lastLocalSaveFailed = true;
    console.warn('Не удалось сохранить в localStorage (нормально для предпросмотра внутри Claude — при открытии файла напрямую в браузере сохранение работает).', e);
  }
  if (saveSettleTimer) clearTimeout(saveSettleTimer);
  if (lastLocalSaveFailed){ setSaveStatus('error'); return saveToFolder(); }
  setSaveStatus('saving');
  var folderDone = saveToFolder();
  saveSettleTimer = setTimeout(function(){
    saveSettleTimer = null;
    folderDone.then(function(ok){ if (!saveSettleTimer && !lastLocalSaveFailed) setSaveStatus(ok ? 'saved' : 'error'); });
  }, SAVE_SETTLE_MS);
}
function loadPersisted(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    applyState(JSON.parse(raw));
  }catch(e){
    console.warn('Не удалось прочитать localStorage.', e);
  }
}

/* ===================== Автосохранение в папку (File System Access API) =====================
   Работает только в Chrome/Edge (не в Firefox/Safari) и требует явного выбора папки
   пользователем через системный диалог — сайт не может получить произвольный путь строкой.
   Handle папки хранится в IndexedDB, чтобы не спрашивать папку заново при каждом открытии;
   само разрешение на запись браузер иногда просит подтвердить повторно — это нормально. */

var IDB_NAME = 'objectGraphPrototypeDB';
var IDB_STORE = 'handles';

function openHandleDB(){
  return new Promise(function(resolve, reject){
    if (!window.indexedDB){ reject(new Error('indexedDB недоступен')); return; }
    var req;
    try { req = indexedDB.open(IDB_NAME, 1); } catch(e){ reject(e); return; }
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSet(key, value){
  return openHandleDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return openHandleDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbDelete(key){
  return openHandleDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function connectFolder(){
  if (!folderSupported) return;
  window.showDirectoryPicker({mode:'readwrite', id:'object-graph-storage'}).then(function(handle){
    folderHandle = handle;
    autoSaveStatus = 'connected';
    idbSet('folderHandle', handle).catch(function(){});
    saveToFolder();
    openSettingsModal();
  }).catch(function(err){
    if (err && err.name === 'AbortError') return;
    console.warn('Не удалось подключить папку', err);
  });
}
function disconnectFolder(){
  folderHandle = null;
  autoSaveStatus = 'disconnected';
  idbDelete('folderHandle').catch(function(){});
}
function reconnectFolderPermission(){
  if (!folderHandle) return;
  folderHandle.requestPermission({mode:'readwrite'}).then(function(perm){
    autoSaveStatus = (perm === 'granted') ? 'connected' : 'needs-permission';
    if (perm === 'granted') saveToFolder();
    openSettingsModal();
  }).catch(function(){});
}
function tryRestoreFolder(){
  if (!folderSupported) return;
  idbGet('folderHandle').then(function(handle){
    if (!handle) return;
    return handle.queryPermission({mode:'readwrite'}).then(function(perm){
      folderHandle = handle;
      autoSaveStatus = (perm === 'granted') ? 'connected' : 'needs-permission';
    });
  }).catch(function(){ /* сохранённой папки нет, или API недоступен в этом контексте */ });
}
/* Возвращает Promise<boolean>: false — запись в подключённую папку не удалась. */
function saveToFolder(){
  if (!folderHandle) return Promise.resolve(true);
  if (autoSaveStatus !== 'connected') return Promise.resolve(autoSaveStatus !== 'error');
  var data = JSON.stringify(serializeState(), null, 2);
  return folderHandle.getFileHandle('object-graph-data.json', {create:true}).then(function(fh){
    return fh.createWritable();
  }).then(function(writable){
    return writable.write(data).then(function(){ return writable.close(); });
  }).then(function(){
    lastFolderSaveAt = new Date();
    updateSettingsSaveStatus();
    return true;
  }).catch(function(err){
    console.warn('Не удалось сохранить в папку', err);
    autoSaveStatus = 'error';
    return false;
  });
}

/* ===================== Вложения (только в подключённой папке) =====================
   Метаданные (имя, размер) хранятся в state и попадают в localStorage/экспорт как обычно.
   Сами файлы лежат только в подключённой папке, в attachments/obj-<id>/ или attachments/mech-<id>/ —
   поэтому все действия с файлами (прикрепить/открыть/удалить с диска) требуют подключённой папки. */

function formatFileSize(bytes){
  if (bytes === undefined || bytes === null) return '';
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' КБ';
  return (bytes/1024/1024).toFixed(1) + ' МБ';
}

function getAttachmentsDirForEntity(kind, id){
  if (!folderHandle || autoSaveStatus !== 'connected') return Promise.reject(new Error('Папка не подключена'));
  return folderHandle.getDirectoryHandle('attachments', {create:true}).then(function(root){
    return root.getDirectoryHandle(kind + '-' + id, {create:true});
  });
}

function attachFilesToEntity(kind, id, onDone){
  if (!folderSupported){
    alert('Вложения работают только в Chrome и Edge — эти браузеры умеют сохранять файлы в выбранную папку.');
    return;
  }
  if (!folderHandle || autoSaveStatus !== 'connected'){
    alert('Сначала подключите папку в Настройках — вложения хранятся только в ней, а не в браузере.');
    return;
  }
  window.showOpenFilePicker({multiple:true}).then(function(fileHandles){
    return getAttachmentsDirForEntity(kind, id).then(function(dir){
      return Promise.all(fileHandles.map(function(fh){
        return fh.getFile().then(function(file){
          return dir.getFileHandle(file.name, {create:true}).then(function(destHandle){
            return destHandle.createWritable().then(function(w){
              return w.write(file).then(function(){ return w.close(); });
            }).then(function(){
              return {name:file.name, size:file.size, addedAt:new Date().toISOString()};
            });
          });
        });
      }));
    });
  }).then(function(added){
    var entity = kind === 'obj' ? state.objects[id] : state.mechanisms[id];
    if (!entity) return;
    if (!entity.attachments) entity.attachments = [];
    added.forEach(function(a){
      var idx = entity.attachments.findIndex(function(x){ return x.name === a.name; });
      if (idx >= 0) entity.attachments[idx] = a; else entity.attachments.push(a);
    });
    persist();
    if (onDone) onDone();
  }).catch(function(err){
    if (err && err.name === 'AbortError') return;
    console.warn('Не удалось прикрепить файл', err);
    alert('Не удалось прикрепить файл: ' + (err && err.message ? err.message : err));
  });
}

function openAttachment(kind, id, name){
  if (!folderHandle || autoSaveStatus !== 'connected'){
    alert('Подключите папку в Настройках, чтобы открывать вложения.');
    return;
  }
  getAttachmentsDirForEntity(kind, id).then(function(dir){
    return dir.getFileHandle(name);
  }).then(function(fh){
    return fh.getFile();
  }).then(function(file){
    var url = URL.createObjectURL(file);
    window.open(url, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }).catch(function(err){
    console.warn('Не удалось открыть вложение', err);
    alert('Не удалось открыть файл. Возможно, его переместили или удалили из папки вручную.');
  });
}

function removeAttachment(kind, id, name, afterRemove){
  var entity = kind === 'obj' ? state.objects[id] : state.mechanisms[id];
  var finish = function(){
    entity.attachments = (entity.attachments||[]).filter(function(a){ return a.name !== name; });
    persist();
    if (afterRemove) afterRemove();
  };
  if (folderHandle && autoSaveStatus === 'connected'){
    getAttachmentsDirForEntity(kind, id).then(function(dir){
      return dir.removeEntry(name).catch(function(){ /* файла на диске уже нет — не страшно */ });
    }).then(finish);
  } else {
    finish();
  }
}

function renderAttachmentsList(panel, selector, kind, id){
  var container = panel.querySelector(selector);
  if (!container) return;
  var entity = kind === 'obj' ? state.objects[id] : state.mechanisms[id];
  var list = (entity && entity.attachments) || [];
  if (!list.length){
    container.innerHTML = '<p class="ref-empty">Пока нет вложений.</p>';
    return;
  }
  container.innerHTML = list.map(function(a){
    return '<div class="attachment-row">' +

}
