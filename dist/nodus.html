    {key:'procs', title:'Используется в процессах', width:'200px'}
  ]
};
var listTableWidth = 0;

function objectIdentifier(o){ var fn = o.fullName || ''; var i = fn.indexOf('.'); return i >= 0 ? fn.slice(i + 1) : fn; }
function objectTypeKey(o){ return typeInfo(o.type) ? o.type : ''; }

/* Роли объекта в каждом механизме — для подсказки у счётчика «Механизмы». */
function objectMechanismRoles(oid){
  var out = [];
  Object.keys(state.mechanisms).forEach(function(mid){
    var m = state.mechanisms[mid], roles = [];
    m.participants.forEach(function(p){
      if (p.objectId !== oid) return;
      var t = roleInfo(p.role).title; if (roles.indexOf(t) < 0) roles.push(t);
    });
    if (roles.length) out.push({mech:m, roles:roles});
  });
  return out.sort(function(a,b){ return a.mech.title.localeCompare(b.mech.title,'ru'); });
}
/* Источники и приёмники механизма — по направлению роли; синонимы без повторов. */
function mechanismSides(m){
  var src = [], dst = [];
  m.participants.forEach(function(p){
    var o = p.objectId && state.objects[p.objectId]; if (!o) return;
    var dir = roleInfo(p.role).direction;
    var arr = dir === 'source' ? src : (dir === 'target' ? dst : null);
    if (arr && arr.indexOf(o.name) < 0) arr.push(o.name);
  });
  return {sources:src, targets:dst};
}
function mechanismParticipantObjects(m){
  var out = [];
  m.participants.forEach(function(p){ var o = p.objectId && state.objects[p.objectId]; if (o && out.indexOf(o) < 0) out.push(o); });
  return out;
}

/* Значения ячеек: text — показ и сортировка; пустая строка — пустая ячейка (в сортировке всегда в конце). */
function listObjectValues(o, mechRoles, attrCount){
  var subs = objectSubsystems(o), tags = o.tags || [];
  var st = o.status || DEFAULT_OBJECT_STATUS;
  return {
    name: o.name,
    code: objectIdentifier(o),
    sub: subs.join(', '),
    mechs: mechRoles.length,
    attrs: attrCount || 0,
    tags: tags.join(', '),
    status: st === DEFAULT_OBJECT_STATUS ? '' : objectStatusTitle(st),
    statusKind: statusKind(st)
  };
}
function listMechanismValues(m){
  var sides = mechanismSides(m), st = m.status || DEFAULT_MECH_STATUS;
  return {
    name: m.title,
    cat: categoryTitle(m.category),
    sources: sides.sources, targets: sides.targets,
    sourcesText: sides.sources.join(', '), targetsText: sides.targets.join(', '),
    status: st === DEFAULT_MECH_STATUS ? '' : mechanismStatusTitle(st),
    statusKind: statusKind(st)
  };
}

function listRoleValues(r){
  return { name:r.name, desc:r.description || '', procs:roleProcessCount(r.id) };
}

function listSortValue(v, key){
  if (key === 'sources') return v.sourcesText;
  if (key === 'targets') return v.targetsText;
  return v[key];
}
function listCompare(a, b, key, dir){
  var x = listSortValue(a.v, key), y = listSortValue(b.v, key);
  var r;
  if (typeof x === 'number') r = (x - y) * dir;
  else {
    if (!x && y) return 1;          /* пустые значения — в конце в обе стороны */
    if (x && !y) return -1;
    r = String(x).localeCompare(String(y), 'ru', {numeric:true}) * dir;
  }
  return r || a.v.name.localeCompare(b.v.name, 'ru');
}

function anyKey(sel){ return Object.keys(sel).length > 0; }
function matchesAny(sel, values){ return !anyKey(sel) || values.some(function(v){ return sel[v]; }); }

function listFilteredObjects(){
  var q = listSearch.objects.toLowerCase().trim(), f = listFilters.objects;
  return Object.keys(state.objects).map(function(id){ return state.objects[id]; })
    .filter(isShown)
    .filter(function(o){
      return !q || o.name.toLowerCase().indexOf(q)>=0 || (o.fullName||'').toLowerCase().indexOf(q)>=0 ||
        (o.tags||[]).join(' ').toLowerCase().indexOf(q)>=0 || (o.description||'').toLowerCase().indexOf(q)>=0;
    })
    .filter(function(o){ return !anyKey(f.type) || f.type[objectTypeKey(o)]; })
    .filter(function(o){ return matchesAny(f.sub, objectSubsystems(o)); })
    .filter(function(o){ return matchesAny(f.tag, o.tags || []); });
}
function listFilteredRoles(){
  var q = listSearch.roles.toLowerCase().trim();
  return Object.keys(state.roles).map(function(id){ return state.roles[id]; })
    .filter(function(r){ return !q || r.name.toLowerCase().indexOf(q) >= 0 || (r.description||'').toLowerCase().indexOf(q) >= 0; });
}
/* У механизма нет своих подсистем и тегов — отбор по ним идёт по объектам-участникам. */
function listFilteredMechanisms(){
  var q = listSearch.mechanisms.toLowerCase().trim(), f = listFilters.mechanisms;
  return Object.keys(state.mechanisms).map(function(id){ return state.mechanisms[id]; })
    .filter(isShown)
    .filter(function(m){
      return !q || m.title.toLowerCase().indexOf(q)>=0 || (m.summary||'').toLowerCase().indexOf(q)>=0 || (m.body||'').toLowerCase().indexOf(q)>=0;
    })
    .filter(function(m){ return !anyKey(f.cat) || f.cat[m.category]; })
    .filter(function(m){
      if (!anyKey(f.sub) && !anyKey(f.tag)) return true;
      var objs = mechanismParticipantObjects(m);
      var subs = [], tags = [];
      objs.forEach(function(o){ subs = subs.concat(objectSubsystems(o)); tags = tags.concat(o.tags || []); });
      return matchesAny(f.sub, subs) && matchesAny(f.tag, tags);
    });
}

/* Выпадающий множественный отбор (тот же вид, что у отбора типов в левой панели). */
function multiSelectHTML(id, label){
  return '<div class="multi-select" data-ms="' + id + '">' +
    '<button class="select-sm multi-select-btn" type="button" aria-haspopup="true" aria-expanded="false">' + escapeHtml(label) + '</button>' +
    '<div class="multi-select-dropdown" hidden></div></div>';
}
function fillMultiSelect(root, opts){
  var sel = opts.selected, dropdown = root.querySelector('.multi-select-dropdown'), btn = root.querySelector('.multi-select-btn');
  var scrollTop = dropdown.scrollTop;
  dropdown.innerHTML = (opts.items.length ? opts.items.map(function(it){
    return '<label class="multi-select-item"' + (it.color ? ' style="--c:' + it.color + '"' : '') + '>' +
      '<input type="checkbox" value="' + escapeHtml(it.code) + '"' + (sel[it.code] ? ' checked' : '') + '>' +
      (it.iconHTML || '') +
      '<span class="multi-select-item-text">' + escapeHtml(it.title) + '</span>' +
      (it.count != null ? '<span class="multi-select-item-count">' + it.count + '</span>' : '') +
    '</label>';
  }).join('') : '<div class="multi-select-item"><span class="multi-select-item-text">' + escapeHtml(opts.emptyText) + '</span></div>') +
    '<div class="multi-select-sep"></div>' +
    '<button type="button" class="multi-select-reset"' + (anyKey(sel) ? '' : ' disabled') + '>Сбросить отбор</button>';
  dropdown.scrollTop = scrollTop;
  dropdown.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change', function(){
      if (cb.checked) sel[cb.value] = true; else delete sel[cb.value];
      opts.onChange();
    });
  });
  dropdown.querySelector('.multi-select-reset').addEventListener('click', function(){
    Object.keys(sel).forEach(function(k){ delete sel[k]; }); opts.onChange();
  });
  var titles = opts.items.filter(function(it){ return sel[it.code]; }).map(function(it){ return it.title; });
  btn.textContent = !titles.length ? opts.allLabel : (titles.length === 1 ? titles[0] : opts.manyLabel + ': ' + titles.length);
  btn.title = titles.join(', ');
  btn.classList.toggle('has-value', titles.length > 0);
}
function bindMultiSelectToggle(ms){
  ms.querySelector('.multi-select-btn').addEventListener('click', function(){
    var dd = ms.querySelector('.multi-select-dropdown');
    var open = dd.hidden;
    closeListDropdowns(ms);
    dd.hidden = !open; this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
}
function closeListDropdowns(except){
  var any = false;
  document.querySelectorAll('.multi-select[data-ms]').forEach(function(ms){
    if (ms === except) return;
    var dd = ms.querySelector('.multi-select-dropdown');
    if (!dd.hidden) any = true;
    dd.hidden = true; ms.querySelector('.multi-select-btn').setAttribute('aria-expanded','false');
  });
  return any;
}

var sideTab = 'objects';
var sideSearch = { objects:'', mechanisms:'' };
var graphFilter = null; /* null — отбор не задан; иначе {nodes:Set, edge:function(e)} */

/* Отбор по подсистемам в левой панели (дерево и так сгруппировано по типу). Пусто — все. */
var sideSubFilter = {};

function renderSideSubFilter(){

  var subsOn = anyKey(sideSubFilter);
  var list = Object.keys(state.objects).map(function(id){return state.objects[id];})

        (o.tags||[]).join(' ').toLowerCase().indexOf(q)>=0;
    })
    .filter(function(o){ return matchesAny(sideSubFilter, objectSubsystems(o)); })
    .filter(function(o){ return !tagFilter || (o.tags||[]).indexOf(tagFilter)>=0; })

    .filter(isShown)
    .filter(function(m){ return !q || m.title.toLowerCase().indexOf(q)>=0; })
    .filter(function(m){ return !catFilter || m.category===catFilter; })
    .sort(function(a,b){ return a.title.localeCompare(b.title,'ru'); });
  return {list:list, active:!!(q || catFilter)};

function computeGraphFilter(objs, mechs){
  var nodes = new Set();
  if (sideTab === 'objects'){
    if (!objs.active) return null;
    objs.list.forEach(function(o){ nodes.add('obj:'+o.id); });
    /* Механизмы с отобранным участником (узлы-ромбы в полном режиме) — тоже яркие. */
    Object.keys(state.mechanisms).forEach(function(mid){
      if (state.mechanisms[mid].participants.some(function(p){ return nodes.has('obj:'+p.objectId); })) nodes.add('mech:'+mid);
    });
    return {nodes:nodes, edge:function(e){ return (nodes.has(e.a) && e.a.indexOf('obj:')===0) || (nodes.has(e.b) && e.b.indexOf('obj:')===0); }};
  }
  if (!mechs.active) return null;
  var mechIds = new Set();
  mechs.list.forEach(function(m){
    mechIds.add(m.id); nodes.add('mech:'+m.id);
    m.participants.forEach(function(p){ if (p.objectId && state.objects[p.objectId]) nodes.add('obj:'+p.objectId); });
  });
  return {nodes:nodes, edge:function(e){
    var hit = false; e.mechanismIds.forEach(function(id){ if (mechIds.has(id)) hit = true; }); return hit;
  }};
}

/* Участники с выбранным объектом; есть ли среди них источник и приёмник (по направлению роли). */
function mechanismParticipantInfo(m){
  var parts = m.participants.filter(function(p){ return p.objectId && state.objects[p.objectId]; });
  return {
    count: parts.length,
    hasSource: parts.some(function(p){ return roleInfo(p.role).direction === 'source'; }),
    hasTarget: parts.some(function(p){ return roleInfo(p.role).direction === 'target'; })
  };
}
function objectMechanismCounts(){
  var counts = {};
  Object.keys(state.mechanisms).forEach(function(mid){
    var seen = {};
    state.mechanisms[mid].participants.forEach(function(p){
      if (p.objectId && !seen[p.objectId]){ seen[p.objectId] = true; counts[p.objectId] = (counts[p.objectId]||0) + 1; }
    });
  });
  return counts;
}

/* Свёрнутые группы списка объектов — удобство интерфейса, хранится отдельно от данных. */
var SIDE_GROUPS_KEY = 'nodusSideGroupsCollapsed';

/* ===================== Подсистемы и теги =====================
   Подсистем у объекта может быть несколько: опциональное поле subsystems[]; старое поле
   subsystem (строка) сохраняется и равно первой подсистеме — старые данные читаются как [subsystem]. */
function normalizeLabel(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }
function objectSubsystems(o){
  if (Array.isArray(o.subsystems)) return o.subsystems.slice();
  return o.subsystem ? [normalizeLabel(o.subsystem)].filter(Boolean) : [];
}
function setObjectSubsystems(o, list){
  o.subsystems = list.slice();
  o.subsystem = list[0] || '';
}
function allSubsystems(){
  var seen = {}, out = [];
  Object.keys(state.objects).forEach(function(id){
    objectSubsystems(state.objects[id]).forEach(function(s){ var k = s.toLowerCase(); if (!seen[k]){ seen[k] = true; out.push(s); } });
  });
  return out.sort(function(a,b){ return a.localeCompare(b,'ru'); });
}
function allTags(){
  var seen = {}, out = [];
  Object.keys(state.objects).forEach(function(id){
    (state.objects[id].tags || []).forEach(function(t){ var k = t.toLowerCase(); if (!seen[k]){ seen[k] = true; out.push(t); } });
  });
  return out.sort(function(a,b){ return a.localeCompare(b,'ru'); });
}
/* Если значение уже есть (без учёта регистра) — берём существующее написание. */
function canonicalLabel(value, existing){
  var v = normalizeLabel(value), k = v.toLowerCase();
  for (var i = 0; i < existing.length; i++) if (existing[i].toLowerCase() === k) return existing[i];
  return v;
}

/* Редактор чипов с автодополнением.
   opt: {values(), suggestions(), onChange(list), freeCreate, placeholder, chipClass, createLabel}
   freeCreate — Enter или «,» превращают текст в чип (теги); иначе новое значение добавляется
   только явным пунктом «+ Создать „…“» (подсистемы). Backspace в пустом поле удаляет последний чип. */
function buildChipEditor(container, opt){
  var list = opt.values().slice();
  container.innerHTML = '<div class="chip-editor"><input type="text" class="chip-input" autocomplete="off"><div class="combo-dropdown" hidden></div></div>';
  var editor = container.querySelector('.chip-editor');
  var input = editor.querySelector('.chip-input');
  var dropdown = editor.querySelector('.combo-dropdown');
  input.placeholder = opt.placeholder || '';
  input.setAttribute('aria-label', opt.label || '');
  var items = [], active = -1;

  function has(v){ var k = v.toLowerCase(); return list.some(function(x){ return x.toLowerCase() === k; }); }
  function commit(){ opt.onChange(list.slice()); }
  function add(value){
    var v = canonicalLabel(value, opt.suggestions());
    if (!v || has(v)) return false;
    list.push(v); commit(); renderChips(); return true;
  }
  function renderChips(){
    editor.querySelectorAll('.chip-wrap').forEach(function(c){ c.remove(); });
    list.forEach(function(v, i){
      var chip = document.createElement('span');
      chip.className = 'chip-wrap ' + (opt.chipClass || 'tag-chip');
      chip.innerHTML = escapeHtml(v) + '<button type="button" class="chip-x" aria-label="Убрать «' + escapeHtml(v) + '»" tabindex="-1">×</button>';
      chip.querySelector('.chip-x').addEventListener('mousedown', function(e){ e.preventDefault(); });
      chip.querySelector('.chip-x').addEventListener('click', function(){ list.splice(i, 1); commit(); renderChips(); input.focus(); renderDropdown(); });
      editor.insertBefore(chip, input);
    });
  }
  function renderDropdown(){
    var q = normalizeLabel(input.value).toLowerCase();
    var sugg = opt.suggestions().filter(function(s){ return !has(s) && (!q || s.toLowerCase().indexOf(q) >= 0); }).slice(0, 8);
    items = sugg.map(function(s){ return {value:s}; });
    var exact = q && opt.suggestions().some(function(s){ return s.toLowerCase() === q; });
    if (q && !exact && !has(input.value)) items.push({value:normalizeLabel(input.value), create:true});
    active = items.length ? 0 : -1;
    if (!items.length){ dropdown.hidden = true; return; }
    dropdown.innerHTML = items.map(function(it, i){
      return '<div class="combo-item' + (it.create ? ' combo-item-create' : '') + (i === active ? ' is-active' : '') + '" data-i="' + i + '">' +
        (it.create ? '+ ' + (opt.createLabel || 'Создать') + ' „' + escapeHtml(it.value) + '“' : '<span class="combo-item-text">' + escapeHtml(it.value) + '</span>') + '</div>';
    }).join('');
    dropdown.hidden = false;
    dropdown.querySelectorAll('.combo-item').forEach(function(el){
      el.addEventListener('mousedown', function(e){ e.preventDefault(); pick(Number(el.getAttribute('data-i'))); });
    });
  }
  function highlight(){ dropdown.querySelectorAll('.combo-item').forEach(function(el, i){ el.classList.toggle('is-active', i === active); }); }
  function pick(i){ var it = items[i]; if (!it) return; add(it.value); input.value = ''; renderDropdown(); input.focus(); }

  input.addEventListener('input', function(){
    if (opt.freeCreate && input.value.indexOf(',') >= 0){
      var parts = input.value.split(','), rest = parts.pop();
      parts.forEach(function(p){ add(p); });
      input.value = rest;
    }
    renderDropdown();
  });
  input.addEventListener('focus', renderDropdown);
  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown' && items.length){ e.preventDefault(); active = (active + 1) % items.length; highlight(); }
    else if (e.key === 'ArrowUp' && items.length){ e.preventDefault(); active = (active - 1 + items.length) % items.length; highlight(); }
    else if (e.key === 'Enter'){
      e.preventDefault();
      /* Выделенная подсказка — всегда в приоритете (так «подбор персонала» выберет существующее). */
      if (active >= 0 && items[active]) pick(active);
      else if (opt.freeCreate && normalizeLabel(input.value)){ add(input.value); input.value = ''; renderDropdown(); }
    }
    else if (e.key === 'Backspace' && !input.value && list.length){ list.pop(); commit(); renderChips(); renderDropdown(); }
    else if (e.key === 'Escape' && !dropdown.hidden){ e.preventDefault(); e.stopPropagation(); dropdown.hidden = true; }
  });
  input.addEventListener('blur', function(){
    dropdown.hidden = true;
    if (opt.freeCreate && normalizeLabel(input.value)){ add(input.value); input.value = ''; }
  });
  editor.addEventListener('mousedown', function(e){ if (e.target === editor){ e.preventDefault(); input.focus(); } });
  renderChips();
  return {focus:function(){ input.focus(); }};
}

/* ===================== Глобальный поиск =====================
   Подстрока в названии объекта или механизма, без учёта регистра. Выбор результата
   на графе = клик по узлу (для механизма в режиме без механизмов — как клик по нему
   в списке слева); в режиме «Список» — карточка во всплывающем окне. */
var GLOBAL_SEARCH_LIMIT = 30;

function globalSearchMatches(query){
  var q = query.toLowerCase().trim();
  if (!q) return [];
  var res = [];
  Object.keys(state.objects).forEach(function(id){
    var o = state.objects[id];
    if (!isShown(o)) return;
    var i = o.name.toLowerCase().indexOf(q);
    if (i >= 0) res.push({kind:'obj', id:id, title:o.name, sub:typeTitle(o.type), color:typeColor(o.type), pos:i});
  });
  Object.keys(state.mechanisms).forEach(function(id){
    var m = state.mechanisms[id];
    if (!isShown(m)) return;
    var i = m.title.toLowerCase().indexOf(q);
    if (i >= 0) res.push({kind:'mech', id:id, title:m.title, sub:'Механизм · ' + categoryTitle(m.category), color:categoryAccent(m.category), pos:i});
  });
  /* Совпадение с начала названия — выше. */
  res.sort(function(a,b){ return (a.pos===0?0:1) - (b.pos===0?0:1) || a.title.localeCompare(b.title,'ru'); });
  return res.slice(0, GLOBAL_SEARCH_LIMIT);
}

function selectEntity(kind, id){
  if (kind === 'obj'){
    if (!state.objects[id]) return;
    pinnedNodeId = 'obj:'+id; pinnedMechanismId = null; pinnedEdgeKey = null;
    renderObjectPanel(state.objects[id]);
  } else if (kind === 'role'){
    /* Роль — не узел графа: карточка открывается, граф не центрируется. */
    if (!state.roles[id]) return;
    pinnedNodeId = null; pinnedMechanismId = null; pinnedEdgeKey = null;
    renderRolePanel(state.roles[id]); pinnedRoleId = id;
    syncSidebarActive(); requestRender();
    if (currentView === 'list') scrollActiveListRowIntoView();
    return;
  } else {
    if (!state.mechanisms[id]) return;
    pinnedMechanismId = id; pinnedNodeId = null; pinnedEdgeKey = null;
    renderMechanismPanel(state.mechanisms[id]);
  }
  syncSidebarActive(); requestRender();
  if (currentView === 'list') scrollActiveListRowIntoView();
  else centerOnEntity(kind, id);
}

function bindGlobalSearch(){
  var input = document.getElementById('global-search-input');
  var dropdown = document.getElementById('global-search-dropdown');
  var kbd = document.getElementById('global-search-kbd');
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');
  kbd.textContent = isMac ? '⌘K' : 'Ctrl+K';
  var results = [], active = 0;

  function setOpen(open){
    dropdown.hidden = !open;
    input.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function highlight(){
    dropdown.querySelectorAll('.gs-item').forEach(function(el, i){
      el.classList.toggle('active', i === active);
      if (i === active) el.scrollIntoView({block:'nearest'});
    });
  }
  function choose(i){
    var r = results[i];
    if (!r) return;
    setOpen(false);
    input.blur();
    selectEntity(r.kind, r.id);
  }
  function update(){
    results = globalSearchMatches(input.value);
    active = 0;
    if (!input.value.trim()){ setOpen(false); return; }
    dropdown.innerHTML = results.length ? results.map(function(r, i){
      return '<button type="button" class="gs-item" role="option" data-i="'+i+'">' +
        '<span class="dot' + (r.kind==='mech' ? ' dot-diamond' : '') + '" style="background:'+r.color+'"></span>' +
        '<span class="gs-item-main"><span class="gs-item-title">'+escapeHtml(r.title)+'</span><span class="gs-item-sub">'+escapeHtml(r.sub)+'</span></span>' +
      '</button>';
    }).join('') : '<p class="gs-empty">Ничего не найдено</p>';
    dropdown.querySelectorAll('.gs-item').forEach(function(el){
      /* mousedown, чтобы выбор сработал раньше, чем поле потеряет фокус */
      el.addEventListener('mousedown', function(e){ e.preventDefault(); choose(Number(el.getAttribute('data-i'))); });
      el.addEventListener('mousemove', function(){ var i = Number(el.getAttribute('data-i')); if (i !== active){ active = i; highlight(); } });
    });
    highlight();
    setOpen(true);
  }
  input.addEventListener('input', update);
  input.addEventListener('focus', function(){ if (input.value.trim()) update(); });
  input.addEventListener('blur', function(){ setOpen(false); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      e.stopPropagation();
      if (!dropdown.hidden) setOpen(false); else input.blur();
      return;
    }
    if (dropdown.hidden) return;
    if (e.key === 'ArrowDown'){ e.preventDefault(); if (results.length){ active = (active+1) % results.length; highlight(); } }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); if (results.length){ active = (active-1+results.length) % results.length; highlight(); } }
    else if (e.key === 'Enter'){ e.preventDefault(); choose(active); }
  });
}

function isTypingTarget(el){
  return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}
function moveListSelection(step){
  var rows = Array.prototype.slice.call(document.querySelectorAll('#list-view-body .list-view-row'));
  if (!rows.length) return;
  var i = rows.findIndex(function(r){ return r.classList.contains('active'); });
  var next = rows[i < 0 ? 0 : Math.max(0, Math.min(rows.length - 1, i + step))];
  selectEntity(LIST_ROW_ENTITY[next.getAttribute('data-kind')], next.getAttribute('data-id'));
}

function syncSidebarActive(){
  document.querySelectorAll('.list-row').forEach(function(btn){
    var isActive = (btn.getAttribute('data-kind')==='object' && pinnedNodeId==='obj:'+btn.getAttribute('data-id')) ||
                   (btn.getAttribute('data-kind')==='mechanism' && pinnedMechanismId===btn.getAttribute('data-id'));

    /* Выбранный объект в свёрнутой группе: раскрываем группу (без записи в сохранённое состояние). */
    var items = isActive && btn.closest('.side-group-items');

  });
  document.querySelectorAll('#list-view-body .list-view-row').forEach(function(row){
    var id = row.getAttribute('data-id');
    var on = (row.getAttribute('data-kind')==='object' && pinnedNodeId==='obj:'+id) ||
             (row.getAttribute('data-kind')==='mechanism' && pinnedMechanismId===id) ||
             (row.getAttribute('data-kind')==='role' && pinnedRoleId===id);

function loadPanelWidths(){
  try{
    var raw = localStorage.getItem(PANEL_WIDTHS_KEY);
    if (raw){
      var d = JSON.parse(raw);
      if (d.left) panelWidths.left = d.left;
      if (d.right) panelWidths.right = d.right;
    }
  }catch(e){}
}
function savePanelWidths(){
  try{ localStorage.setItem(PANEL_WIDTHS_KEY, JSON.stringify(panelWidths)); }catch(e){}
}
function applyPanelWidths(){
  document.getElementById('sidebar-left').style.width = panelWidths.left + 'px';
  document.getElementById('detail-panel').style.width = panelWidths.right + 'px';
}
function setupResizeHandle(handleId, side){
  var handle = document.getElementById(handleId);
  var dragging = false, startX = 0, startWidth = 0;
  handle.addEventListener('mousedown', function(ev){
    dragging = true; startX = ev.clientX;
    startWidth = side === 'left' ? panelWidths.left : panelWidths.right;
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    ev.preventDefault();
  });
  window.addEventListener('mousemove', function(ev){
    if (!dragging) return;
    var delta = ev.clientX - startX;
    if (side === 'left'){
      panelWidths.left = Math.max(200, Math.min(520, startWidth + delta));
    } else {
      panelWidths.right = Math.max(260, Math.min(560, startWidth - delta));
    }
    applyPanelWidths();
    if (currentView === 'graph') resizeCanvas();
  });
  window.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    savePanelWidths();
  });
}

/* ===================== Масштаб, вписывание, центрирование ===================== */
var SCALE_MIN = 0.05, SCALE_MAX = 3;
var VIEW_ANIM_MS = 220;          /* ≤ 250 мс */
var FIT_PADDING = 48;            /* отступ от краёв холста до узла с подписью при «вписать в экран» */
var FIT_MAX_SCALE = 1.5;
var CENTER_EDGE_MARGIN = 80;     /* ближе к краю — центрируем */
var ZOOM_STEP = 1.25;
var viewAnim = null;

function clampScale(s){ return Math.min(SCALE_MAX, Math.max(SCALE_MIN, s)); }

function cancelViewAnim(){ if (viewAnim){ cancelAnimationFrame(viewAnim); viewAnim = null; } }

function animateView(to){
  cancelViewAnim();
  var from = {scale:view.scale, offsetX:view.offsetX, offsetY:view.offsetY};
  var t0 = performance.now();
  function step(now){
    var t = Math.min(1, (now - t0)/VIEW_ANIM_MS);
    var k = 1 - Math.pow(1 - t, 3);
    view.scale = from.scale + (to.scale - from.scale)*k;
    view.offsetX = from.offsetX + (to.offsetX - from.offsetX)*k;
    view.offsetY = from.offsetY + (to.offsetY - from.offsetY)*k;
    requestRender();
    viewAnim = t < 1 ? requestAnimationFrame(step) : null;
  }
  viewAnim = requestAnimationFrame(step);
}

function zoomBy(factor){
  var cx = viewportWidth/2, cy = viewportHeight/2;
  var w = screenToWorld(cx, cy);
  var s = clampScale(view.scale*factor);
  animateView({scale:s, offsetX:cx - w.x*s, offsetY:cy - w.y*s});
}

/* Границы графа на экране при масштабе s (без сдвига): узлы плюс подписи, которые
   имеют постоянный экранный размер (у объекта — под кругом, у механизма — над ромбом). */
function screenExtents(s){
  ctx2d.font = THEME.labelFont;
  var e = {x0:Infinity, x1:-Infinity, y0:Infinity, y1:-Infinity};
  currentNodes.forEach(function(n){
    var r = nodeRadius(n)*s, cx = n.x*s, cy = n.y*s;
    var hw = Math.max(r, labelWidth(ctx2d, n)/2 + LABEL_PAD_X), lh = labelHeight(n) + LABEL_GAP;
    e.x0 = Math.min(e.x0, cx - hw); e.x1 = Math.max(e.x1, cx + hw);
    e.y0 = Math.min(e.y0, cy - r - (n.kind === 'mechanism' ? lh : 0));
    e.y1 = Math.max(e.y1, cy + r + (n.kind === 'mechanism' ? 0 : lh));
  });
  return e;
}
function fitView(){
  var W = viewportWidth - 2*FIT_PADDING, H = viewportHeight - 2*FIT_PADDING;
  function fits(s){ var e = screenExtents(s); return e.x1 - e.x0 <= W && e.y1 - e.y0 <= H; }
  /* Размер подписей не зависит от масштаба — подбираем масштаб двоичным поиском. */
  var lo = clampScale(0), hi = clampScale(FIT_MAX_SCALE);
  if (fits(hi)) lo = hi;
  else for (var i = 0; i < 30; i++){ var mid = (lo + hi)/2; if (fits(mid)) lo = mid; else hi = mid; }
  var e = screenExtents(lo);
  return {scale:lo, offsetX:viewportWidth/2 - (e.x0 + e.x1)/2, offsetY:viewportHeight/2 - (e.y0 + e.y1)/2};
}
function fitToScreen(){
  if (!currentNodes.length) return;
  animateView(fitView());
}
/* Начальная раскладка (и «Разложить заново»): когда физика успокоилась, граф
   вписывается, если выходит за отступы. */
var pendingInitialFit = true;
function maybeInitialFit(){
  if (!pendingInitialFit || focusMode || currentView !== 'graph' || !currentNodes.length || !viewportWidth) return;
  pendingInitialFit = false;
  var e = screenExtents(view.scale);
  var fitsNow = e.x0 + view.offsetX >= FIT_PADDING && e.x1 + view.offsetX <= viewportWidth - FIT_PADDING &&
                e.y0 + view.offsetY >= FIT_PADDING && e.y1 + view.offsetY <= viewportHeight - FIT_PADDING;
  if (fitsNow) return;
  animateView(fitView());
}

/* Точка сущности на холсте: узел объекта/механизма; механизм без узла (режим без
   механизмов) — центр его участников. */
function entityWorldPoint(kind, id){
  var node = nodeById.get((kind==='obj' ? 'obj:' : 'mech:') + id);
  if (node && currentNodes.indexOf(node) >= 0) return {x:node.x, y:node.y};
  if (kind !== 'mech') return null;
  var pts = (mechIndex.parts.get(id) || []).map(function(o){ return nodeById.get('obj:'+o); }).filter(Boolean);
  if (!pts.length) return null;
  return {x:pts.reduce(function(s,n){return s+n.x;},0)/pts.length, y:pts.reduce(function(s,n){return s+n.y;},0)/pts.length};
}

function centerOnEntity(kind, id){
  if (currentView !== 'graph') return;
  var p = entityWorldPoint(kind, id);
  if (!p) return;
  var sx = p.x*view.scale + view.offsetX, sy = p.y*view.scale + view.offsetY;
  var m = CENTER_EDGE_MARGIN;
  if (sx >= m && sx <= viewportWidth - m && sy >= m && sy <= viewportHeight - m) return;
  animateView({scale:view.scale, offsetX:viewportWidth/2 - p.x*view.scale, offsetY:viewportHeight/2 - p.y*view.scale});
}

/* ===================== Фокус-режим механизма =====================
   Временная раскладка одного механизма как потока: источники — колонкой слева,
   механизм — в центре, приёмники — справа, участники без направления — под механизмом.
   Остальные узлы приглушены, физика на время режима остановлена. Ничего не пишется
   в данные: позиции узлов до входа запоминаются и точно восстанавливаются при выходе. */
var FOCUS_COL_DX = 300, FOCUS_ROW_DY = 100, FOCUS_NEUTRAL_DY = 160, FOCUS_NEUTRAL_DX = 200;
/* Поля при вписывании фокуса: сверху — плашка «Фокус», по бокам — подписи узлов,
   снизу — легенда (если развёрнута). */
var FOCUS_FIT_PAD = { top:70, side:160, bottom:90 };
var EDGE_LABEL_MAX = 32;
var focusMode = null;   /* {mechId, prevMode, saved:Map, prevView, exiting} */
var edgeLabelBoxes = [];

function focusColumns(mid){
  var m = state.mechanisms[mid], cols = {source:[], target:[], neutral:[]}, seen = {};
  if (!m) return cols;
  m.participants.forEach(function(p){
    if (!p.objectId || !state.objects[p.objectId] || seen[p.objectId]) return;
    seen[p.objectId] = true;
    cols[roleInfo(p.role).direction].push('obj:'+p.objectId);
  });
  return cols;
}

function focusTargets(mid){
  var center = nodeById.get('mech:'+mid);
  var targets = new Map();
  if (!center) return targets;
  var cx = center.x, cy = center.y;
  targets.set(center.id, {x:cx, y:cy});
  var cols = focusColumns(mid);
  function column(ids, x){ ids.forEach(function(id, i){ targets.set(id, {x:x, y:cy + (i - (ids.length-1)/2)*FOCUS_ROW_DY}); }); }
  column(cols.source, cx - FOCUS_COL_DX);
  column(cols.target, cx + FOCUS_COL_DX);
  var sideRows = Math.max(cols.source.length, cols.target.length);
  var ny = cy + Math.max(FOCUS_NEUTRAL_DY, (sideRows-1)/2*FOCUS_ROW_DY + FOCUS_ROW_DY);
  cols.neutral.forEach(function(id, i){ targets.set(id, {x:cx + (i - (cols.neutral.length-1)/2)*FOCUS_NEUTRAL_DX, y:ny}); });
  return targets;
}

function animateNodePositions(targets, done){
  var from = new Map();
  targets.forEach(function(t, id){ var n = nodeById.get(id); if (n) from.set(id, {x:n.x, y:n.y}); });
  var t0 = performance.now();
  function step(now){
    var t = Math.min(1, (now - t0)/VIEW_ANIM_MS), k = 1 - Math.pow(1 - t, 3);
    from.forEach(function(f, id){
      var n = nodeById.get(id), to = targets.get(id);
      if (!n) return;
      n.x = f.x + (to.x - f.x)*k; n.y = f.y + (to.y - f.y)*k;
    });
    requestRender();
    if (t < 1) requestAnimationFrame(step); else if (done) done();
  }
  requestAnimationFrame(step);
}

function viewToFit(points, pad){
  var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  points.forEach(function(p){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
  var bw = Math.max(1, maxX-minX), bh = Math.max(1, maxY-minY);
  var availW = viewportWidth - pad.left - pad.right, availH = viewportHeight - pad.top - pad.bottom;
  var s = clampScale(Math.min(availW/bw, availH/bh, FIT_MAX_SCALE));
  return {scale:s, offsetX:pad.left + availW/2 - (minX+bw/2)*s, offsetY:pad.top + availH/2 - (minY+bh/2)*s};
}
function focusFitPadding(){
  var legend = document.getElementById('graph-legend');
  var body = document.getElementById('legend-body');
  var legendH = (!legend.hidden && !body.hidden) ? legend.offsetHeight + 50 : 0;
  return { top:FOCUS_FIT_PAD.top, left:FOCUS_FIT_PAD.side, right:FOCUS_FIT_PAD.side, bottom:Math.max(FOCUS_FIT_PAD.bottom, legendH) };
}

function enterFocus(mid){
  if (!state.mechanisms[mid] || currentView !== 'graph') return;
  if (focusMode){
    if (focusMode.mechId === mid){ exitFocus(); return; }
    exitFocus(true);
  }
  var prevMode = currentMode;
  var prevSimAlpha = sim.alpha;
  var prevView = {scale:view.scale, offsetX:view.offsetX, offsetY:view.offsetY};
  if (currentMode !== 'full'){
    currentMode = 'full';
    syncMechModeUI();
    syncGraphModel();
    /* Узел механизма только что появился в случайном месте — ставим его в центр участников. */
    var mn = nodeById.get('mech:'+mid), pts = focusColumns(mid);
    var all = pts.source.concat(pts.target, pts.neutral).map(function(id){ return nodeById.get(id); }).filter(Boolean);
    if (mn && all.length){
      mn.x = all.reduce(function(s,n){return s+n.x;},0)/all.length;
      mn.y = all.reduce(function(s,n){return s+n.y;},0)/all.length;
    }
  }
  var saved = new Map();
  nodeById.forEach(function(n, id){ saved.set(id, {x:n.x, y:n.y, vx:n.vx, vy:n.vy}); });
  focusMode = {mechId:mid, prevMode:prevMode, prevSimAlpha:prevSimAlpha, saved:saved, prevView:prevView, exiting:false};
  pinnedMechanismId = mid; pinnedNodeId = null; pinnedEdgeKey = null;
  renderMechanismPanel(state.mechanisms[mid]);
  syncSidebarActive();
  var targets = focusTargets(mid);
  animateNodePositions(targets);
  var pts2 = []; targets.forEach(function(t){ pts2.push(t); });
  animateView(viewToFit(pts2, focusFitPadding()));
  updateFocusUI();
}

/* Правки механизма во время фокуса (добавили/убрали участника) — перераскладка без анимации. */
function refreshFocusLayout(){
  if (!state.mechanisms[focusMode.mechId]){ exitFocus(true); return; }
  nodeById.forEach(function(n, id){ if (!focusMode.saved.has(id)) focusMode.saved.set(id, {x:n.x, y:n.y, vx:n.vx, vy:n.vy}); });
  focusTargets(focusMode.mechId).forEach(function(t, id){ var n = nodeById.get(id); if (n){ n.x = t.x; n.y = t.y; } });
  updateFocusUI();
}

function exitFocus(immediate){
  if (!focusMode || focusMode.exiting) return;
  var fm = focusMode;
  fm.exiting = true;
  function finish(){
    fm.saved.forEach(function(s, id){ var n = nodeById.get(id); if (n){ n.x = s.x; n.y = s.y; n.vx = s.vx; n.vy = s.vy; } });
    focusMode = null;
    hideCanvasTooltip();
    if (fm.prevMode !== currentMode){
      currentMode = fm.prevMode;
      syncMechModeUI();
      syncGraphModel();
    }
    /* Перестройка графа «подогревает» физику — возвращаем её состояние до входа,
       чтобы узлы остались ровно там, где были. */
    sim.alpha = fm.prevSimAlpha;
    updateFocusUI();
    requestRender();
  }
  if (immediate){ cancelViewAnim(); view.scale = fm.prevView.scale; view.offsetX = fm.prevView.offsetX; view.offsetY = fm.prevView.offsetY; finish(); return; }
  var back = new Map();
  fm.saved.forEach(function(s, id){ back.set(id, {x:s.x, y:s.y}); });
  animateNodePositions(back, finish);
  animateView(fm.prevView);
}

function updateFocusUI(){
  var banner = document.getElementById('focus-banner');
  var m = focusMode && state.mechanisms[focusMode.mechId];
  banner.hidden = !m;
  if (m) document.getElementById('focus-banner-title').innerHTML = 'Фокус: <b>' + escapeHtml(m.title) + '</b>';
  document.querySelectorAll('.card-focus-btn').forEach(function(b){
    var on = !!focusMode && b.getAttribute('data-mech') === focusMode.mechId;
    b.textContent = on ? 'Выйти из фокуса' : 'Фокус';
  });
}

/* Подписи рёбер в фокусе: описание передачи участника (или название роли, если описания нет),
   до EDGE_LABEL_MAX символов; полный текст — во всплывающей подсказке. Подписи не должны
   пересекаться ни друг с другом, ни с подписями узлов: при пересечении сдвигаются вдоль ребра. */
function drawFocusEdgeLabels(ctx, nodeLabels){
  var m = state.mechanisms[focusMode.mechId], mn = nodeById.get('mech:'+focusMode.mechId);
  if (!m || !mn) return [];
  var byObj = new Map();
  m.participants.forEach(function(p){
    if (!p.objectId || !state.objects[p.objectId]) return;
    var e = byObj.get(p.objectId) || byObj.set(p.objectId, {notes:[], role:p.role}).get(p.objectId);
    if (p.note) e.notes.push(p.note);
  });
  ctx.font = THEME.labelFont;
  var taken = nodeLabels.map(function(b){ return b; }), out = [];
  /* Площадь пересечения с уже занятыми местами (0 — место свободно). */
  function overlapArea(b){
    return taken.reduce(function(sum, o){
      var w = Math.min(b.x1, o.x1) - Math.max(b.x0, o.x0), hh = Math.min(b.y1, o.y1) - Math.max(b.y0, o.y0);
      return sum + (w > 0 && hh > 0 ? w*hh : 0);
    }, 0);
  }
  var EDGE_LABEL_T = [0.5, 0.4, 0.6, 0.3, 0.7, 0.2, 0.8];
  var EDGE_LABEL_SHIFT = [0, -(LABEL_H+2), LABEL_H+2, -2*(LABEL_H+2), 2*(LABEL_H+2)];
  var msx = mn.x*view.scale + view.offsetX, msy = mn.y*view.scale + view.offsetY;
  byObj.forEach(function(info, oid){
    var n = nodeById.get('obj:'+oid);
    if (!n) return;
    var full = info.notes.length ? info.notes.join('; ') : roleInfo(info.role).title;
    var text = full.length > EDGE_LABEL_MAX ? full.slice(0, EDGE_LABEL_MAX - 1) + '…' : full;
    var w = ctx.measureText(text).width + 2*LABEL_PAD_X;
    var psx = n.x*view.scale + view.offsetX, psy = n.y*view.scale + view.offsetY;
    /* Сначала места вдоль ребра, затем — со сдвигом вверх/вниз; если свободных нет,
       берём место с наименьшим наложением. */
    var box = null, bestArea = Infinity;
    outer: for (var si = 0; si < EDGE_LABEL_SHIFT.length; si++){
      for (var i = 0; i < EDGE_LABEL_T.length; i++){
        var cx = psx + (msx - psx)*EDGE_LABEL_T[i], cy = psy + (msy - psy)*EDGE_LABEL_T[i] + EDGE_LABEL_SHIFT[si];
        var b = {x0:cx - w/2, x1:cx + w/2, y0:cy - LABEL_H/2, y1:cy + LABEL_H/2, cx:cx, cy:cy};
        var area = overlapArea(b);
        if (area < bestArea){ bestArea = area; box = b; }
        if (area === 0) break outer;
      }
    }
    box.text = text; box.full = full; box.isRole = !info.notes.length;
    taken.push(box); out.push(box);
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  out.forEach(function(b){
    ctx.globalAlpha = THEME.alpha.labelPlate; ctx.fillStyle = THEME.bg;
    ctx.beginPath(); roundRectPath(ctx, b.x0, b.y0, b.x1-b.x0, b.y1-b.y0, 3); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = b.isRole ? THEME.textFaint : THEME.textMuted;
    ctx.fillText(b.text, b.cx, b.cy + 0.5);
  });
  ctx.textBaseline = 'alphabetic';
  return out;
}

function hideCanvasTooltip(){ var t = document.getElementById('canvas-tooltip'); if (t) t.hidden = true; }
function showCanvasTooltipAt(tip, sx, sy){
  tip.hidden = false;
  var w = tip.offsetWidth, hgt = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(sx + 12, viewportWidth - w - 8)) + 'px';
  tip.style.top = (sy + 14 + hgt > viewportHeight - 4 ? Math.max(4, sy - hgt - 10) : sy + 14) + 'px';
}
/* Ребро в режиме «связями»: все механизмы между двумя объектами — название (ромб в цвете
   категории), направление «Источник → Приёмник» и описания участия. */
function edgeTooltipHTML(e){
  var a = state.objects[e.a.slice(4)], b = state.objects[e.b.slice(4)];
  if (!a || !b) return '';
  var ids = Array.from(e.mechanismIds).filter(function(id){ return state.mechanisms[id]; })
    .sort(function(x, y){ return state.mechanisms[x].title.localeCompare(state.mechanisms[y].title, 'ru'); });
  return ids.map(function(mid){
    var m = state.mechanisms[mid];
    function parts(o){ return m.participants.filter(function(p){ return p.objectId === o.id; }); }
    function dir(o, d){ return parts(o).some(function(p){ return roleInfo(p.role).direction === d; }); }
    var arrow;
    if (dir(a,'source') && dir(b,'target')) arrow = escapeHtml(a.name) + ' → ' + escapeHtml(b.name);
    else if (dir(b,'source') && dir(a,'target')) arrow = escapeHtml(b.name) + ' → ' + escapeHtml(a.name);
    else arrow = escapeHtml(a.name) + ' — ' + escapeHtml(b.name);
    var notes = [a, b].map(function(o){
      var n = parts(o).map(function(p){ return p.note; }).filter(Boolean);
      return n.length ? '<div class="ctip-note"><b>' + escapeHtml(o.name) + ':</b> ' + escapeHtml(n.join('; ')) + '</div>' : '';
    }).join('');
    return '<div class="ctip-mech"><div class="ctip-title"><span class="om-diamond" style="--c:' + categoryAccent(m.category) + '"></span>' + escapeHtml(m.title) + '</div>' +
      '<div class="ctip-dir">' + arrow + '</div>' + notes + '</div>';
  }).join('');
}
var graphTipKey = null;
function updateGraphTooltip(sx, sy, node, wp){
  var tip = document.getElementById('canvas-tooltip');
  if (dragNode || isPanning){ tip.hidden = true; graphTipKey = null; return; }
  var key = null, html = '';
  if (node){
    labelInfo(ctx2d, node);
    if (node._labelTruncated){ key = 'n:' + node.id; html = escapeHtml(node.label); }
  } else if (currentMode === 'collapsed'){
    var edge = hitTestEdge(wp.x, wp.y);
    if (edge){ key = 'e:' + edge.key; html = edgeTooltipHTML(edge); }
  }
  if (!key){
    /* Обрезанная подпись под курсором (сама плашка, не круг). */
    var lb = (lastLabels || []).filter(function(b){ return b.n._labelTruncated && sx >= b.x0 && sx <= b.x1 && sy >= b.y0 && sy <= b.y1; })[0];
    if (lb){ key = 'n:' + lb.n.id; html = escapeHtml(lb.n.label); }
  }
  if (!key || !html){ tip.hidden = true; graphTipKey = null; return; }
  if (key !== graphTipKey){ tip.innerHTML = html; graphTipKey = key; }
  showCanvasTooltipAt(tip, sx, sy);
}
function updateCanvasTooltip(sx, sy){
  var tip = document.getElementById('canvas-tooltip');
  var b = edgeLabelBoxes.filter(function(b){ return b.full !== b.text && sx >= b.x0 && sx <= b.x1 && sy >= b.y0 && sy <= b.y1; })[0];
  if (!b){ tip.hidden = true; return; }
  tip.textContent = b.full; graphTipKey = null;
  tip.style.left = Math.min(sx + 12, viewportWidth - 330) + 'px';
  tip.style.top = (sy + 14) + 'px';
  tip.hidden = false;
}

/* ===================== Мини-карта =====================
   Весь граф схематично + рамка видимой области; клик и перетаскивание переносят холст.
   По умолчанию свёрнута, если узлов меньше MINIMAP_AUTO_MIN_NODES (пока пользователь сам
   её не открыл или не свернул). */
var MINIMAP_AUTO_MIN_NODES = 30;
var MINIMAP_W = 180, MINIMAP_H = 120, MINIMAP_PAD = 8;
var minimapUserSet = false, minimapOpen = false, minimapXf = null;

function updateMinimapVisibility(){
  if (!minimapUserSet) minimapOpen = currentNodes.length >= MINIMAP_AUTO_MIN_NODES;
  var c = document.getElementById('minimap-canvas');
  if (!c) return;
  c.hidden = !minimapOpen;
  document.getElementById('minimap-toggle').setAttribute('aria-expanded', minimapOpen ? 'true' : 'false');
}

function drawMinimap(){
  var c = document.getElementById('minimap-canvas');
  if (!c || !minimapOpen || currentView !== 'graph') return;
  var dpr = window.devicePixelRatio || 1;
  if (c.width !== MINIMAP_W*dpr){ c.width = MINIMAP_W*dpr; c.height = MINIMAP_H*dpr; }
  var mc = c.getContext('2d');
  mc.setTransform(dpr,0,0,dpr,0,0);
  mc.clearRect(0,0,MINIMAP_W,MINIMAP_H);
  if (!currentNodes.length){ minimapXf = null; return; }
  var tl = screenToWorld(0,0), br = screenToWorld(viewportWidth, viewportHeight);
  var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  currentNodes.forEach(function(n){ minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x); minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); });
  var bw = Math.max(1, maxX-minX), bh = Math.max(1, maxY-minY);
  var s = Math.min((MINIMAP_W - 2*MINIMAP_PAD)/bw, (MINIMAP_H - 2*MINIMAP_PAD)/bh);
  var ox = (MINIMAP_W - bw*s)/2 - minX*s, oy = (MINIMAP_H - bh*s)/2 - minY*s;
  minimapXf = {s:s, ox:ox, oy:oy};
  currentNodes.forEach(function(n){
    mc.fillStyle = n.kind === 'mechanism' ? categoryAccent(n.category) : typeColor(n.type);
    var r = n.kind === 'mechanism' ? 1.5 : 2;
    mc.fillRect(n.x*s + ox - r, n.y*s + oy - r, 2*r, 2*r);
  });
  /* Рамка видимой области; если она больше графа — обрезается краем мини-карты. */
  var rx0 = Math.max(1, tl.x*s + ox), ry0 = Math.max(1, tl.y*s + oy);
  var rx1 = Math.min(MINIMAP_W - 1, br.x*s + ox), ry1 = Math.min(MINIMAP_H - 1, br.y*s + oy);
  mc.strokeStyle = THEME.textMuted; mc.lineWidth = 1;
  if (rx1 > rx0 && ry1 > ry0) mc.strokeRect(rx0 + 0.5, ry0 + 0.5, rx1 - rx0 - 1, ry1 - ry0 - 1);
}

function bindMinimap(){
  var c = document.getElementById('minimap-canvas');
  document.getElementById('minimap-toggle').addEventListener('click', function(){
    minimapUserSet = true; minimapOpen = !minimapOpen;
    updateMinimapVisibility(); requestRender();
  });
  var dragging = false;
  function moveTo(ev){
    if (!minimapXf) return;
    var r = c.getBoundingClientRect();
    var wx = (ev.clientX - r.left - minimapXf.ox)/minimapXf.s, wy = (ev.clientY - r.top - minimapXf.oy)/minimapXf.s;
    cancelViewAnim();
    view.offsetX = viewportWidth/2 - wx*view.scale;
    view.offsetY = viewportHeight/2 - wy*view.scale;
    requestRender();
  }
  c.addEventListener('mousedown', function(ev){ dragging = true; moveTo(ev); ev.preventDefault(); });
  window.addEventListener('mousemove', function(ev){ if (dragging) moveTo(ev); });
  window.addEventListener('mouseup', function(){ dragging = false; });
}

function updateLegend(){

      ? [['solid', 'Объект передаёт данные в механизм'], ['dashed', 'Механизм передаёт данные в объект'], ['dotted', 'Участие без направления (параметр, условие)']]
      : [['solid', 'Передача данных: от источника к приёмнику'], ['dotted', 'Связь без направления (параметр, условие)']];
    html += '<p class="legend-group-title">Связи</p>' + lines.map(function(l){

        (dash ? ' stroke-dasharray="' + dash + '"' : '') + (l[0] === 'dotted' ? ' stroke-linecap="round"' : '') + '/></svg>' + escapeHtml(l[1]) + '</div>';
    }).join('');
  }
  document.getElementById('legend-body').innerHTML = html;

/* ===================== Роли (исполнители шагов процессов) =====================

var pinnedRoleId = null;

function roleNameError(name, exceptId){

}
/* «Новая роль», «Новая роль 2», … — первое свободное название. */
function uniqueRoleName(base){

/* ===================== Реквизиты объектов =====================
   Коллекция state.attributes: {id, objectId, name, synonym, valueType, tabularSection, description}.
   name — имя в конфигураторе (ключ для будущего импорта из XML-выгрузки); tabularSection —
   имя табличной части, пусто — реквизит шапки. Порядок реквизитов — порядок создания. */

var ATTR_HEADER_TITLE = 'Шапка';

function objectAttributes(objId){
  return Object.keys(state.attributes).map(function(id){ return state.attributes[id]; })
    .filter(function(a){ return a.objectId === objId; });
}
function objectAttributeCounts(){
  var counts = {};
  Object.keys(state.attributes).forEach(function(id){ var o = state.attributes[id].objectId; counts[o] = (counts[o] || 0) + 1; });
  return counts;
}
/* Табличные части объекта — по алфавиту, без учёта регистра. */
function objectTabularSections(objId){
  var seen = {}, out = [];
  objectAttributes(objId).forEach(function(a){
    var ts = a.tabularSection || ''; if (!ts) return;
    var k = ts.toLowerCase(); if (!seen[k]){ seen[k] = true; out.push(ts); }
  });
  return out.sort(function(a,b){ return a.localeCompare(b,'ru'); });
}
/* Полное имя для отображения: «ЗаявкаНаПодборПерсонала.Подразделение» или
   «ЗаявкаНаПодборПерсонала.Кандидаты.ФИО». Без имени в конфигураторе — синоним объекта. */
function attributeFullName(a){
  var o = state.objects[a.objectId];
  var owner = o ? (objectIdentifier(o) || o.name) : '?';
  return owner + '.' + (a.tabularSection ? a.tabularSection + '.' : '') + a.name;
}

/* Имя реквизита: обязательно, правила идентификатора 1С, уникально в пределах объекта и
   табличной части без учёта регистра. Возвращает текст ошибки или ''. */
function attributeNameError(name, objId, ts, exceptId){
  if (!name) return 'Укажите имя реквизита.';
  if (!validIdentifier(name)) return 'Имя — без пробелов и точек и не начинается с цифры.';
  var k = name.toLowerCase(), tk = (ts || '').toLowerCase();
  var dup = objectAttributes(objId).some(function(a){
    return a.id !== exceptId && (a.tabularSection || '').toLowerCase() === tk && a.name.toLowerCase() === k;
  });
  return dup ? 'Реквизит «' + name + '» уже есть ' + (ts ? 'в табличной части «' + ts + '»' : 'в шапке') + '.' : '';
}
function tabularSectionError(ts){
  return validIdentifier(ts) ? '' : 'Табличная часть — без пробелов и точек и не начинается с цифры.';
}

function createAttribute(partial){
  var id = uid('attr');
  var a = {
    id:id, objectId:partial.objectId, name:partial.name,
    synonym:partial.synonym || '', valueType:partial.valueType || '',
    tabularSection:partial.tabularSection || '', description:''
  };
  state.attributes[id] = a;
  persist();
  return a;
}
function attributesChanged(obj, panel){
  persist();
  renderAttributesBlock(obj, panel);
  if (currentView === 'list') renderListView();
}

/* ----- Блок «Реквизиты · N» в карточке объекта ----- */

function attributesSectionHTML(){

/* Свёрнутые группы (табличные части) — на время сессии; ключ «объект|табличная часть». */
var attrGroupCollapsed = {};

function renderAttributesBlock(obj, panel){
  var container = panel.querySelector('#obj-attrs-list');
  if (!container) return;
  var attrs = objectAttributes(obj.id);
  panel.querySelector('#obj-attrs-title').textContent = 'Реквизиты · ' + attrs.length;
  if (!attrs.length){ container.innerHTML = '<p class="ref-empty">Реквизитов пока нет.</p>'; return; }

  var byTs = {}, tsOrder = [];
  attrs.forEach(function(a){
    var ts = a.tabularSection || '';
    var k = ts.toLowerCase();
    if (!byTs[k]){ byTs[k] = {ts:ts, list:[]}; tsOrder.push(k); }
    byTs[k].list.push(a);
  });
  tsOrder.sort(function(a, b){ return (a === '' ? -1 : b === '' ? 1 : byTs[a].ts.localeCompare(byTs[b].ts, 'ru')); });

  container.innerHTML = '<div class="attr-table">' +
    '<div class="attr-head"><span>Имя</span><span>Синоним</span><span>Тип</span><span></span></div>' +
    tsOrder.map(function(k){
      var g = byTs[k], ck = obj.id + '|' + k, collapsed = !!attrGroupCollapsed[ck];
      return '<div class="attr-group">' +
        '<button type="button" class="attr-group-toggle" data-ck="' + escapeHtml(ck) + '" aria-expanded="' + !collapsed + '">' +
          '<span class="attr-group-chevron" aria-hidden="true"></span>' +
          '<span class="attr-group-title">' + (g.ts ? escapeHtml(g.ts) : ATTR_HEADER_TITLE) + '</span>' +
          '<span class="attr-group-count">' + g.list.length + '</span>' +
        '</button>' +
        '<div class="attr-rows"' + (collapsed ? ' hidden' : '') + '>' +
          g.list.map(function(a){
            return '<div class="attr-row" data-id="' + a.id + '">' +
              '<span class="attr-cell is-name" data-field="name" tabindex="0" title="' + escapeHtml(attributeFullName(a)) + '">' + escapeHtml(a.name) + '</span>' +
              '<span class="attr-cell' + (a.synonym ? '' : ' is-empty') + '" data-field="synonym" tabindex="0" title="' + escapeHtml(a.synonym || 'Синоним') + '">' + escapeHtml(a.synonym || '—') + '</span>' +
              '<span class="attr-cell' + (a.valueType ? '' : ' is-empty') + '" data-field="valueType" tabindex="0" title="' + escapeHtml(a.valueType || 'Тип значения') + '">' + escapeHtml(a.valueType || '—') + '</span>' +
              '<button type="button" class="card-menu-btn attr-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Действия с реквизитом" title="Действия">⋯</button>' +
            '</div>' +
            '<p class="field-error attr-row-error" hidden></p>';
          }).join('') +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';

  container.querySelectorAll('.attr-group-toggle').forEach(function(t){
    t.addEventListener('click', function(){
      var open = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      t.nextElementSibling.hidden = !open;
      attrGroupCollapsed[t.getAttribute('data-ck')] = !open;
    });
  });
  container.querySelectorAll('.attr-row').forEach(function(row){
    var a = state.attributes[row.getAttribute('data-id')];
    row.querySelectorAll('.attr-cell').forEach(function(cell){
      cell.addEventListener('click', function(){ editAttributeCell(obj, panel, a, cell); });
      cell.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); editAttributeCell(obj, panel, a, cell); } });
    });
    var menuBtn = row.querySelector('.attr-menu-btn');
    menuBtn.addEventListener('click', function(){
      openPopoverMenu(menuBtn, [{value:'delete', label:'Удалить реквизит', danger:true}], function(){
        delete state.attributes[a.id];
        attributesChanged(obj, panel);
      });
    });
  });
}

/* Правка ячейки по клику: Enter / уход фокуса — сохранить, Esc — отменить. Некорректное
   имя не сохраняется: по Enter ошибка видна под строкой, по уходу фокуса — возвращается прежнее. */
function editAttributeCell(obj, panel, a, cell){
  var field = cell.getAttribute('data-field');
  var err = cell.parentNode.nextElementSibling;
  var input = document.createElement('input');
  input.type = 'text'; input.className = 'field-input attr-cell-input' + (field === 'name' ? ' is-name' : '');
  input.value = a[field] || '';
  input.setAttribute('aria-label', {name:'Имя', synonym:'Синоним', valueType:'Тип значения'}[field]);
  cell.replaceWith(input);
  input.focus(); input.select();
  var done = false;
  function finish(save, onBlur){
    if (done) return true;
    var v = normalizeLabel(input.value);
    if (save && field === 'name'){
      var e = attributeNameError(v, a.objectId, a.tabularSection, a.id);
      if (e && !onBlur){ err.textContent = e; err.hidden = false; return false; }
      if (e){ done = true; renderAttributesBlock(obj, panel); showRowError(panel, a.id, e + ' Значение не сохранено.'); return true; }
    }
    done = true;
    if (save && v !== (a[field] || '')){ a[field] = v; attributesChanged(obj, panel); }
    else renderAttributesBlock(obj, panel);
    return true;
  }
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ e.preventDefault(); if (finish(true)) focusAttrCell(panel, a.id, field); }
    else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); focusAttrCell(panel, a.id, field); }
  });
  input.addEventListener('input', function(){ err.hidden = true; });
  input.addEventListener('blur', function(){ finish(true, true); });
}
function focusAttrCell(panel, id, field){
  var c = panel.querySelector('.attr-row[data-id="' + id + '"] .attr-cell[data-field="' + field + '"]');
  if (c) c.focus();
}
function showRowError(panel, id, text){
  var row = panel.querySelector('.attr-row[data-id="' + id + '"]');
  if (!row) return;
  var err = row.nextElementSibling; err.textContent = text; err.hidden = false;
}

/* «+ Добавить»: строка ввода внизу блока. Tab — по полям, Enter — сохранить и открыть
   следующую пустую строку (табличная часть сохраняется), Esc — закрыть. */
function bindAddAttribute(panel, obj){
  var btn = panel.querySelector('#btn-add-attr'), host = panel.querySelector('#obj-attr-add');
  btn.addEventListener('click', function(){
    if (host.firstChild){ host.innerHTML = ''; return; }
    host.innerHTML = '<div class="om-add attr-add">' +
      '<div class="attr-add-grid">' +
        '<div><input type="text" class="field-input attr-add-name" placeholder="Имя *" aria-label="Имя реквизита" autocomplete="off"><p class="field-error attr-add-name-err" hidden></p></div>' +
        '<div><input type="text" class="field-input attr-add-syn" placeholder="Синоним" aria-label="Синоним" autocomplete="off"></div>' +
        '<div><input type="text" class="field-input attr-add-type" placeholder="Тип значения" aria-label="Тип значения" autocomplete="off"></div>' +
        '<div><div class="attr-add-ts"></div><p class="field-error attr-add-ts-err" hidden></p></div>' +
      '</div>' +
      '<p class="attr-add-hint">Enter — сохранить и ввести следующий · Esc — закрыть</p>' +
    '</div>';
    var nameIn = host.querySelector('.attr-add-name'), synIn = host.querySelector('.attr-add-syn'), typeIn = host.querySelector('.attr-add-type');
    var nameErr = host.querySelector('.attr-add-name-err'), tsErr = host.querySelector('.attr-add-ts-err');
    var tsIn = buildCombobox(host.querySelector('.attr-add-ts'), {
      placeholder:'Табличная часть: ' + ATTR_HEADER_TITLE, ariaLabel:'Табличная часть (пусто — шапка)',
      source:function(q){
        var k = q.toLowerCase();
        var list = objectTabularSections(obj.id).filter(function(ts){ return !k || ts.toLowerCase().indexOf(k) >= 0; })
          .map(function(ts){ return {value:ts, label:ts, sub:'табличная часть'}; });
        if (!q) list.unshift({value:'', label:ATTR_HEADER_TITLE, sub:'реквизиты шапки'});
        return list;
      },
      createLabel:function(q){
        if (!q) return null;
        var k = q.toLowerCase();
        return objectTabularSections(obj.id).some(function(ts){ return ts.toLowerCase() === k; }) ? null : '+ Создать табличную часть «' + q + '»';
      },
      onPick:function(it){ tsIn.value = it.value; tsErr.hidden = true; }
    });
    function save(){
      var name = normalizeLabel(nameIn.value);
      var ts = canonicalLabel(tsIn.value, objectTabularSections(obj.id));
      var te = tabularSectionError(ts);
      tsErr.textContent = te; tsErr.hidden = !te;
      var ne = attributeNameError(name, obj.id, ts);
      nameErr.textContent = ne; nameErr.hidden = !ne;
      if (ne){ nameIn.focus(); return; }
      if (te){ tsIn.focus(); return; }
      createAttribute({objectId:obj.id, name:name, synonym:normalizeLabel(synIn.value), valueType:normalizeLabel(typeIn.value), tabularSection:ts});
      tsIn.value = ts;
      nameIn.value = ''; synIn.value = ''; typeIn.value = '';
      attributesChanged(obj, panel);
      nameIn.focus();
    }
    host.querySelector('.attr-add').addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); save(); }
      else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); host.innerHTML = ''; btn.focus(); }
    });
    nameIn.addEventListener('input', function(){ nameErr.hidden = true; });
    tsIn.addEventListener('input', function(){ tsErr.hidden = true; });
    nameIn.focus();
  });
}
function resizeCanvas(){
  var wrap = document.getElementById('canvas-wrap');
  var rect = wrap.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  canvasEl.width = Math.round(rect.width*dpr);
  canvasEl.height = Math.round(rect.height*dpr);
  canvasEl.style.width = rect.width+'px';
  canvasEl.style.height = rect.height+'px';
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
  viewportWidth = rect.width; viewportHeight = rect.height;
  if (!viewInitialized){ view.offsetX = rect.width/2; view.offsetY = rect.height/2; viewInitialized = true; }
  requestRender();
}

function attachHandlers(){
  canvasEl.addEventListener('mousedown', onMouseDown);
  canvasEl.addEventListener('mousemove', onMouseMove);
  window.addEventListener('mouseup', onMouseUp);
  canvasEl.addEventListener('wheel', onWheel, {passive:false});
  canvasEl.addEventListener('dblclick', onDblClick);
  canvasEl.addEventListener('mouseleave', hideCanvasTooltip);
  document.getElementById('btn-exit-focus').addEventListener('click', function(){ exitFocus(); });
  bindMinimap();
  window.addEventListener('resize', resizeCanvas);

  /* «Механизмы: узлами» = полный режим (объекты и механизмы), «связями» — только объекты. */
  syncMechModeUI();
  document.querySelectorAll('.mech-mode-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var next = btn.getAttribute('data-mode');
      /* Во время фокуса переключатель выводит из фокуса и возвращает прежний режим. */
      if (focusMode){ exitFocus(true); if (next === currentMode){ syncMechModeUI(); return; } }
      if (next === currentMode) return;
      currentMode = next;
      try{ localStorage.setItem(MECH_MODE_KEY, currentMode); }catch(e){}
      syncMechModeUI();
      clearSelection();
      syncGraphModel();
    });
  });

  document.querySelectorAll('.view-toggle .mode-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.view-toggle .mode-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      switchView(btn.getAttribute('data-view'));
    });
  });

  document.getElementById('list-search').addEventListener('input', function(ev){
    listSearch[listTab] = ev.target.value;
    renderListView();
  });
  document.querySelectorAll('.list-tab').forEach(function(tab){
    tab.addEventListener('click', function(){ setListTab(tab.getAttribute('data-list-tab')); });
  });
  document.addEventListener('mousedown', function(e){
    closeListDropdowns(e.target.closest ? e.target.closest('.multi-select[data-ms]') : null);
  });
  /* «+ Объект» / «+ Механизм»: как в левой панели — сущность создана, карточка открыта,
     курсор в поле названия. Поиск и отборы вкладки сбрасываются, чтобы строка была видна. */
  document.getElementById('btn-list-add').addEventListener('click', function(){
    listSearch[listTab] = '';
    document.getElementById('list-search').value = '';
    var f = listFilters[listTab]; Object.keys(f).forEach(function(k){ f[k] = {}; });
    if (listTab === 'objects'){
      var obj = createObject({name:'Новый объект'});
      renderListView();
      selectEntity('obj', obj.id);
      startInlineTitleEdit(document.getElementById('panel-object'));
    } else if (listTab === 'roles'){
      var role = createRole({name:'Новая роль'});
      renderListView();
      selectEntity('role', role.id);
      startInlineTitleEdit(document.getElementById('panel-role'));
    } else {
      var m = createMechanism({title:'Новый механизм'});
      renderListView();
      selectEntity('mech', m.id);
      startInlineTitleEdit(document.getElementById('panel-mechanism'));
    }
  });
  watchListWidth();
  bindMultiSelectToggle(document.querySelector('[data-ms="side-sub"]'));

  setupResizeHandle('resize-left', 'left');
  setupResizeHandle('resize-right', 'right');

  function addObjectFromUI(){
    openQuickCreateObject(function(obj){
      pinnedNodeId='obj:'+obj.id; pinnedMechanismId=null; pinnedEdgeKey=null;
      renderObjectPanel(obj); syncSidebarActive(); requestRender();
    });
  }
  function addMechanismFromUI(){
    var m = createMechanism({title:'Новый механизм'});
    pinnedMechanismId = m.id; pinnedNodeId=null; pinnedEdgeKey=null;
    renderMechanismPanel(m); syncSidebarActive(); requestRender();
  }
  /* «+ Объект» / «+ Механизм»: один клик — сущность создана, карточка справа открыта,
     курсор в поле названия. Поиск и фильтры вкладки сбрасываются, чтобы новая строка
     была видна в списке. */
  function resetSideFilters(){
    sideSearch[sideTab] = '';
    document.getElementById('search-input').value = '';
    if (sideTab === 'objects'){
      sideSubFilter = {};
      document.getElementById('filter-tag').value = '';
    } else {
      document.getElementById('filter-mechcategory').value = '';
    }
  }
  function focusNameField(selector){ startInlineTitleEdit(document.querySelector(selector)); }
  document.getElementById('btn-side-add').addEventListener('click', function(){
    resetSideFilters();
    if (sideTab === 'objects'){
      var obj = createObject({name:'Новый объект'});
      pinnedNodeId='obj:'+obj.id; pinnedMechanismId=null; pinnedEdgeKey=null;
      renderObjectPanel(obj); syncSidebarActive(); requestRender();
      focusNameField('#panel-object');
    } else {
      addMechanismFromUI();
      focusNameField('#panel-mechanism');
    }
  });

  /* Наведение на строку списка подсвечивает узел на графе, как наведение на сам узел.
     Делегирование на контейнер — строки перерисовываются, а контейнер остаётся. */
  var sideList = document.getElementById('object-list');
  sideList.addEventListener('mouseover', function(e){
    var row = e.target.closest('.list-row');
    var next = row ? {kind:row.getAttribute('data-kind'), id:row.getAttribute('data-id')} : null;
    var same = (next && listHover && next.kind === listHover.kind && next.id === listHover.id) || (!next && !listHover);
    if (same) return;
    listHover = next;
    requestRender();
  });
  sideList.addEventListener('mouseleave', function(){
    if (!listHover) return;
    listHover = null;
    requestRender();
  });
  document.getElementById('btn-add-object-empty').addEventListener('click', addObjectFromUI);

  document.querySelectorAll('#sidebar-left .side-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      var next = tab.getAttribute('data-side');
      if (next === sideTab) return;
      sideTab = next;
      document.querySelectorAll('#sidebar-left .side-tab').forEach(function(t){ t.classList.toggle('active', t === tab); });
      var isObj = sideTab === 'objects';
      document.getElementById('side-filters-objects').hidden = !isObj;
      document.getElementById('side-filters-mechanisms').hidden = isObj;
      var search = document.getElementById('search-input');
      search.value = sideSearch[sideTab];
      search.placeholder = isObj ? 'Поиск объектов…' : 'Поиск механизмов…';
      var addBtn = document.getElementById('btn-side-add');
      addBtn.title = isObj ? 'Создать объект' : 'Создать механизм';
      addBtn.setAttribute('aria-label', addBtn.title);
      renderSidebar();
    });
  });
  document.getElementById('search-input').addEventListener('input', function(ev){
    sideSearch[sideTab] = ev.target.value;
    renderSidebar();
  });
  syncDeprecatedSwitches();
  document.querySelectorAll('.toggle-deprecated').forEach(function(cb){ cb.addEventListener('change', function(ev){
    showDeprecated = ev.target.checked;
    syncDeprecatedSwitches();
    try{ localStorage.setItem(SHOW_DEPRECATED_KEY, showDeprecated ? '1' : '0'); }catch(e){}
    if (focusMode) exitFocus(true);
    syncGraphModel(); renderSidebar();
    if (currentView === 'list') renderListView();
  }); });
  document.getElementById('filter-tag').addEventListener('change', renderSidebar);
  document.getElementById('filter-mechcategory').addEventListener('change', renderSidebar);

  document.getElementById('btn-settings').addEventListener('click', function(){
    openSettingsModal();
  });

  document.getElementById('btn-zoom-in').addEventListener('click', function(){ zoomBy(ZOOM_STEP); });
  document.getElementById('btn-zoom-out').addEventListener('click', function(){ zoomBy(1/ZOOM_STEP); });
  document.getElementById('btn-fit').addEventListener('click', fitToScreen);
  /* Легенда: при первом запуске (нет сохранённого состояния) развёрнута, дальше — как оставил пользователь. */
  var LEGEND_OPEN_KEY = 'nodusLegendOpen';
  (function(){
    var open = true;
    try{ open = localStorage.getItem(LEGEND_OPEN_KEY) !== '0'; }catch(e){}
    document.getElementById('legend-body').hidden = !open;
    document.getElementById('legend-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  })();
  document.getElementById('legend-toggle').addEventListener('click', function(ev){
    var body = document.getElementById('legend-body');
    body.hidden = !body.hidden;
    ev.currentTarget.setAttribute('aria-expanded', body.hidden ? 'false' : 'true');
    try{ localStorage.setItem(LEGEND_OPEN_KEY, body.hidden ? '0' : '1'); }catch(e){}
  });
  document.getElementById('btn-relayout').addEventListener('click', function(){
    if (focusMode) exitFocus(true);
    Object.keys(state.objects).forEach(function(id){ state.objects[id].fx=null; state.objects[id].fy=null; });
    Object.keys(state.mechanisms).forEach(function(id){ state.mechanisms[id].fx=null; state.mechanisms[id].fy=null; });
    pendingInitialFit = true;
    var spread = initialSpread(nodeById.size, 200);
    nodeById.forEach(function(n){
      n.fx=null; n.fy=null;
      n.x=(Math.random()-0.5)*2*spread; n.y=(Math.random()-0.5)*2*spread; n.vx=0; n.vy=0;
    });
    sim.alpha = 1;
    persist();
    requestRender();
  });

  function exportData(){
    var data = JSON.stringify(serializeState(), null, 2);
    var blob = new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'object-graph-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  document.getElementById('btn-export').addEventListener('click', exportData);
  document.getElementById('btn-import').addEventListener('click', function(){
    document.getElementById('file-import').click();
  });
  document.getElementById('file-import').addEventListener('change', function(ev){
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); }
      catch(e){ alert('Не удалось прочитать файл: это не корректный JSON.'); ev.target.value=''; return; }
      openModal({
        title:'Импортировать данные?',
        bodyHTML:'<p>Текущие данные (' + dataSummary(serializeState()) + ') будут заменены содержимым файла (' + dataSummary(data) + '). Это необратимо.</p>',
        footerButtons:[
          {label:'Отмена', onClick:function(){ return true; }},
          {label:'Импортировать', variant:'danger', onClick:function(){
            applyState(data);
            nodeById.clear();
            persist(); syncGraphModel(); renderSidebar(); updateStats(); clearSelection();
          }}
        ]
      });
      ev.target.value = '';
    };
    reader.readAsText(file);
  });

  /* Очистка: подтверждение вводом слова, логика удаления прежняя. */
  var RESET_CONFIRM_WORD = 'удалить';
  document.getElementById('btn-reset').addEventListener('click', function(){
    var ac = 0;
    Object.keys(state.objects).forEach(function(id){ ac += (state.objects[id].attachments||[]).length; });
    Object.keys(state.mechanisms).forEach(function(id){ ac += (state.mechanisms[id].attachments||[]).length; });
    function confirmed(root){
      var input = root.querySelector('#reset-confirm-input');
      return !!input && input.value.trim().toLowerCase() === RESET_CONFIRM_WORD;
    }
    openModal({
      title:'Очистить все данные?',
      wide:true,
      bodyHTML:
        '<p>Будет удалено: ' + dataSummary(serializeState()) + ' и ' +
          ac + ' ' + pluralRu(ac,'вложение','вложения','вложений') + '. Действие необратимо.</p>' +
        '<p class="confirm-note">Сами файлы вложений в подключённой папке останутся на диске.</p>' +
        '<label class="field-label confirm-input" for="reset-confirm-input">Чтобы подтвердить, введите слово «' + RESET_CONFIRM_WORD + '»</label>' +
        '<input type="text" class="field-input" id="reset-confirm-input" autocomplete="off">',
      footerButtons:[
        {label:'Отмена', onClick:function(){ return true; }},
        {label:'Сначала сделать экспорт', onClick:function(){ exportData(); return false; }},
        {label:'Удалить всё', variant:'danger', onClick:function(root){
          if (!confirmed(root)) return false;
          emptyState(); nodeById.clear();
          persist(); syncGraphModel(); renderSidebar(); updateStats(); clearSelection();
        }}
      ]
    });
    var root = document.getElementById('modal-root');
    var buttons = root.querySelectorAll('.modal-footer .btn');
    var deleteBtn = buttons[buttons.length-1];
    var input = root.querySelector('#reset-confirm-input');
    deleteBtn.disabled = true;
    input.addEventListener('input', function(){ deleteBtn.disabled = !confirmed(root); });
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && confirmed(root)) deleteBtn.click(); });
    input.focus();
  });

  /* Меню «⋯» */
  var moreBtn = document.getElementById('btn-more');
  var moreMenu = document.getElementById('more-menu');
  function setMoreMenuOpen(open){
    moreMenu.hidden = !open;
    moreBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open){ var first = moreMenu.querySelector('.menu-item'); if (first) first.focus(); }
  }
  moreBtn.addEventListener('click', function(){ setMoreMenuOpen(moreMenu.hidden); });
  moreMenu.querySelectorAll('.menu-item').forEach(function(item){
    item.addEventListener('click', function(){ setMoreMenuOpen(false); });
  });
  moreMenu.addEventListener('keydown', function(e){
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    var items = Array.prototype.slice.call(moreMenu.querySelectorAll('.menu-item'));
    var i = items.indexOf(document.activeElement);
    items[(i + (e.key==='ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  });
  document.addEventListener('mousedown', function(e){
    if (!moreMenu.hidden && !moreMenu.parentNode.contains(e.target)) setMoreMenuOpen(false);
  });

  bindGlobalSearch();

  window.addEventListener('keydown', function(e){
    if (currentView === 'list' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.altKey && !e.ctrlKey && !e.metaKey &&
        !document.getElementById('detail-panel').hidden && !document.getElementById('modal-root').innerHTML && !isTypingTarget(document.activeElement)){
      e.preventDefault();
      moveListSelection(e.key === 'ArrowDown' ? 1 : -1);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'k' || e.key === 'K' || e.code === 'KeyK')){
      e.preventDefault();
      var gs = document.getElementById('global-search-input');
      gs.focus(); gs.select();
      return;
    }
    if (e.key === 'Escape'){
      if (!document.getElementById('more-menu').hidden){ document.getElementById('more-menu').hidden = true; document.getElementById('btn-more').setAttribute('aria-expanded','false'); document.getElementById('btn-more').focus(); }
      else if (closeListDropdowns()){}
      else if (document.getElementById('modal-root').innerHTML) closeModal();
      else if (focusMode) exitFocus();
      else clearSelection();
    }
  });
}

function init(){
  readTheme();
  canvasEl = document.getElementById('graph-canvas');
  ctx2d = canvasEl.getContext('2d');

  var filterMechCategorySelect = document.getElementById('filter-mechcategory');
  MECH_CATEGORIES.forEach(function(c){
    var opt = document.createElement('option');
    opt.value = c.code; opt.textContent = c.title;
    filterMechCategorySelect.appendChild(opt);
  });

  loadPersisted();
  tryRestoreFolder();
  loadPanelWidths();
  applyPanelWidths();
  attachHandlers();
  resizeCanvas();
  updateStats();
  renderSidebar();
  syncGraphModel();
  requestRender();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
